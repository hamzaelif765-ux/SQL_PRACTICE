rn reasons daily and monthly.", "examples": [{"title": "Subscribers", "sql": "SELECT plan, COUNT(*) AS subs FROM telecom_subscribers GROUP BY plan;"}], "exercises": [{"id": "m15-l04-e1", "level": "medium", "task": "ARPU per plan (revenue of recharges / distinct subscribers who recharged), rounded to 2: plan, arpu, ordered by plan.", "starter": "SELECT ", "hint1": "Join subscribers to recharges.", "hint2": "SUM(amount) / COUNT(DISTINCT sub_id).", "solution": "SELECT s.plan, ROUND(1.0 * SUM(r.amount) / COUNT(DISTINCT s.sub_id), 2) AS arpu FROM telecom_subscribers s JOIN recharges r ON r.sub_id = s.sub_id GROUP BY s.plan ORDER BY s.plan;", "explain": ["divide revenue by distinct subscribers"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l04-e2", "level": "easy", "task": "Churn reasons: reason and n, most common first then reason.", "starter": "SELECT ", "hint1": "GROUP BY reason.", "hint2": "ORDER BY n DESC, reason.", "solution": "SELECT reason, COUNT(*) AS n FROM churn GROUP BY reason ORDER BY n DESC, reason;", "explain": ["count per reason"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l04-e3", "level": "hard", "task": "First 6 months of recharge revenue: ym, rev, rolling3 (average of rev over this and previous 2 months, rounded to 1).", "starter": "SELECT ", "hint1": "Monthly revenue in a CTE.", "hint2": "AVG(rev) OVER (... ROWS BETWEEN 2 PRECEDING AND CURRENT ROW).", "solution": "WITH m AS (SELECT strftime('%Y-%m', recharge_date) AS ym, SUM(amount) AS rev FROM recharges GROUP BY ym) SELECT ym, rev, ROUND(AVG(rev) OVER (ORDER BY ym ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 1) AS rolling3 FROM m ORDER BY ym LIMIT 6;", "explain": ["rolling window of 3 months"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m15-l05", "module": "Module 15 - Advanced analytics SQL", "title": "Data cleaning, quality checks and reconciliation", "order": 42, "level": "advanced", "estimatedMinutes": 25, "prerequisites": ["m15-l04"], "engines": ["sqlite"], "dataset": "dirty", "theory": "Real data is messy. **Cleaning patterns:** TRIM spaces, standardise case, map variants (Bombay = Mumbai), convert blanks to NULL, validate numbers (`GLOB '[0-9]*'` in SQLite, `~` or `TRY_CAST` elsewhere), remove duplicates (Module 9). **Reconciliation** compares source vs target: row counts, totals, and missing/extra keys - the result should be zero mismatches.\n\nIndustry use: before any report ships, analysts prove the numbers match the source system.", "examples": [{"title": "Look at the mess", "sql": "SELECT id, city, age FROM dirty_customers LIMIT 8;"}], "exercises": [{"id": "m15-l05-e1", "level": "medium", "task": "Ids 1 to 10: id and city_clean: Bombay/Mumbai (any case/spaces) -> 'Mumbai', otherwise first letter upper and rest lower of the trimmed city. Order by id.", "starter": "SELECT ", "hint1": "CASE on UPPER(TRIM(city)).", "hint2": "ELSE: UPPER(SUBSTR(...,1,1)) || LOWER(SUBSTR(...,2)).", "solution": "SELECT id, CASE WHEN UPPER(TRIM(city)) IN ('BOMBAY','MUMBAI') THEN 'Mumbai' ELSE UPPER(SUBSTR(TRIM(city),1,1)) || LOWER(SUBSTR(TRIM(city),2)) END AS city_clean FROM dirty_customers WHERE id <= 10 ORDER BY id;", "explain": ["map known variants, fix case for the rest"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l05-e2", "level": "medium", "task": "Count rows with an invalid age as bad_age: age is NULL, not all digits (use GLOB '[0-9]*'), or below 18.", "starter": "SELECT ", "hint1": "Three OR conditions.", "hint2": "age NOT GLOB '[0-9]*' catches 'N/A' and '-1'.", "solution": "SELECT COUNT(*) AS bad_age FROM dirty_customers WHERE age IS NULL OR age NOT GLOB '[0-9]*' OR CAST(age AS INTEGER) < 18;", "explain": ["validate text-typed numbers before casting"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l05-e3", "level": "hard", "task": "Reconciliation: mismatches = number of payments whose amount differs from the sum of that order's items (quantity*unit_price) by more than 0.01.", "starter": "SELECT ", "hint1": "Sum items per order in a derived table.", "hint2": "Join to payments and compare with ABS(...) > 0.01.", "solution": "SELECT COUNT(*) AS mismatches FROM payments p JOIN (SELECT order_id, SUM(quantity * unit_price) AS t FROM order_items GROUP BY order_id) i ON i.order_id = p.order_id WHERE ABS(p.amount - i.t) > 0.01;", "explain": ["0 mismatches means source and target agree"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}]}, {"id": "m16-l01", "module": "Module 16 - Data warehousing", "title": "Data warehousing: star schema, ETL and the modern stack", "order": 43, "level": "advanced", "estimatedMinutes": 25, "prerequisites": ["m15-l05"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**OLTP** systems run the business (many small writes). **OLAP** / **data warehouses** answer questions (big reads). A **data lake** stores raw files; a **lakehouse** adds table features on top. In a **star schema** one **fact** table (measurable events like sales) links to **dimension** tables (customer, product, date); a **snowflake schema** normalizes the dimensions further.\n\n**SCD (slowly changing dimensions):** Type 1 overwrite, Type 2 keep history with new rows and valid-from/valid-to dates, Type 3 keep previous value in a column. **ETL** transforms before loading, **ELT** loads raw data then transforms inside the warehouse. Use **staging** layers, **incremental loads** (only new/changed rows) and **CDC** (change data capture). **dbt** turns SELECT files into tested, documented models with lineage; **Airflow** schedules pipelines. **Columnar storage** makes analytics fast. Cloud warehouses: Snowflake, BigQuery, Redshift, Synapse, Databricks SQL.", "examples": [{"title": "Fact grain", "sql": "SELECT COUNT(*) AS item_rows FROM order_items;"}], "exercises": [{"id": "m16-l01-e1", "level": "medium", "task": "Build dimension dim_product(product_id, name, category_name) from products joined to categories.", "starter": "CREATE TABLE ", "hint1": "CREATE TABLE ... AS SELECT.", "hint2": "Join products to categories.", "solution": "CREATE TABLE dim_product AS SELECT p.product_id, p.name, c.category_name FROM products p JOIN categories c ON c.category_id = p.category_id;", "explain": ["a dimension holds descriptive attributes"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS n, COUNT(DISTINCT category_name) AS cats FROM dim_product"}}, {"id": "m16-l01-e2", "level": "hard", "task": "Build fact_sales(order_item_id, customer_id, product_id, order_date, revenue) with one row per order item; revenue = quantity*unit_price.", "starter": "CREATE TABLE ", "hint1": "One row per order item.", "hint2": "Join order_items to orders for customer and date.", "solution": "CREATE TABLE fact_sales AS SELECT oi.order_item_id, o.customer_id, oi.product_id, o.order_date, oi.quantity * oi.unit_price AS revenue FROM order_items oi JOIN orders o ON o.order_id = oi.order_id;", "explain": ["fact table = measures + keys to dimensions"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS n, ROUND(SUM(revenue),2) AS total FROM fact_sales"}}]}, {"id": "m17-l01", "module": "Module 17 - Security and administration", "title": "Security: injection, masking, roles and backups", "order": 44, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m16-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**SQL injection** happens when user input is pasted into SQL text. Input `x' OR '1'='1` turns `WHERE name = 'input'` into a condition that is always true. **Prevention:** parameterized queries (Python: `cursor.execute('SELECT * FROM customers WHERE name = ?', (name,))`), least-privilege accounts, never build SQL by string concatenation.\n\n**Access control:** users and roles, `GRANT SELECT ON t TO analyst`, `REVOKE`, least privilege, row-level security (PostgreSQL `CREATE POLICY`), data masking, encryption at rest and in transit. **Operations:** backup and restore, point-in-time recovery, replication and high availability, monitoring slow queries, audit logs. **PII and compliance:** limit and mask personal data (email, phone); know your rules (GDPR, India's DPDP Act). Users/GRANT are not available in SQLite, so those parts are theory.", "examples": [{"title": "Normal login query", "sql": "SELECT COUNT(*) FROM customers WHERE name = 'Aarav Shah';"}], "exercises": [{"id": "m17-l01-e1", "level": "medium", "task": "Injection demo: an app runs WHERE name = '<input>'. Write the final query for input  x' OR '1'='1  and return rows_leaked = number of rows it returns.", "starter": "SELECT ", "hint1": "The input closes the quote and adds OR '1'='1'.", "hint2": "Result: every customer row.", "solution": "SELECT COUNT(*) AS rows_leaked FROM customers WHERE name = 'x' OR '1'='1';", "explain": ["the always-true OR leaks the whole table", "parameterized queries stop this"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m17-l01-e2", "level": "hard", "task": "Create view v_customers_masked(customer_id, email_masked, city) where email_masked = first 2 letters + '***' + the part from '@' onward.", "starter": "CREATE VIEW ", "hint1": "SUBSTR for the first 2 characters.", "hint2": "INSTR finds '@', SUBSTR from there.", "solution": "CREATE VIEW v_customers_masked AS SELECT customer_id, SUBSTR(email,1,2) || '***' || SUBSTR(email, INSTR(email,'@')) AS email_masked, city FROM customers;", "explain": ["masking views hide raw PII from analysts"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT customer_id, email_masked FROM v_customers_masked ORDER BY customer_id LIMIT 3"}}]}, {"id": "m18-l01", "module": "Module 18 - SQL in the real world", "title": "SQL in the real world: MIS reports and workflow", "order": 45, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": ["m17-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Who uses SQL:** analysts (questions and reports), data engineers (pipelines), BI developers (dashboards), backend developers (applications). **Workflow:** read the ticket, find the right tables in the data dictionary, write a small query, check row counts, reconcile with a known total, document assumptions, get a code review, save to Git, schedule or share.\n\n**Environments:** dev (experiment), test/UAT (verify), prod (live, read carefully, no experiments). **Good SQL:** readable CTEs, clear aliases, comments for business rules, reusable views. **MIS reports** are daily/weekly/monthly summaries; **KPI dashboards** read from views. **Ad-hoc requests:** clarify the metric definition first, then answer with the number and the caveats, in plain language.", "examples": [{"title": "Daily payments", "sql": "SELECT paid_date, COUNT(*) AS payments, ROUND(SUM(amount),2) AS total FROM payments GROUP BY paid_date LIMIT 5;"}], "exercises": [{"id": "m18-l01-e1", "level": "medium", "task": "Monthly MIS (first 6 months): ym, orders, delivered, cancelled, ordered by ym.", "starter": "SELECT ", "hint1": "Group by month.", "hint2": "Conditional SUMs for delivered and cancelled.", "solution": "SELECT strftime('%Y-%m', order_date) AS ym, COUNT(*) AS orders, SUM(CASE WHEN status = 'Delivered' THEN 1 ELSE 0 END) AS delivered, SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) AS cancelled FROM orders GROUP BY ym ORDER BY ym LIMIT 6;", "explain": ["a typical MIS summary row per month"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m18-l01-e2", "level": "hard", "task": "Create view v_daily_mis(day, payments, total_amount) with one row per paid_date: day = paid_date, payments = count, total_amount = sum of amount.", "starter": "CREATE VIEW ", "hint1": "GROUP BY paid_date.", "hint2": "Alias paid_date AS day.", "solution": "CREATE VIEW v_daily_mis AS SELECT paid_date AS day, COUNT(*) AS payments, SUM(amount) AS total_amount FROM payments GROUP BY paid_date;", "explain": ["BI tools connect to views like this"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS days, ROUND(SUM(total_amount),2) AS grand FROM v_daily_mis"}}]}, {"id": "m19-l01", "module": "Module 19 - Database types and dialects", "title": "Relational databases compared", "order": 46, "level": "beginner", "estimatedMinutes": 20, "prerequisites": ["m18-l01"], "engines": ["sqlite"], "dataset": "dirty", "theory": "Every relational database speaks SQL, but each adds its own features. Only SQLite runs inside this website; the rest are described here so you can recognise and use them at work.\n\n| Database | License / cost | Strengths | Typical use | Default port | Common tools |\n| PostgreSQL | Open source, free | standards, extensions, JSON, reliability | apps, analytics, GIS | 5432 | pgAdmin, psql, DBeaver |\n| MySQL | Open source (Oracle), free plus paid editions | simple, fast reads, huge ecosystem | web apps, WordPress | 3306 | MySQL Workbench |\n| MariaDB | Open source MySQL fork | MySQL-compatible, community-driven | web apps | 3306 | HeidiSQL, DBeaver |\n| SQLite | Public domain, free | zero setup, one file, embedded | mobile apps, local tools | none (file) | sqlite3, DB Browser |\n| SQL Server | Commercial (free Express and Developer) | T-SQL, Microsoft BI stack | enterprises, Microsoft shops | 1433 | SSMS, Azure Data Studio |\n| Oracle Database | Commercial (free XE) | scale, PL/SQL, enterprise features | banks, telecom, ERP | 1521 | SQL Developer |\n| IBM Db2 | Commercial | mainframe reliability | banks, insurers | 50000 | Data Studio |\n\n**Rule of thumb:** same SELECT/JOIN/GROUP BY everywhere; differences appear in functions, dates, auto-numbering and procedural code (next lessons).", "examples": [{"title": "Same SQL, any engine", "sql": "SELECT id, COALESCE(email,'none') AS email FROM dirty_customers LIMIT 5;"}], "exercises": [{"id": "m19-l01-e1", "level": "easy", "task": "Oracle writes NVL(email,'none'). Write the SQLite equivalent: id and email for dirty_customers ids 1 to 5, ordered by id.", "starter": "SELECT ", "hint1": "COALESCE is the standard version.", "hint2": "COALESCE(email,'none').", "solution": "SELECT id, COALESCE(email,'none') AS email FROM dirty_customers WHERE id <= 5 ORDER BY id;", "explain": ["COALESCE works in every engine"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m19-l01-e2", "level": "easy", "task": "SQL Server writes SELECT TOP 3 name, price ... ORDER BY price DESC. Write the SQLite version for products (name, price).", "starter": "SELECT ", "hint1": "SQLite uses LIMIT at the end.", "hint2": "ORDER BY price DESC LIMIT 3.", "solution": "SELECT name, price FROM products ORDER BY price DESC LIMIT 3;", "explain": ["TOP n becomes LIMIT n"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}]}, {"id": "m19-l02", "module": "Module 19 - Database types and dialects", "title": "Cloud and analytical databases", "order": 47, "level": "intermediate", "estimatedMinutes": 20, "prerequisites": ["m19-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Analytical engines store data by **column**, so scanning a few columns over millions of rows is fast.\n\n| Engine | Model / cost | Strengths | Typical use | Port | Tools |\n| Snowflake | Cloud, pay for compute and storage | separate compute and storage, easy scaling | company data warehouse | 443 (HTTPS) | Snowsight, SnowSQL, DBeaver |\n| Google BigQuery | Serverless, pay per data scanned | no servers, huge scale | analytics on GCP | 443 (HTTPS) | BigQuery console, bq CLI |\n| Amazon Redshift | AWS warehouse, PostgreSQL-based | AWS integration | AWS data warehouse | 5439 | Query editor, DBeaver |\n| Azure Synapse | Azure warehouse | Microsoft ecosystem | Azure analytics | 1433 | Synapse Studio, SSMS |\n| Databricks SQL | Lakehouse, pay for compute | SQL on data lake files | big data and ML | 443 (HTTPS) | Databricks SQL editor |\n| DuckDB | Open source, embedded, free | fast local analytics, reads CSV/Parquet | laptops, notebooks | none (file) | duckdb CLI, Python |\n| ClickHouse | Open source columnar | very fast aggregations | logs, event analytics | 8123 / 9000 | clickhouse-client |\n| Amazon Aurora / RDS | Managed MySQL or PostgreSQL | backups and failover handled for you | application databases | 3306 / 5432 | any MySQL or PostgreSQL tool |\n\nDialect hints: Snowflake and BigQuery have `DATE_TRUNC`, `QUALIFY` (filter on window functions), semi-structured JSON types; BigQuery quotes names with backtick characters and has no auto-increment.", "examples": [{"title": "Month start", "sql": "SELECT order_id, date(order_date,'start of month') AS month_start FROM orders LIMIT 3;"}], "exercises": [{"id": "m19-l02-e1", "level": "easy", "task": "Snowflake writes name || ' (' || city || ')'. Customers 1 to 3: customer_id and label (name followed by city in brackets), ordered by customer_id.", "starter": "SELECT ", "hint1": "|| joins text in SQLite.", "hint2": "name || ' (' || city || ')'.", "solution": "SELECT customer_id, name || ' (' || city || ')' AS label FROM customers WHERE customer_id <= 3 ORDER BY customer_id;", "explain": ["same operator as PostgreSQL and Snowflake"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m19-l02-e2", "level": "medium", "task": "Snowflake writes DATE_TRUNC('month', order_date). SQLite version: orders 1 to 3, order_id and month_start, ordered by order_id.", "starter": "SELECT ", "hint1": "SQLite uses date(x,'start of month').", "hint2": "date(order_date,'start of month').", "solution": "SELECT order_id, date(order_date,'start of month') AS month_start FROM orders WHERE order_id <= 3 ORDER BY order_id;", "explain": ["each engine names this differently"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m19-l03", "module": "Module 19 - Database types and dialects", "title": "SQL vs NoSQL vs NewSQL", "order": 48, "level": "beginner", "estimatedMinutes": 15, "prerequisites": ["m19-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**NoSQL** stores data without fixed tables:\n- **MongoDB** (documents/JSON): flexible records, catalogues, content apps.\n- **Redis** (key-value, in memory): caching, sessions, leaderboards.\n- **Cassandra** (wide-column): huge write volumes spread over many servers.\n- **DynamoDB** (key-value, AWS): serverless apps with predictable access by key.\n- **Elasticsearch** (search index): full-text search and log search.\n\n**NewSQL** (CockroachDB, TiDB, Google Spanner) keeps SQL and ACID transactions but scales across many servers.\n\n**Choose SQL** when data is structured, relationships matter, you need joins, reports and transactions. **Choose NoSQL** when the shape changes often, you need extreme scale or simple key lookups, or you are searching text. Many companies use both: SQL as the source of truth, NoSQL or search as helpers.", "examples": [{"title": "Mongo thinking in SQL", "sql": "SELECT name, price FROM products WHERE price > 4000 ORDER BY price DESC LIMIT 3;"}], "exercises": [{"id": "m19-l03-e1", "level": "easy", "task": "MongoDB: db.products.find({price: {$gt: 4000}}).sort({price: -1}). Write the SQL: name and price of products over 4000, most expensive first.", "starter": "SELECT ", "hint1": "$gt means greater than.", "hint2": "WHERE price > 4000 ORDER BY price DESC.", "solution": "SELECT name, price FROM products WHERE price > 4000 ORDER BY price DESC;", "explain": ["find filter = WHERE", "sort -1 = DESC"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m19-l04", "module": "Module 19 - Database types and dialects", "title": "Syntax differences cheat table", "order": 49, "level": "intermediate", "estimatedMinutes": 20, "prerequisites": ["m19-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Translate between engines using this table (pipe-pipe means the double vertical bar operator).\n\n| Task | SQLite | PostgreSQL | MySQL | SQL Server | Oracle | Snowflake | BigQuery |\n| Limit rows | LIMIT n | LIMIT n | LIMIT n | TOP n or OFFSET FETCH | FETCH FIRST n ROWS ONLY | LIMIT n | LIMIT n |\n| Join text | pipe-pipe | pipe-pipe or CONCAT | CONCAT | plus sign or CONCAT | pipe-pipe | pipe-pipe or CONCAT | CONCAT |\n| Today | date('now') | CURRENT_DATE | CURDATE() | CAST(GETDATE() AS DATE) | TRUNC(SYSDATE) | CURRENT_DATE | CURRENT_DATE() |\n| Days between | julianday(a) - julianday(b) | a - b | DATEDIFF(a,b) | DATEDIFF(day,b,a) | a - b | DATEDIFF(day,b,a) | DATE_DIFF(a,b,DAY) |\n| Auto id | INTEGER PRIMARY KEY | GENERATED AS IDENTITY | AUTO_INCREMENT | IDENTITY(1,1) | IDENTITY or sequence | AUTOINCREMENT | none |\n| Quote names | double quotes | double quotes | backtick quotes | square brackets | double quotes | double quotes | backtick quotes |\n| Boolean | 0 and 1 | BOOLEAN | TINYINT(1) | BIT | NUMBER(1) | BOOLEAN | BOOL |\n| Upsert | ON CONFLICT | ON CONFLICT | ON DUPLICATE KEY UPDATE | MERGE | MERGE | MERGE | MERGE |\n| Procedural code | triggers only | PL/pgSQL | stored procedures | T-SQL | PL/SQL | Snowflake Scripting | BigQuery scripting |\n| If/else in query | CASE (IIF in 3.32+) | CASE | CASE, IF() | CASE, IIF() | CASE, DECODE | CASE, IFF() | CASE, IF() |\n\nBest practice: write standard SQL (CASE, COALESCE, CAST, JOIN) first and use dialect-specific functions only where needed.", "examples": [{"title": "Standard version", "sql": "SELECT product_id, CASE WHEN price > 1000 THEN 'High' ELSE 'Low' END AS tier FROM products LIMIT 3;"}], "exercises": [{"id": "m19-l04-e1", "level": "medium", "task": "SQL Server writes IIF(price > 1000,'High','Low'). Write the portable CASE version: products 1 to 5, product_id and tier, ordered by product_id.", "starter": "SELECT ", "hint1": "CASE WHEN ... THEN ... ELSE ... END.", "hint2": "CASE WHEN price > 1000 THEN 'High' ELSE 'Low' END.", "solution": "SELECT product_id, CASE WHEN price > 1000 THEN 'High' ELSE 'Low' END AS tier FROM products WHERE product_id <= 5 ORDER BY product_id;", "explain": ["CASE works in every engine"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m19-l04-e2", "level": "medium", "task": "Oracle writes FETCH FIRST 3 ROWS ONLY. SQLite version: customer_id and name of the first 3 customers by customer_id.", "starter": "SELECT ", "hint1": "SQLite uses LIMIT.", "hint2": "ORDER BY customer_id LIMIT 3.", "solution": "SELECT customer_id, name FROM customers ORDER BY customer_id LIMIT 3;", "explain": ["syntax differs, result is the same"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m20-l01", "module": "Module 20 - Connecting to databases", "title": "How connections work, GUI clients and command line", "order": 50, "level": "beginner", "estimatedMinutes": 25, "prerequisites": ["m19-l04"], "engines": ["sqlite"], "dataset": "company", "theory": "When you **connect**, your **client** (a tool or program) opens a network session to the database **server** and logs in. You need: **host** (server address), **port**, **database**, **schema** (folder of tables), **user** and **password**. A **connection string/URL** packs these together, for example `postgresql://analyst@localhost:5432/shop`. A **driver** (ODBC, JDBC or a native library) translates between your tool and the database. **Connection pooling** reuses open connections so apps stay fast. **SSL/TLS** encrypts traffic. **Firewalls, VPNs and SSH tunnels** decide whether your machine can even reach the port.\n\n**GUI clients:** DBeaver (any database), pgAdmin (PostgreSQL), MySQL Workbench, SQL Server Management Studio (SSMS), Azure Data Studio, DataGrip, VS Code SQL extensions. In each: New Connection, choose the database type, enter host, port, database, user, password, Test Connection, then open a SQL editor, run a query and use Export to save results as CSV or Excel.\n\n**Command line:**\n```bash\npsql -h localhost -p 5432 -U analyst -d shop\nmysql -h localhost -P 3306 -u analyst -p shop\nsqlcmd -S localhost,1433 -U sa -P \"Change_me_1Strong\" -d master\nsqlite3 shop.db\n```", "examples": [{"title": "Port from a host string", "sql": "SELECT SUBSTR('db.example.com:5432', INSTR('db.example.com:5432', ':') + 1) AS port;"}], "exercises": [{"id": "m20-l01-e1", "level": "easy", "task": "Using string functions, return port: the text after the colon in 'db.example.com:5432'.", "starter": "SELECT ", "hint1": "INSTR finds the colon.", "hint2": "SUBSTR from the position after it.", "solution": "SELECT SUBSTR('db.example.com:5432', INSTR('db.example.com:5432', ':') + 1) AS port;", "explain": ["connection strings are just structured text"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m20-l02", "module": "Module 20 - Connecting to databases", "title": "Python: sqlite3, psycopg, MySQL, pyodbc, oracledb, SQLAlchemy, pandas", "order": 51, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": ["m20-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Rules:** never hard-code passwords (use environment variables, a `.env` file kept out of Git, or a secret manager); always use **parameterized queries**; close connections with a **context manager** (`with`).\n\n```python\n# SQLite (built in)\nimport sqlite3\nwith sqlite3.connect(\"shop.db\") as conn:\n    rows = conn.execute(\"SELECT name FROM products WHERE price > ?\", (1000,)).fetchall()\n\n# PostgreSQL: pip install \"psycopg[binary]\"\nimport os, psycopg\nwith psycopg.connect(host=\"localhost\", port=5432, dbname=\"shop\", user=\"analyst\",\n                     password=os.environ[\"PGPASSWORD\"]) as conn:\n    rows = conn.execute(\"SELECT name FROM products WHERE price > %s\", (1000,)).fetchall()\n\n# MySQL: pip install mysql-connector-python\nimport mysql.connector\nconn = mysql.connector.connect(host=\"localhost\", user=\"analyst\",\n                               password=os.environ[\"MYSQL_PWD\"], database=\"shop\")\ncur = conn.cursor(); cur.execute(\"SELECT name FROM products WHERE price > %s\", (1000,))\nrows = cur.fetchall(); conn.close()\n\n# SQL Server: pip install pyodbc  (needs ODBC Driver 18)\nimport pyodbc\nconn = pyodbc.connect(\"DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;\"\n                      \"DATABASE=shop;UID=analyst;PWD=\" + os.environ[\"MSSQL_PWD\"] + \";TrustServerCertificate=yes\")\nrows = conn.execute(\"SELECT name FROM products WHERE price > ?\", 1000).fetchall()\n\n# Oracle: pip install oracledb\nimport oracledb\nconn = oracledb.connect(user=\"analyst\", password=os.environ[\"ORA_PWD\"], dsn=\"localhost:1521/XEPDB1\")\nrows = conn.cursor().execute(\"SELECT name FROM products WHERE price > :p\", p=1000).fetchall()\n\n# SQLAlchemy + pandas\nimport pandas as pd\nfrom sqlalchemy import create_engine\nengine = create_engine(\"postgresql+psycopg://analyst:\" + os.environ[\"PGPASSWORD\"] + \"@localhost:5432/shop\")\ndf = pd.read_sql(\"SELECT * FROM products WHERE price > %(p)s\", engine, params={\"p\": 1000})\ndf.to_sql(\"products_copy\", engine, if_exists=\"replace\", index=False)\n```", "examples": [{"title": "What the driver sends", "sql": "SELECT COUNT(*) AS n FROM products WHERE category_id = 2 AND price > 1000;"}], "exercises": [{"id": "m20-l02-e1", "level": "easy", "task": "A driver runs WHERE category_id = ? AND price > ? with values (2, 1000). Write the final query returning n = number of matching products.", "starter": "SELECT ", "hint1": "Put the values in place of the ? marks.", "hint2": "COUNT(*) AS n.", "solution": "SELECT COUNT(*) AS n FROM products WHERE category_id = 2 AND price > 1000;", "explain": ["placeholders keep data separate from SQL text"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m20-l03", "module": "Module 20 - Connecting to databases", "title": "Connecting to Snowflake, BigQuery and other languages", "order": 52, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": ["m20-l02"], "engines": ["sqlite"], "dataset": "company", "theory": "**Snowflake** (pip install snowflake-connector-python):\n```python\nimport os, snowflake.connector\nconn = snowflake.connector.connect(account=\"myorg-myaccount\", user=\"ANALYST\",\n    password=os.environ[\"SNOWFLAKE_PWD\"], warehouse=\"COMPUTE_WH\", database=\"SHOP\", schema=\"PUBLIC\")\nrows = conn.cursor().execute(\"SELECT name FROM products WHERE price > %s\", (1000,)).fetchall()\n```\n**BigQuery** (pip install google-cloud-bigquery; log in with `gcloud auth application-default login` or set GOOGLE_APPLICATION_CREDENTIALS to a service-account file):\n```python\nfrom google.cloud import bigquery\nclient = bigquery.Client(project=\"my-project\")\ndf = client.query(\"SELECT name FROM `my-project.shop.products` WHERE price > 1000\").to_dataframe()\n```\n**Java (JDBC):**\n```java\nConnection c = DriverManager.getConnection(\"jdbc:postgresql://localhost:5432/shop\", \"analyst\", System.getenv(\"PGPASSWORD\"));\nPreparedStatement ps = c.prepareStatement(\"SELECT name FROM products WHERE price > ?\");\nps.setInt(1, 1000); ResultSet rs = ps.executeQuery();\n```\n**Node.js** (npm install pg):\n```javascript\nconst { Client } = require(\"pg\");\nconst client = new Client({ host: \"localhost\", database: \"shop\", user: \"analyst\", password: process.env.PGPASSWORD });\nawait client.connect();\nconst res = await client.query(\"SELECT name FROM products WHERE price > $1\", [1000]);\n```\n**C# (ADO.NET):**\n```csharp\nusing var conn = new SqlConnection(Environment.GetEnvironmentVariable(\"MSSQL_CONN\"));\nconn.Open();\nvar cmd = new SqlCommand(\"SELECT name FROM products WHERE price > @p\", conn);\ncmd.Parameters.AddWithValue(\"@p\", 1000);\n```\n**R** (install.packages(c(\"DBI\",\"RPostgres\"))):\n```r\ncon <- DBI::dbConnect(RPostgres::Postgres(), host=\"localhost\", dbname=\"shop\", user=\"analyst\", password=Sys.getenv(\"PGPASSWORD\"))\ndf <- DBI::dbGetQuery(con, \"SELECT name FROM products WHERE price > $1\", params=list(1000))\n```", "examples": [{"title": "Read", "sql": "SELECT COUNT(*) AS employees FROM employees;"}], "exercises": [{"id": "m20-l03-e1", "level": "easy", "task": "Build a PostgreSQL URL with SQL text joins: return url = 'postgresql://analyst@localhost:5432/shop' made by joining 'postgresql://', the user, '@', the host, ':', the port and '/shop'.", "starter": "SELECT ", "hint1": "Join each part with ||.", "hint2": "Start with 'postgresql://'.", "solution": "SELECT 'postgresql://' || 'analyst' || '@' || 'localhost' || ':' || '5432' || '/shop' AS url;", "explain": ["URL = scheme + user + host + port + database"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m20-l04", "module": "Module 20 - Connecting to databases", "title": "Local setup with Docker, security and troubleshooting", "order": 53, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": ["m20-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Local setup with Docker** (install Docker Desktop on Windows with WSL 2, then in this repo run `python gen_data.py all` and `docker compose up -d`). This file starts PostgreSQL, MySQL and SQL Server; Postgres and MySQL load the sample datasets on first start.\n```yaml\n# Run PostgreSQL, MySQL and SQL Server locally. Start: docker compose up -d\n# Datasets: generate with `python3 gen_data.py all`; Postgres/MySQL load data/<dialect>/*.sql on first start.\nservices:\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_USER: analyst\n      POSTGRES_PASSWORD: change_me_pg\n      POSTGRES_DB: shop\n    ports: [\"5432:5432\"]\n    volumes: [\"./data/postgres:/docker-entrypoint-initdb.d\"]\n  mysql:\n    image: mysql:8\n    environment:\n      MYSQL_ROOT_PASSWORD: change_me_root\n      MYSQL_DATABASE: shop\n      MYSQL_USER: analyst\n      MYSQL_PASSWORD: change_me_my\n    ports: [\"3306:3306\"]\n    volumes: [\"./data/mysql:/docker-entrypoint-initdb.d\"]\n  sqlserver:\n    image: mcr.microsoft.com/mssql/server:2022-latest\n    environment:\n      ACCEPT_EULA: \"Y\"\n      MSSQL_SA_PASSWORD: \"Change_me_1Strong\"\n    ports: [\"1433:1433\"]\n```\nWithout Docker on **Windows:** install PostgreSQL from the EnterpriseDB installer, MySQL from the MySQL Installer, SQL Server Developer plus SSMS from Microsoft; or just use DBeaver with SQLite.\n\n**Security habits:** never hard-code credentials; use environment variables, `.env` files in `.gitignore`, or a secret manager; give analysts a **read-only user** with access to views only (least privilege); always use parameterized queries.\n\n**Troubleshooting**\n\n| Symptom | Likely cause | Fix |\n| Connection timed out | wrong host, firewall, VPN off | check host and port, connect VPN, test with the CLI |\n| Authentication failed | wrong user or password, wrong auth method | re-enter credentials, check the user exists and may log in from your host |\n| Port blocked or refused | server not running or port closed | start the server, check the port mapping and firewall |\n| SSL error | server requires or rejects SSL | set sslmode or Encrypt options, trust the server certificate in dev only |\n| Driver not found | ODBC or JDBC driver missing | install the driver and use its exact name |\n| Too many connections | no pooling | close connections, use a pool |", "examples": [{"title": "Safe view", "sql": "SELECT order_id, status, order_date FROM orders LIMIT 3;"}], "exercises": [{"id": "m20-l04-e1", "level": "medium", "task": "Least privilege: create view v_orders_readonly(order_id, status, order_date) that hides customer_id.", "starter": "CREATE VIEW ", "hint1": "CREATE VIEW ... AS SELECT 3 columns.", "hint2": "Leave customer_id out.", "solution": "CREATE VIEW v_orders_readonly AS SELECT order_id, status, order_date FROM orders;", "explain": ["read-only users get views, not raw tables"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS n, COUNT(DISTINCT status) AS statuses FROM v_orders_readonly"}}]}, {"id": "m21-l01", "module": "Module 21 - SQL with Power BI and Excel", "title": "Power BI with SQL databases", "order": 54, "level": "intermediate", "estimatedMinutes": 30, "prerequisites": ["m20-l04"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Connect:** Home > Get Data > choose SQL Server, PostgreSQL database, MySQL database, Oracle database, Snowflake, Google BigQuery or ODBC. Enter server (and database), choose Import or DirectQuery, then enter credentials (Database, Windows or Microsoft account). Optional **Advanced options > SQL statement** lets you paste a **native query**.\n\n| Mode | How it works | Pros | Cons |\n| Import | copies data into Power BI | fastest visuals, full DAX | needs refresh, size limits |\n| DirectQuery | sends queries live | always current, big data stays in database | slower, some features limited |\n| Live connection | uses a published model (Analysis Services) | one shared model | no changes to the model |\n\n**Query folding:** Power Query translates steps into SQL so the database does the work. Native queries and some steps break folding; check with View Native Query. **M example:**\n```\nlet\n  Source = Sql.Database(\"localhost\", \"shop\", [Query = \"SELECT * FROM v_sales_report\"])\nin\n  Source\n```\n(PostgreSQL uses `PostgreSQL.Database(\"localhost:5432\",\"shop\")`.) **Refresh:** publish to the Power BI service; for a database on your own network install an **on-premises data gateway**, set credentials and **privacy levels**, then schedule refresh. **Modeling:** use a **star schema** (fact table plus dimension tables, one-to-many relationships). **DAX vs SQL:** shape, join and clean rows in SQL or a view; write measures that react to filters (YTD, % of total) in DAX. **Performance:** select only needed columns, filter in SQL, use views, avoid heavy transformations on large data. **Row-level security:** define roles with DAX filters, test with View as. **KPI dashboard:** build a view with one row per customer or month, load it, add cards and charts.", "examples": [{"title": "Customer KPI view body", "sql": "SELECT c.customer_id, COUNT(DISTINCT o.order_id) AS orders FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id GROUP BY c.customer_id LIMIT 5;"}], "exercises": [{"id": "m21-l01-e1", "level": "medium", "task": "Write the KPI query Power BI will load: customers 1 to 5 with customer_id, orders (distinct orders) and revenue (sum of payments, 0 if none, rounded to 2), ordered by customer_id.", "starter": "SELECT ", "hint1": "LEFT JOIN orders then payments.", "hint2": "COALESCE(SUM(p.amount),0).", "solution": "SELECT c.customer_id, COUNT(DISTINCT o.order_id) AS orders, ROUND(COALESCE(SUM(p.amount),0),2) AS revenue FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id LEFT JOIN payments p ON p.order_id = o.order_id WHERE c.customer_id <= 5 GROUP BY c.customer_id ORDER BY c.customer_id;", "explain": ["one row per customer is ideal for a dashboard"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m21-l02", "module": "Module 21 - SQL with Power BI and Excel", "title": "Excel with SQL databases", "order": 55, "level": "intermediate", "estimatedMinutes": 30, "prerequisites": ["m21-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Power Query route (recommended):** Data > Get Data > From Database > From SQL Server Database (or PostgreSQL, MySQL, Oracle). Enter server and database, expand **Advanced options** to paste a **native SQL query**, sign in, then Load or Transform. Use **Load To...** to choose a Table, PivotTable or **Data Model** (needed for relationships across tables and DAX measures). **Parameters:** Power Query > Manage Parameters, then reference them in M or the query so you can change dates without editing SQL.\n\n**Refresh:** Data > Refresh All. Connection properties (Data > Queries and Connections > Properties) let you refresh on open or every N minutes and keep credentials safe. **PivotTables** work on the loaded table or Data Model.\n\n**MS Query and ODBC:** install the database's ODBC driver, create a DSN in ODBC Data Sources (64-bit), then Data > Get Data > From Other Sources > From ODBC.\n\n**VBA with ADODB:**\n```vb\nSub LoadSales()\n  Dim cn As Object, rs As Object\n  Set cn = CreateObject(\"ADODB.Connection\")\n  cn.Open \"Provider=MSOLEDBSQL;Server=localhost;Database=shop;UID=analyst;PWD=\" & Environ(\"DB_PWD\")\n  Set rs = cn.Execute(\"SELECT TOP 100 * FROM v_sales_report\")\n  Sheets(\"Data\").Range(\"A2\").CopyFromRecordset rs\n  rs.Close: cn.Close\nEnd Sub\n```\n**Common errors:** login failed (credentials or permissions), driver not found (install it, match 32/64-bit), timeout (filter in SQL, query a view), data type changes breaking refresh (cast in SQL), 'formula.firewall' privacy errors (set privacy levels or combine in SQL).", "examples": [{"title": "Pivot-ready table", "sql": "SELECT strftime('%Y-%m', paid_date) AS ym, method, ROUND(SUM(amount),2) AS revenue FROM payments GROUP BY ym, method LIMIT 4;"}], "exercises": [{"id": "m21-l02-e1", "level": "medium", "task": "Pivot-ready source: first 8 rows of ym (YYYY-MM of paid_date), method and revenue (sum of amount rounded to 2), ordered by ym then method.", "starter": "SELECT ", "hint1": "Group by month and method.", "hint2": "ORDER BY ym, method LIMIT 8.", "solution": "SELECT strftime('%Y-%m', paid_date) AS ym, method, ROUND(SUM(amount),2) AS revenue FROM payments GROUP BY ym, method ORDER BY ym, method LIMIT 8;", "explain": ["a flat long table is the best PivotTable source"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m21-l03", "module": "Module 21 - SQL with Power BI and Excel", "title": "Tableau, Looker Studio, Metabase, Jupyter and the end-to-end project", "order": 56, "level": "intermediate", "estimatedMinutes": 30, "prerequisites": ["m21-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Tableau:** Connect > choose your database > enter credentials > drag tables or use **New Custom SQL**; choose **Live** (always current) or **Extract** (fast snapshot). **Looker Studio:** free; add data > BigQuery, PostgreSQL, MySQL or Cloud SQL connector > choose a table or a **Custom Query**. **Metabase:** open source (run with Docker); add your database under Admin, then ask questions with the query builder or a **Native query**. **Python/Jupyter:** `pandas.read_sql(query, engine)` for analysis, or the `%sql` magic from the ipython-sql package.\n\n**End-to-end project: SQL view to report**\n1. In the database create a reporting view (exercise below).\n2. Create a read-only user that can select only from that view.\n3. Power BI: Get Data > your database > pick the view (Import).\n4. Check types, build a month axis, add measures (total revenue, orders) and visuals (line chart, KPI cards).\n5. Publish; install the gateway if the database is on-premises; set credentials and schedule refresh.\n6. Excel alternative: Data > Get Data > From Database > choose the view > Load > insert a PivotTable > Refresh All.\n7. Reconcile the report total with a direct SQL SUM before sharing it.", "examples": [{"title": "The view body", "sql": "SELECT strftime('%Y-%m', o.order_date) AS ym, COUNT(DISTINCT o.order_id) AS orders FROM orders o GROUP BY ym LIMIT 3;"}], "exercises": [{"id": "m21-l03-e1", "level": "hard", "task": "Create view v_sales_report(ym, orders, revenue): ym = YYYY-MM of order_date, orders = distinct orders, revenue = sum of payments rounded to 2 (orders joined to payments).", "starter": "CREATE VIEW ", "hint1": "Join orders to payments.", "hint2": "GROUP BY the month.", "solution": "CREATE VIEW v_sales_report AS SELECT strftime('%Y-%m', o.order_date) AS ym, COUNT(DISTINCT o.order_id) AS orders, ROUND(SUM(p.amount),2) AS revenue FROM orders o JOIN payments p ON p.order_id = o.order_id GROUP BY ym;", "explain": ["this is the view Power BI or Excel would load"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS months, ROUND(SUM(revenue),2) AS total FROM v_sales_report"}}]}, {"id": "m22-l01", "module": "Interview coding problems", "title": "Set 1: salaries and ranking", "order": 57, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "company", "theory": "Classic interview patterns on the employees table. Name the output columns exactly as asked.", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM employees LIMIT 3;"}], "exercises": [{"id": "m22-l01-p1", "level": "medium", "task": "Second highest salary as second_highest.", "starter": "SELECT ", "hint1": "MAX of salaries below the overall MAX.", "hint2": "Useful pieces: MAX.", "solution": "SELECT MAX(salary) AS second_highest FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);", "explain": ["Idea: MAX of salaries below the overall MAX.", "The query uses MAX."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l01-p2", "level": "medium", "task": "Third highest distinct salary (column salary).", "starter": "SELECT ", "hint1": "Distinct, sort descending, skip two.", "hint2": "Useful pieces: DISTINCT, LIMIT, OFFSET.", "solution": "SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 2;", "explain": ["Idea: Distinct, sort descending, skip two.", "The query uses DISTINCT, LIMIT, OFFSET."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l01-p3", "level": "hard", "task": "Top 2 salaries per department (ties share rank): dept_id, name, salary. Order by dept_id, salary desc, name.", "starter": "SELECT ", "hint1": "DENSE_RANK per department, filter r <= 2.", "hint2": "Useful pieces: DENSE_RANK, PARTITION BY, OVER.", "solution": "SELECT dept_id, name, salary FROM (SELECT dept_id, name, salary, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS r FROM employees) WHERE r <= 2 ORDER BY dept_id, salary DESC, name;", "explain": ["Idea: DENSE_RANK per department, filter r <= 2.", "The query uses DENSE_RANK, PARTITION BY, OVER."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l01-p4", "level": "hard", "task": "Per department the number of employees earning above their department average: dept_id, above_avg. Order by dept_id.", "starter": "SELECT ", "hint1": "Correlated average per department.", "hint2": "Useful pieces: GROUP BY, COUNT, AVG.", "solution": "SELECT dept_id, COUNT(*) AS above_avg FROM employees e WHERE salary > (SELECT AVG(salary) FROM employees WHERE dept_id = e.dept_id) GROUP BY dept_id ORDER BY dept_id;", "explain": ["Idea: Correlated average per department.", "The query uses GROUP BY, COUNT, AVG."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l01-p5", "level": "medium", "task": "Names of departments whose average salary is above the company average (dept_name), ordered by dept_name.", "starter": "SELECT ", "hint1": "Group by department, HAVING against a scalar subquery.", "hint2": "Useful pieces: GROUP BY, HAVING, JOIN, AVG.", "solution": "SELECT d.dept_name FROM departments d JOIN employees e ON e.dept_id = d.dept_id GROUP BY d.dept_id, d.dept_name HAVING AVG(e.salary) > (SELECT AVG(salary) FROM employees) ORDER BY d.dept_name;", "explain": ["Idea: Group by department, HAVING against a scalar subquery.", "The query uses GROUP BY, HAVING, JOIN, AVG."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m22-l02", "module": "Interview coding problems", "title": "Set 2: headcount, median and duplicates", "order": 58, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "company", "theory": "More interview classics: yearly counts, cumulative totals, median without a MEDIAN function, and duplicate detection.", "examples": [{"title": "Peek at the data", "sql": "SELECT strftime('%Y', hire_date) AS yr, COUNT(*) FROM employees GROUP BY yr;"}], "exercises": [{"id": "m22-l02-p1", "level": "easy", "task": "Hires per year: yr, n. Order by yr.", "starter": "SELECT ", "hint1": "Group by the year of hire_date.", "hint2": "Useful pieces: GROUP BY, COUNT, strftime.", "solution": "SELECT strftime('%Y', hire_date) AS yr, COUNT(*) AS n FROM employees GROUP BY yr ORDER BY yr;", "explain": ["Idea: Group by the year of hire_date.", "The query uses GROUP BY, COUNT, strftime."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l02-p2", "level": "medium", "task": "Cumulative hires by year: yr, cum_hires. Order by yr.", "starter": "SELECT ", "hint1": "Yearly counts in a CTE, then a running SUM.", "hint2": "Useful pieces: OVER, WITH, GROUP BY, COUNT, SUM, strftime.", "solution": "WITH y AS (SELECT strftime('%Y', hire_date) AS yr, COUNT(*) AS n FROM employees GROUP BY yr) SELECT yr, SUM(n) OVER (ORDER BY yr) AS cum_hires FROM y ORDER BY yr;", "explain": ["Idea: Yearly counts in a CTE, then a running SUM.", "The query uses OVER, WITH, GROUP BY, COUNT, SUM, strftime."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l02-p3", "level": "hard", "task": "Median salary as median_salary (average of the middle two rows when the count is even).", "starter": "SELECT ", "hint1": "Number the rows and pick the middle one or two.", "hint2": "Useful pieces: ROW_NUMBER, OVER, WITH, COUNT, AVG.", "solution": "WITH r AS (SELECT salary, ROW_NUMBER() OVER (ORDER BY salary) AS rn, COUNT(*) OVER () AS n FROM employees) SELECT AVG(salary) AS median_salary FROM r WHERE rn IN ((n + 1) / 2, (n + 2) / 2);", "explain": ["Idea: Number the rows and pick the middle one or two.", "The query uses ROW_NUMBER, OVER, WITH, COUNT, AVG."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l02-p4", "level": "medium", "task": "Employees 1 to 5: emp_id, salary and gap (department max salary minus own salary). Order by emp_id.", "starter": "SELECT ", "hint1": "MAX() OVER (PARTITION BY dept_id).", "hint2": "Useful pieces: PARTITION BY, OVER, MAX, LIMIT.", "solution": "SELECT emp_id, salary, MAX(salary) OVER (PARTITION BY dept_id) - salary AS gap FROM employees ORDER BY emp_id LIMIT 5;", "explain": ["Idea: MAX() OVER (PARTITION BY dept_id).", "The query uses PARTITION BY, OVER, MAX, LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l02-p5", "level": "easy", "task": "Names shared by more than one employee: name, n. Order by n desc, name.", "starter": "SELECT ", "hint1": "GROUP BY name HAVING COUNT(*) > 1.", "hint2": "Useful pieces: GROUP BY, HAVING, COUNT.", "solution": "SELECT name, COUNT(*) AS n FROM employees GROUP BY name HAVING COUNT(*) > 1 ORDER BY n DESC, name;", "explain": ["Idea: GROUP BY name HAVING COUNT(*) > 1.", "The query uses GROUP BY, HAVING, COUNT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m22-l03", "module": "Interview coding problems", "title": "Set 3: orders, streaks and first orders", "order": 59, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Gaps-and-islands, first/last row per group and retention on the orders table.", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m22-l03-p1", "level": "hard", "task": "Number of distinct order dates whose previous day also has orders, as consecutive_days.", "starter": "SELECT ", "hint1": "Distinct dates in a CTE, EXISTS for the previous day.", "hint2": "Useful pieces: WITH, EXISTS, COUNT, DISTINCT.", "solution": "WITH d AS (SELECT DISTINCT order_date AS dt FROM orders) SELECT COUNT(*) AS consecutive_days FROM d a WHERE EXISTS (SELECT 1 FROM d b WHERE b.dt = date(a.dt, '-1 day'));", "explain": ["Idea: Distinct dates in a CTE, EXISTS for the previous day.", "The query uses WITH, EXISTS, COUNT, DISTINCT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l03-p2", "level": "hard", "task": "Longest streak of consecutive order dates as streak (gaps and islands).", "starter": "SELECT ", "hint1": "Date minus its row number is constant inside a run.", "hint2": "Useful pieces: ROW_NUMBER, OVER, WITH, GROUP BY, COUNT, DISTINCT.", "solution": "WITH d AS (SELECT DISTINCT order_date AS dt FROM orders), g AS (SELECT dt, julianday(dt) - ROW_NUMBER() OVER (ORDER BY dt) AS grp FROM d) SELECT COUNT(*) AS streak FROM g GROUP BY grp ORDER BY streak DESC LIMIT 1;", "explain": ["Idea: Date minus its row number is constant inside a run.", "The query uses ROW_NUMBER, OVER, WITH, GROUP BY, COUNT, DISTINCT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l03-p3", "level": "hard", "task": "Number of customers whose very first order (by date, then order_id) was Cancelled, as n.", "starter": "SELECT ", "hint1": "ROW_NUMBER per customer, keep rn = 1.", "hint2": "Useful pieces: ROW_NUMBER, PARTITION BY, OVER, WITH, COUNT.", "solution": "WITH f AS (SELECT customer_id, status, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS rn FROM orders) SELECT COUNT(*) AS n FROM f WHERE rn = 1 AND status = 'Cancelled';", "explain": ["Idea: ROW_NUMBER per customer, keep rn = 1.", "The query uses ROW_NUMBER, PARTITION BY, OVER, WITH, COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l03-p4", "level": "medium", "task": "Latest order of customers 1 to 5: customer_id, order_id, order_date. Latest = highest date, then highest order_id. Order by customer_id.", "starter": "SELECT ", "hint1": "ROW_NUMBER with DESC order, keep rn = 1.", "hint2": "Useful pieces: ROW_NUMBER, PARTITION BY, OVER.", "solution": "SELECT customer_id, order_id, order_date FROM (SELECT customer_id, order_id, order_date, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC, order_id DESC) AS rn FROM orders) WHERE rn = 1 AND customer_id <= 5 ORDER BY customer_id;", "explain": ["Idea: ROW_NUMBER with DESC order, keep rn = 1.", "The query uses ROW_NUMBER, PARTITION BY, OVER."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l03-p5", "level": "hard", "task": "Retention: percent of customers who ordered in 2023 and also ordered in 2024, rounded to 1 decimal, as retention_pct.", "starter": "SELECT ", "hint1": "Two CTEs for the two years, then a ratio.", "hint2": "Useful pieces: WITH, COUNT, DISTINCT.", "solution": "WITH a AS (SELECT DISTINCT customer_id FROM orders WHERE order_date < '2024-01-01'), b AS (SELECT DISTINCT customer_id FROM orders WHERE order_date >= '2024-01-01') SELECT ROUND(100.0 * (SELECT COUNT(*) FROM a WHERE customer_id IN (SELECT customer_id FROM b)) / (SELECT COUNT(*) FROM a), 1) AS retention_pct;", "explain": ["Idea: Two CTEs for the two years, then a ratio.", "The query uses WITH, COUNT, DISTINCT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m22-l04", "module": "Interview coding problems", "title": "Set 4: revenue and products", "order": 60, "level": "intermediate", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Revenue questions interviewers love: growth, top products, averages and Pareto.", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM order_items LIMIT 3;"}], "exercises": [{"id": "m22-l04-p1", "level": "medium", "task": "Yearly payment revenue with previous year: yr, rev (rounded to 2), prev_rev. Order by yr.", "starter": "SELECT ", "hint1": "Yearly CTE then LAG.", "hint2": "Useful pieces: LAG, OVER, WITH, GROUP BY, SUM, strftime.", "solution": "WITH y AS (SELECT strftime('%Y', paid_date) AS yr, ROUND(SUM(amount),2) AS rev FROM payments GROUP BY yr) SELECT yr, rev, LAG(rev) OVER (ORDER BY yr) AS prev_rev FROM y ORDER BY yr;", "explain": ["Idea: Yearly CTE then LAG.", "The query uses LAG, OVER, WITH, GROUP BY, SUM, strftime."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l04-p2", "level": "medium", "task": "Products with fewer than 30 order lines: product_id, lines. Order by lines, product_id.", "starter": "SELECT ", "hint1": "LEFT JOIN, group, HAVING.", "hint2": "Useful pieces: GROUP BY, HAVING, LEFT JOIN, JOIN, COUNT.", "solution": "SELECT p.product_id, COUNT(oi.order_item_id) AS lines FROM products p LEFT JOIN order_items oi ON oi.product_id = p.product_id GROUP BY p.product_id HAVING COUNT(oi.order_item_id) < 30 ORDER BY lines, p.product_id;", "explain": ["Idea: LEFT JOIN, group, HAVING.", "The query uses GROUP BY, HAVING, LEFT JOIN, JOIN, COUNT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l04-p3", "level": "easy", "task": "Top 3 products by revenue (quantity x unit_price): name, revenue rounded to 2, highest first.", "starter": "SELECT ", "hint1": "Join, SUM, ORDER BY DESC, LIMIT 3.", "hint2": "Useful pieces: GROUP BY, JOIN, SUM, LIMIT.", "solution": "SELECT p.name, ROUND(SUM(oi.quantity * oi.unit_price),2) AS revenue FROM order_items oi JOIN products p ON p.product_id = oi.product_id GROUP BY p.product_id, p.name ORDER BY revenue DESC LIMIT 3;", "explain": ["Idea: Join, SUM, ORDER BY DESC, LIMIT 3.", "The query uses GROUP BY, JOIN, SUM, LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l04-p4", "level": "hard", "task": "Average order value of Delivered orders, rounded to 2, as aov.", "starter": "SELECT ", "hint1": "Total per order first, then AVG.", "hint2": "Useful pieces: GROUP BY, JOIN, SUM, AVG.", "solution": "SELECT ROUND(AVG(t),2) AS aov FROM (SELECT SUM(oi.quantity * oi.unit_price) AS t FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'Delivered' GROUP BY o.order_id);", "explain": ["Idea: Total per order first, then AVG.", "The query uses GROUP BY, JOIN, SUM, AVG."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l04-p5", "level": "hard", "task": "Pareto by category: category, cum_pct (cumulative share of revenue %, rounded to 1), biggest category first.", "starter": "SELECT ", "hint1": "Cumulative SUM over a total SUM, both as windows.", "hint2": "Useful pieces: OVER, WITH, GROUP BY, JOIN, SUM.", "solution": "WITH c AS (SELECT cat.category_name AS category, SUM(oi.quantity * oi.unit_price) AS rev FROM order_items oi JOIN products p ON p.product_id = oi.product_id JOIN categories cat ON cat.category_id = p.category_id GROUP BY cat.category_name) SELECT category, ROUND(100.0 * SUM(rev) OVER (ORDER BY rev DESC) / SUM(rev) OVER (), 1) AS cum_pct FROM c ORDER BY rev DESC;", "explain": ["Idea: Cumulative SUM over a total SUM, both as windows.", "The query uses OVER, WITH, GROUP BY, JOIN, SUM."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m22-l05", "module": "Interview coding problems", "title": "Set 5: customers, time and funnels", "order": 61, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Calendar logic, loyalty, spend comparisons and funnels.", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM web_events LIMIT 3;"}], "exercises": [{"id": "m22-l05-p1", "level": "hard", "task": "Customers who ordered in both years 2023 and 2024, as loyal (a count).", "starter": "SELECT ", "hint1": "Count distinct years per customer.", "hint2": "Useful pieces: GROUP BY, HAVING, COUNT, DISTINCT, strftime.", "solution": "SELECT COUNT(*) AS loyal FROM (SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(DISTINCT strftime('%Y', order_date)) = 2);", "explain": ["Idea: Count distinct years per customer.", "The query uses GROUP BY, HAVING, COUNT, DISTINCT, strftime."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l05-p2", "level": "easy", "task": "Busiest month: ym (YYYY-MM) and n orders. Tie-break by earlier ym.", "starter": "SELECT ", "hint1": "Group by month, order by count, LIMIT 1.", "hint2": "Useful pieces: GROUP BY, COUNT, strftime, LIMIT.", "solution": "SELECT strftime('%Y-%m', order_date) AS ym, COUNT(*) AS n FROM orders GROUP BY ym ORDER BY n DESC, ym LIMIT 1;", "explain": ["Idea: Group by month, order by count, LIMIT 1.", "The query uses GROUP BY, COUNT, strftime, LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l05-p3", "level": "easy", "task": "Number of orders placed on a Saturday or Sunday as weekend_orders (strftime('%w') gives 0 for Sunday, 6 for Saturday).", "starter": "SELECT ", "hint1": "strftime('%w', date).", "hint2": "Useful pieces: COUNT, strftime.", "solution": "SELECT COUNT(*) AS weekend_orders FROM orders WHERE strftime('%w', order_date) IN ('0','6');", "explain": ["Idea: strftime('%w', date).", "The query uses COUNT, strftime."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l05-p4", "level": "hard", "task": "Number of customers whose total paid amount is above the average customer total, as n.", "starter": "SELECT ", "hint1": "Customer totals in a CTE, compare to AVG of totals.", "hint2": "Useful pieces: WITH, GROUP BY, JOIN, COUNT, SUM, AVG.", "solution": "WITH s AS (SELECT o.customer_id, SUM(p.amount) AS total FROM payments p JOIN orders o ON o.order_id = p.order_id GROUP BY o.customer_id) SELECT COUNT(*) AS n FROM s WHERE total > (SELECT AVG(total) FROM s);", "explain": ["Idea: Customer totals in a CTE, compare to AVG of totals.", "The query uses WITH, GROUP BY, JOIN, COUNT, SUM, AVG."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l05-p5", "level": "hard", "task": "Average days between a customer's consecutive orders, rounded to 1 decimal, as avg_gap_days.", "starter": "SELECT ", "hint1": "LAG per customer, subtract dates, AVG ignores the NULLs.", "hint2": "Useful pieces: LAG, PARTITION BY, OVER, WITH, AVG, julianday.", "solution": "WITH x AS (SELECT julianday(order_date) - julianday(LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, order_id)) AS gap FROM orders) SELECT ROUND(AVG(gap),1) AS avg_gap_days FROM x;", "explain": ["Idea: LAG per customer, subtract dates, AVG ignores the NULLs.", "The query uses LAG, PARTITION BY, OVER, WITH, AVG, julianday."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l05-p6", "level": "hard", "task": "Funnel: customers who have at least one view event AND at least one purchase event, as converted.", "starter": "SELECT ", "hint1": "Conditional SUMs in HAVING.", "hint2": "Useful pieces: GROUP BY, HAVING, CASE, COUNT, SUM.", "solution": "SELECT COUNT(*) AS converted FROM (SELECT customer_id FROM web_events WHERE customer_id IS NOT NULL GROUP BY customer_id HAVING SUM(CASE WHEN event_type = 'view' THEN 1 ELSE 0 END) > 0 AND SUM(CASE WHEN event_type = 'purchase' THEN 1 ELSE 0 END) > 0);", "explain": ["Idea: Conditional SUMs in HAVING.", "The query uses GROUP BY, HAVING, CASE, COUNT, SUM."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m22-l06", "module": "Interview coding problems", "title": "Set 6: telecom, reconciliation and missing dates", "order": 62, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "telecom", "theory": "Telecom MIS questions plus reconciliation and calendar-gap problems (some use the ecommerce dataset).", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM telecom_subscribers LIMIT 3;"}], "exercises": [{"id": "m22-l06-p1", "level": "easy", "task": "Active subscribers per circle: circle, active. Order by circle.", "starter": "SELECT ", "hint1": "Filter Active, group by circle.", "hint2": "Useful pieces: GROUP BY, COUNT.", "solution": "SELECT circle, COUNT(*) AS active FROM telecom_subscribers WHERE status = 'Active' GROUP BY circle ORDER BY circle;", "explain": ["Idea: Filter Active, group by circle.", "The query uses GROUP BY, COUNT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l06-p2", "level": "hard", "task": "Number of subscribers with fewer than 3 recharges (including 0) as low_recharge.", "starter": "SELECT ", "hint1": "LEFT JOIN so zero-recharge subscribers stay.", "hint2": "Useful pieces: GROUP BY, HAVING, LEFT JOIN, JOIN, COUNT.", "solution": "SELECT COUNT(*) AS low_recharge FROM (SELECT s.sub_id FROM telecom_subscribers s LEFT JOIN recharges r ON r.sub_id = s.sub_id GROUP BY s.sub_id HAVING COUNT(r.recharge_id) < 3);", "explain": ["Idea: LEFT JOIN so zero-recharge subscribers stay.", "The query uses GROUP BY, HAVING, LEFT JOIN, JOIN, COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l06-p3", "level": "medium", "task": "Churned within 90 days of activation (churn_date minus activation_date <= 90) as early_churn (a count).", "starter": "SELECT ", "hint1": "julianday difference.", "hint2": "Useful pieces: JOIN, COUNT, julianday.", "solution": "SELECT COUNT(*) AS early_churn FROM churn c JOIN telecom_subscribers s ON s.sub_id = c.sub_id WHERE julianday(c.churn_date) - julianday(s.activation_date) <= 90;", "explain": ["Idea: julianday difference.", "The query uses JOIN, COUNT, julianday."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m22-l06-p4", "level": "medium", "task": "Payments whose order does not exist, as orphan_payments (reconciliation; expect 0).", "starter": "SELECT ", "hint1": "Anti-join from payments to orders.", "hint2": "Useful pieces: LEFT JOIN, JOIN, COUNT.", "solution": "SELECT COUNT(*) AS orphan_payments FROM payments p LEFT JOIN orders o ON o.order_id = p.order_id WHERE o.order_id IS NULL;", "explain": ["Idea: Anti-join from payments to orders.", "The query uses LEFT JOIN, JOIN, COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}, {"id": "m22-l06-p5", "level": "medium", "task": "Delivered orders with no payment, as unpaid_delivered (reconciliation).", "starter": "SELECT ", "hint1": "Anti-join with a status filter.", "hint2": "Useful pieces: LEFT JOIN, JOIN, COUNT.", "solution": "SELECT COUNT(*) AS unpaid_delivered FROM orders o LEFT JOIN payments p ON p.order_id = o.order_id WHERE o.status = 'Delivered' AND p.payment_id IS NULL;", "explain": ["Idea: Anti-join with a status filter.", "The query uses LEFT JOIN, JOIN, COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}, {"id": "m22-l06-p6", "level": "easy", "task": "Row counts side by side: orders_cnt and items_cnt.", "starter": "SELECT ", "hint1": "Two scalar subqueries.", "hint2": "Useful pieces: COUNT.", "solution": "SELECT (SELECT COUNT(*) FROM orders) AS orders_cnt, (SELECT COUNT(*) FROM order_items) AS items_cnt;", "explain": ["Idea: Two scalar subqueries.", "The query uses COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}, {"id": "m22-l06-p7", "level": "hard", "task": "Days of January 2024 with no orders, as empty_days (generate the dates with a recursive CTE).", "starter": "SELECT ", "hint1": "Date series minus dates that exist.", "hint2": "Useful pieces: WITH RECURSIVE, WITH, COUNT, UNION.", "solution": "WITH RECURSIVE d(day) AS (SELECT '2024-01-01' UNION ALL SELECT date(day, '+1 day') FROM d WHERE day < '2024-01-31') SELECT COUNT(*) AS empty_days FROM d WHERE day NOT IN (SELECT order_date FROM orders);", "explain": ["Idea: Date series minus dates that exist.", "The query uses WITH RECURSIVE, WITH, COUNT, UNION."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}]}, {"id": "m23-l01", "module": "Module 23 - Capstone projects", "title": "Project 1: Daily, weekly and monthly MIS report set", "order": 63, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Operations needs a recurring MIS pack: orders per day, per week and revenue per month.\n\n**Deliverables:** Three queries (daily, weekly, monthly), one view per period, and a one-line summary of each trend.\n\n**Self-check rubric:**\n- Row counts match a direct COUNT(*) on the source\n- Every period appears once\n- Dates use one format\n- Notes state the metric definition", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l01-p1", "level": "easy", "task": "Daily orders for 2024-01-01 to 2024-01-07 (inclusive): order_date, orders. Order by order_date.", "starter": "SELECT ", "hint1": "Filter the 7 days, group by date.", "hint2": "Useful pieces: GROUP BY, COUNT.", "solution": "SELECT order_date, COUNT(*) AS orders FROM orders WHERE order_date BETWEEN '2024-01-01' AND '2024-01-07' GROUP BY order_date ORDER BY order_date;", "explain": ["Idea: Filter the 7 days, group by date.", "The query uses GROUP BY, COUNT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l01-p2", "level": "medium", "task": "Monthly revenue for 2024 (payments by paid_date): ym, revenue rounded to 2. Order by ym.", "starter": "SELECT ", "hint1": "Sargable date range, group by month.", "hint2": "Useful pieces: GROUP BY, SUM, strftime.", "solution": "SELECT strftime('%Y-%m', paid_date) AS ym, ROUND(SUM(amount),2) AS revenue FROM payments WHERE paid_date >= '2024-01-01' AND paid_date < '2025-01-01' GROUP BY ym ORDER BY ym;", "explain": ["Idea: Sargable date range, group by month.", "The query uses GROUP BY, SUM, strftime."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l02", "module": "Module 23 - Capstone projects", "title": "Project 2: KPI and performance report", "order": 64, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "company", "theory": "**Business brief:** HR leadership wants department KPIs and a salary band summary.\n\n**Deliverables:** A department KPI table and a band distribution, ready for a dashboard.\n\n**Self-check rubric:**\n- Departments listed once\n- Averages rounded to 2 decimals\n- Bands cover every employee exactly once", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM employees LIMIT 3;"}], "exercises": [{"id": "m23-l02-p1", "level": "easy", "task": "Department KPIs: dept_name, headcount, avg_salary (rounded to 2). Order by dept_name.", "starter": "SELECT ", "hint1": "Join and group by department.", "hint2": "Useful pieces: GROUP BY, JOIN, COUNT, AVG.", "solution": "SELECT d.dept_name, COUNT(*) AS headcount, ROUND(AVG(e.salary),2) AS avg_salary FROM departments d JOIN employees e ON e.dept_id = d.dept_id GROUP BY d.dept_name ORDER BY d.dept_name;", "explain": ["Idea: Join and group by department.", "The query uses GROUP BY, JOIN, COUNT, AVG."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l02-p2", "level": "medium", "task": "Salary bands: band (Low below 45000, Mid below 75000, High otherwise) and employees. Order by band.", "starter": "SELECT ", "hint1": "CASE then GROUP BY the alias.", "hint2": "Useful pieces: GROUP BY, CASE, COUNT.", "solution": "SELECT CASE WHEN salary < 45000 THEN 'Low' WHEN salary < 75000 THEN 'Mid' ELSE 'High' END AS band, COUNT(*) AS employees FROM employees GROUP BY band ORDER BY band;", "explain": ["Idea: CASE then GROUP BY the alias.", "The query uses GROUP BY, CASE, COUNT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l03", "module": "Module 23 - Capstone projects", "title": "Project 3: Data discrepancy and reconciliation checks", "order": 65, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Finance suspects payments and orders are out of sync. Prove or disprove it.\n\n**Deliverables:** Check queries with counts and totals, plus a list of any mismatched keys.\n\n**Self-check rubric:**\n- Each check returns 0 when data is clean\n- Totals compare like with like (same statuses)\n- Findings are written in plain language", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l03-p1", "level": "medium", "task": "Delivered or Shipped orders without a payment, as missing_payment.", "starter": "SELECT ", "hint1": "Anti-join with a status filter.", "hint2": "Useful pieces: LEFT JOIN, JOIN, COUNT.", "solution": "SELECT COUNT(*) AS missing_payment FROM orders o LEFT JOIN payments p ON p.order_id = o.order_id WHERE o.status IN ('Delivered','Shipped') AND p.payment_id IS NULL;", "explain": ["Idea: Anti-join with a status filter.", "The query uses LEFT JOIN, JOIN, COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l03-p2", "level": "hard", "task": "Totals side by side: paid_total (all payments) and items_total (items of Delivered or Shipped orders), both rounded to 2.", "starter": "SELECT ", "hint1": "Two scalar subqueries; the numbers should match.", "hint2": "Useful pieces: JOIN, SUM.", "solution": "SELECT ROUND((SELECT SUM(amount) FROM payments),2) AS paid_total, ROUND((SELECT SUM(oi.quantity * oi.unit_price) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status IN ('Delivered','Shipped')),2) AS items_total;", "explain": ["Idea: Two scalar subqueries; the numbers should match.", "The query uses JOIN, SUM."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l04", "module": "Module 23 - Capstone projects", "title": "Project 4: Telecom KPI analysis", "order": 66, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "telecom", "theory": "**Business brief:** The business head wants subscriber base, churn and recharge KPIs by plan and month.\n\n**Deliverables:** Plan-level base and churn %, and the top recharge months.\n\n**Self-check rubric:**\n- Churn % uses all subscribers of the plan as denominator\n- Months sorted by revenue\n- No plan missing", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM telecom_subscribers LIMIT 3;"}], "exercises": [{"id": "m23-l04-p1", "level": "medium", "task": "Per plan: plan, subs, churn_pct (churned / subs x 100, rounded to 1). Order by plan.", "starter": "SELECT ", "hint1": "Conditional SUM / COUNT.", "hint2": "Useful pieces: GROUP BY, CASE, COUNT, SUM.", "solution": "SELECT plan, COUNT(*) AS subs, ROUND(100.0 * SUM(CASE WHEN status = 'Churned' THEN 1 ELSE 0 END) / COUNT(*), 1) AS churn_pct FROM telecom_subscribers GROUP BY plan ORDER BY plan;", "explain": ["Idea: Conditional SUM / COUNT.", "The query uses GROUP BY, CASE, COUNT, SUM."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l04-p2", "level": "medium", "task": "Top 3 recharge months by revenue: ym, revenue. Highest first.", "starter": "SELECT ", "hint1": "Group by month, ORDER BY revenue DESC LIMIT 3.", "hint2": "Useful pieces: GROUP BY, SUM, strftime, LIMIT.", "solution": "SELECT strftime('%Y-%m', recharge_date) AS ym, SUM(amount) AS revenue FROM recharges GROUP BY ym ORDER BY revenue DESC, ym LIMIT 3;", "explain": ["Idea: Group by month, ORDER BY revenue DESC LIMIT 3.", "The query uses GROUP BY, SUM, strftime, LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l05", "module": "Module 23 - Capstone projects", "title": "Project 5: E-commerce sales analysis", "order": 67, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Marketing wants to know where revenue comes from.\n\n**Deliverables:** Top cities and best-margin products.\n\n**Self-check rubric:**\n- Revenue uses payments, not order counts\n- Margin uses price minus cost\n- Output limited as requested", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l05-p1", "level": "medium", "task": "Top 5 cities by paid revenue: city, revenue rounded to 2. Highest first.", "starter": "SELECT ", "hint1": "Join payments, orders and customers.", "hint2": "Useful pieces: GROUP BY, JOIN, SUM, LIMIT.", "solution": "SELECT c.city, ROUND(SUM(p.amount),2) AS revenue FROM payments p JOIN orders o ON o.order_id = p.order_id JOIN customers c ON c.customer_id = o.customer_id GROUP BY c.city ORDER BY revenue DESC LIMIT 5;", "explain": ["Idea: Join payments, orders and customers.", "The query uses GROUP BY, JOIN, SUM, LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l05-p2", "level": "easy", "task": "Top 10 products by margin (price - cost): name, margin rounded to 2. Highest first.", "starter": "SELECT ", "hint1": "Calculate and sort.", "hint2": "Useful pieces: LIMIT.", "solution": "SELECT name, ROUND(price - cost,2) AS margin FROM products ORDER BY margin DESC LIMIT 10;", "explain": ["Idea: Calculate and sort.", "The query uses LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l06", "module": "Module 23 - Capstone projects", "title": "Project 6: HR analytics", "order": 68, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "company", "theory": "**Business brief:** HR wants hiring trends and salary spread.\n\n**Deliverables:** Hires per year and min/max/average salary per department.\n\n**Self-check rubric:**\n- Years sorted\n- All departments present\n- Money rounded to 2", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM employees LIMIT 3;"}], "exercises": [{"id": "m23-l06-p1", "level": "easy", "task": "Hires per year: yr, hires. Order by yr.", "starter": "SELECT ", "hint1": "Group by the year.", "hint2": "Useful pieces: GROUP BY, COUNT, strftime.", "solution": "SELECT strftime('%Y', hire_date) AS yr, COUNT(*) AS hires FROM employees GROUP BY yr ORDER BY yr;", "explain": ["Idea: Group by the year.", "The query uses GROUP BY, COUNT, strftime."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l06-p2", "level": "easy", "task": "Salary spread per department: dept_id, min_sal, max_sal, avg_sal (rounded to 2). Order by dept_id.", "starter": "SELECT ", "hint1": "Three aggregates per group.", "hint2": "Useful pieces: GROUP BY, AVG, MAX.", "solution": "SELECT dept_id, MIN(salary) AS min_sal, MAX(salary) AS max_sal, ROUND(AVG(salary),2) AS avg_sal FROM employees GROUP BY dept_id ORDER BY dept_id;", "explain": ["Idea: Three aggregates per group.", "The query uses GROUP BY, AVG, MAX."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l07", "module": "Module 23 - Capstone projects", "title": "Project 7: Finance and banking style reporting", "order": 69, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Finance reports collections by payment method and cumulative collections by month.\n\n**Deliverables:** Method share table and cumulative monthly collections.\n\n**Self-check rubric:**\n- Shares add to 100\n- Cumulative column never decreases\n- Months sorted", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l07-p1", "level": "medium", "task": "Payment method share: method, total (rounded to 2), pct (share of all payments, rounded to 1). Highest total first.", "starter": "SELECT ", "hint1": "SUM per method divided by the grand total.", "hint2": "Useful pieces: GROUP BY, SUM.", "solution": "SELECT method, ROUND(SUM(amount),2) AS total, ROUND(100.0 * SUM(amount) / (SELECT SUM(amount) FROM payments), 1) AS pct FROM payments GROUP BY method ORDER BY total DESC;", "explain": ["Idea: SUM per method divided by the grand total.", "The query uses GROUP BY, SUM."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l07-p2", "level": "hard", "task": "First 6 months by paid_date: ym, collected (rounded to 2) and cumulative (running total of collected, rounded to 2). Order by ym.", "starter": "SELECT ", "hint1": "Monthly CTE then running SUM.", "hint2": "Useful pieces: OVER, WITH, GROUP BY, SUM, strftime, LIMIT.", "solution": "WITH m AS (SELECT strftime('%Y-%m', paid_date) AS ym, SUM(amount) AS c FROM payments GROUP BY ym) SELECT ym, ROUND(c,2) AS collected, ROUND(SUM(c) OVER (ORDER BY ym),2) AS cumulative FROM m ORDER BY ym LIMIT 6;", "explain": ["Idea: Monthly CTE then running SUM.", "The query uses OVER, WITH, GROUP BY, SUM, strftime, LIMIT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l08", "module": "Module 23 - Capstone projects", "title": "Project 8: Retail inventory and product performance", "order": 70, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Merchandising wants low-margin product
