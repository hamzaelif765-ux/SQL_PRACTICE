s and category margins.\n\n**Deliverables:** Count of low-margin products and category-level average margin %.\n\n**Self-check rubric:**\n- Margin % = (price - cost) / price x 100\n- Categories listed once", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l08-p1", "level": "easy", "task": "Number of products with margin below 30% of price, as low_margin.", "starter": "SELECT ", "hint1": "Compute margin % in WHERE.", "hint2": "Useful pieces: COUNT.", "solution": "SELECT COUNT(*) AS low_margin FROM products WHERE (price - cost) / price * 100 < 30;", "explain": ["Idea: Compute margin % in WHERE.", "The query uses COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l08-p2", "level": "medium", "task": "Average margin % per category: category_name, avg_margin_pct (rounded to 1). Order by category_name.", "starter": "SELECT ", "hint1": "Join categories, AVG of the margin %.", "hint2": "Useful pieces: GROUP BY, JOIN, AVG.", "solution": "SELECT c.category_name, ROUND(AVG((p.price - p.cost) / p.price * 100),1) AS avg_margin_pct FROM products p JOIN categories c ON c.category_id = p.category_id GROUP BY c.category_name ORDER BY c.category_name;", "explain": ["Idea: Join categories, AVG of the margin %.", "The query uses GROUP BY, JOIN, AVG."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l09", "module": "Module 23 - Capstone projects", "title": "Project 9: Customer segmentation (RFM)", "order": 71, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Marketing needs customers grouped by recency, frequency and spend.\n\n**Deliverables:** An RFM table and a High/Mid/Low spend tier summary.\n\n**Self-check rubric:**\n- Recency measured to 2025-01-01\n- Only customers with payments are scored\n- Tiers sum to the scored customer count", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l09-p1", "level": "hard", "task": "RFM for customers 1 to 5 who have payments: customer_id, recency_days (days from last order to 2025-01-01), frequency (orders with payments), monetary (rounded to 2). Order by customer_id.", "starter": "SELECT ", "hint1": "Join orders to payments; MAX date, COUNT, SUM.", "hint2": "Useful pieces: GROUP BY, JOIN, COUNT, SUM, MAX, DISTINCT.", "solution": "SELECT o.customer_id, CAST(julianday('2025-01-01') - julianday(MAX(o.order_date)) AS INTEGER) AS recency_days, COUNT(DISTINCT o.order_id) AS frequency, ROUND(SUM(p.amount),2) AS monetary FROM orders o JOIN payments p ON p.order_id = o.order_id WHERE o.customer_id <= 5 GROUP BY o.customer_id ORDER BY o.customer_id;", "explain": ["Idea: Join orders to payments; MAX date, COUNT, SUM.", "The query uses GROUP BY, JOIN, COUNT, SUM, MAX, DISTINCT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l09-p2", "level": "hard", "task": "Spend tiers: split customers with payments into 3 groups by total paid (NTILE 3, highest = High, then Mid, Low): tier, customers. Order by tier.", "starter": "SELECT ", "hint1": "NTILE(3) then CASE the bucket number to a label.", "hint2": "Useful pieces: OVER, WITH, GROUP BY, JOIN, CASE, COUNT.", "solution": "WITH m AS (SELECT o.customer_id, SUM(p.amount) AS monetary FROM orders o JOIN payments p ON p.order_id = o.order_id GROUP BY o.customer_id) SELECT tier, COUNT(*) AS customers FROM (SELECT CASE NTILE(3) OVER (ORDER BY monetary DESC) WHEN 1 THEN 'High' WHEN 2 THEN 'Mid' ELSE 'Low' END AS tier FROM m) GROUP BY tier ORDER BY tier;", "explain": ["Idea: NTILE(3) then CASE the bucket number to a label.", "The query uses OVER, WITH, GROUP BY, JOIN, CASE, COUNT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l10", "module": "Module 23 - Capstone projects", "title": "Project 10: Cohort retention and funnel analysis", "order": 72, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Growth wants to know how well the first cohort retains and where the funnel leaks.\n\n**Deliverables:** A funnel with conversion vs views, and the first cohort's repeat customers.\n\n**Self-check rubric:**\n- Funnel counts distinct customers\n- Percentages relative to the view step\n- Cohort defined by first order month", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l10-p1", "level": "hard", "task": "Funnel: event_type, users (distinct customers, ignoring NULL), pct_of_view (users / view users x 100, rounded to 1). Order by users desc, event_type.", "starter": "SELECT ", "hint1": "Divide each step by the view step.", "hint2": "Useful pieces: WITH, GROUP BY, COUNT, DISTINCT.", "solution": "WITH f AS (SELECT event_type, COUNT(DISTINCT customer_id) AS users FROM web_events WHERE customer_id IS NOT NULL GROUP BY event_type) SELECT event_type, users, ROUND(100.0 * users / (SELECT users FROM f WHERE event_type = 'view'), 1) AS pct_of_view FROM f ORDER BY users DESC, event_type;", "explain": ["Idea: Divide each step by the view step.", "The query uses WITH, GROUP BY, COUNT, DISTINCT."], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m23-l10-p2", "level": "hard", "task": "Cohort of customers whose first order was in 2023-01: cohort_size and repeaters (those with more than one order overall).", "starter": "SELECT ", "hint1": "Cohort CTE, then a correlated count.", "hint2": "Useful pieces: WITH, GROUP BY, CASE, COUNT, SUM, strftime.", "solution": "WITH f AS (SELECT customer_id, MIN(order_date) AS first_date FROM orders GROUP BY customer_id), c AS (SELECT customer_id FROM f WHERE strftime('%Y-%m', first_date) = '2023-01') SELECT COUNT(*) AS cohort_size, SUM(CASE WHEN (SELECT COUNT(*) FROM orders o WHERE o.customer_id = c.customer_id) > 1 THEN 1 ELSE 0 END) AS repeaters FROM c;", "explain": ["Idea: Cohort CTE, then a correlated count.", "The query uses WITH, GROUP BY, CASE, COUNT, SUM, strftime."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l11", "module": "Module 23 - Capstone projects", "title": "Project 11: Data cleaning of a messy dataset", "order": 73, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "dirty", "theory": "**Business brief:** A customer file arrived with spaces, mixed case, blanks and duplicates. Clean it for loading.\n\n**Deliverables:** A clean_customers table and a missing-email report.\n\n**Self-check rubric:**\n- Spaces trimmed\n- Blank emails become NULL\n- Injected duplicate ids (above 1000) excluded\n- Cities in consistent case", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM dirty_customers LIMIT 3;"}], "exercises": [{"id": "m23-l11-p1", "level": "hard", "task": "Create table clean_customers(id, name, email, city) from dirty_customers with id < 1000: name trimmed; email lower-cased, trimmed, blank = NULL; city trimmed with first letter upper and the rest lower.", "starter": "CREATE TABLE ", "hint1": "CTAS with TRIM, LOWER, NULLIF and SUBSTR.", "hint2": "Useful pieces: SELECT, WHERE.", "solution": "CREATE TABLE clean_customers AS SELECT id, TRIM(name) AS name, NULLIF(LOWER(TRIM(email)),'') AS email, UPPER(SUBSTR(TRIM(city),1,1)) || LOWER(SUBSTR(TRIM(city),2)) AS city FROM dirty_customers WHERE id < 1000;", "explain": ["Idea: CTAS with TRIM, LOWER, NULLIF and SUBSTR.", "The query uses a simple SELECT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS n, COUNT(email) AS with_email FROM clean_customers"}}, {"id": "m23-l11-p2", "level": "medium", "task": "Missing email report: missing_email = rows where email is NULL or only spaces.", "starter": "SELECT ", "hint1": "COALESCE then TRIM, compare to an empty string.", "hint2": "Useful pieces: COUNT.", "solution": "SELECT COUNT(*) AS missing_email FROM dirty_customers WHERE TRIM(COALESCE(email,'')) = '';", "explain": ["Idea: COALESCE then TRIM, compare to an empty string.", "The query uses COUNT."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m23-l12", "module": "Module 23 - Capstone projects", "title": "Project 12: Data warehouse star-schema build", "order": 74, "level": "advanced", "estimatedMinutes": 25, "prerequisites": [], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Business brief:** Analytics wants a star schema over the shop data so BI tools run simple joins.\n\n**Deliverables:** dim_product and fact_sales tables plus one report query across them.\n\n**Self-check rubric:**\n- Fact has one row per order item\n- Dimension keys are unique\n- Report total equals the source total", "examples": [{"title": "Peek at the data", "sql": "SELECT * FROM orders LIMIT 3;"}], "exercises": [{"id": "m23-l12-p1", "level": "hard", "task": "Create dim_product(product_id, name, category_name) and fact_sales(order_item_id, customer_id, product_id, order_date, revenue = quantity x unit_price).", "starter": "CREATE TABLE ", "hint1": "Two CTAS statements.", "hint2": "Useful pieces: JOIN.", "solution": "CREATE TABLE dim_product AS SELECT p.product_id, p.name, c.category_name FROM products p JOIN categories c ON c.category_id = p.category_id; CREATE TABLE fact_sales AS SELECT oi.order_item_id, o.customer_id, oi.product_id, o.order_date, oi.quantity * oi.unit_price AS revenue FROM order_items oi JOIN orders o ON o.order_id = oi.order_id;", "explain": ["Idea: Two CTAS statements.", "The query uses JOIN."], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT d.category_name, ROUND(SUM(f.revenue),2) AS revenue FROM fact_sales f JOIN dim_product d ON d.product_id = f.product_id GROUP BY d.category_name ORDER BY d.category_name"}}]}];

const REF={"cheat": [{"t": "Module 0 - Foundations", "b": "`DDL` CREATE ALTER DROP | `DML` INSERT UPDATE DELETE | `DQL` SELECT | `DCL` GRANT REVOKE | `TCL` COMMIT ROLLBACK\nLogical order: `FROM` > `WHERE` > `GROUP BY` > `HAVING` > `SELECT` > `ORDER BY` > `LIMIT`"}, {"t": "Module 1 - Basics", "b": "`SELECT DISTINCT a, b AS x FROM t WHERE a IN (1,2) AND b BETWEEN 1 AND 5`\n`WHERE name LIKE 'A%'` (% many, _ one)   `WHERE c IS NULL`\n`ORDER BY a DESC LIMIT 10 OFFSET 20`"}, {"t": "Module 2 - Types and NULLs", "b": "`CAST(x AS INTEGER)`   `COALESCE(a,b,'n/a')`   `NULLIF(a,'')`\nNULL = unknown: use IS NULL; NULL = NULL is not true. Empty string is not NULL. `7/2` is 3, `7/2.0` is 3.5"}, {"t": "Module 3 - Functions", "b": "`TRIM UPPER LOWER LENGTH SUBSTR REPLACE` and `a || b` to join text\n`strftime('%Y-%m', d)`  `date(d,'+1 day')`  `julianday(a)-julianday(b)`\n`CASE WHEN x>1 THEN 'a' WHEN x>0 THEN 'b' ELSE 'c' END`"}, {"t": "Module 4 - Aggregation", "b": "`COUNT(*) COUNT(col) COUNT(DISTINCT col) SUM AVG MIN MAX`\n`GROUP BY a HAVING COUNT(*) > 1`   WHERE filters rows, HAVING filters groups\n`SUM(CASE WHEN s='X' THEN 1 ELSE 0 END)` conditional aggregate"}, {"t": "Module 5 - Joins", "b": "`FROM a JOIN b ON a.id=b.a_id`  INNER keeps matches, LEFT keeps all of a\nAnti-join: `LEFT JOIN b ON ... WHERE b.id IS NULL`   `CROSS JOIN` = all pairs\nSelf join needs aliases and `a.id < b.id` to avoid mirror pairs. Filter right-table rows in ON, not WHERE"}, {"t": "Module 6 - Set operations", "b": "`UNION` (distinct) `UNION ALL` (keep all) `INTERSECT` `EXCEPT` (MINUS in Oracle)\nSame number of columns, compatible types; column names come from the first query"}, {"t": "Module 7 - Subqueries", "b": "`WHERE x > (SELECT AVG(x) FROM t)`   `WHERE id IN (SELECT ...)`\n`WHERE EXISTS (SELECT 1 FROM o WHERE o.cid = c.id)`   prefer NOT EXISTS over NOT IN (NULL trap)\nDerived table: `FROM (SELECT ...) AS d`"}, {"t": "Module 8 - CTEs", "b": "`WITH a AS (SELECT ...), b AS (SELECT ... FROM a) SELECT ... FROM b`\n`WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i+1 FROM n WHERE i<10) SELECT * FROM n`"}, {"t": "Module 9 - Window functions", "b": "`fn() OVER (PARTITION BY g ORDER BY o ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)`\n`ROW_NUMBER RANK DENSE_RANK NTILE LAG LEAD FIRST_VALUE LAST_VALUE`   `SUM(x) OVER (ORDER BY d)` = running total\nFilter window results in an outer query: `WHERE rn = 1`"}, {"t": "Module 10 - DML", "b": "`INSERT INTO t (a,b) VALUES (1,'x'), (2,'y')`   `INSERT INTO t SELECT ...`\n`UPDATE t SET a=1 WHERE id=5`   `DELETE FROM t WHERE id=5`   always preview the WHERE with a SELECT first\n`INSERT ... ON CONFLICT (id) DO UPDATE SET a = excluded.a`"}, {"t": "Module 11 - DDL", "b": "`CREATE TABLE t (id INTEGER PRIMARY KEY, e TEXT NOT NULL UNIQUE, a INT CHECK (a>=0), s TEXT DEFAULT 'x')`\n`ALTER TABLE t ADD COLUMN c TEXT`   `FOREIGN KEY (c_id) REFERENCES c(id)`   M:N needs a junction table\nNormal forms: 1NF atomic cells, 2NF no partial key dependency, 3NF no non-key dependency"}, {"t": "Module 12 - Views and programmable objects", "b": "`CREATE VIEW v AS SELECT ...`   materialized views store results (refresh needed)\n`CREATE TRIGGER t AFTER UPDATE OF c ON tbl BEGIN INSERT INTO log VALUES (OLD.c, NEW.c); END;`\nStored procedures: T-SQL, PL/pgSQL, MySQL, PL/SQL (not in SQLite). Avoid cursors"}, {"t": "Module 13 - Transactions", "b": "`BEGIN; ...; COMMIT;`   `ROLLBACK;`   `SAVEPOINT s; ... ROLLBACK TO s;`\nACID. Isolation: read uncommitted, read committed, repeatable read, serializable"}, {"t": "Module 14 - Indexes and performance", "b": "`CREATE INDEX ix ON t (a, b)`   `CREATE UNIQUE INDEX ux ON t (e)`   `EXPLAIN QUERY PLAN SELECT ...`\nSargable: `d >= '2024-01-01' AND d < '2025-01-01'` not `strftime('%Y',d)='2024'`. Keyset paging: `WHERE id > :last ORDER BY id LIMIT n`"}, {"t": "Module 15 - Advanced analytics", "b": "Cohort: `MIN(order_date)` per customer in a CTE, group by month\nFunnel: `COUNT(DISTINCT user)` per step. RFM: `NTILE(4)` on recency, frequency, monetary\nReconcile: counts and sums source vs target; mismatches should be 0"}, {"t": "Module 16 - Data warehousing", "b": "Fact (measures) + dimensions (descriptions); star vs snowflake\nSCD1 overwrite, SCD2 new row with valid_from/valid_to, SCD3 previous-value column\nETL transform then load; ELT load then transform. Incremental load: only new or changed rows"}, {"t": "Module 17 - Security", "b": "`GRANT SELECT ON v TO analyst`   `REVOKE ...`   least privilege, row-level security, masking views\nPrevent injection: parameters `WHERE name = ?` never string concatenation"}, {"t": "Module 18 - Real world", "b": "Ticket > data dictionary > small query > check row counts > reconcile > document > review > share\ndev, test, prod environments. Clarify the metric definition before writing SQL"}, {"t": "Module 19 - Dialects", "b": "LIMIT n (most) / TOP n (SQL Server) / FETCH FIRST n ROWS ONLY (Oracle)\nJoin text: pipes (SQLite, PostgreSQL, Oracle) or CONCAT (MySQL). Full table: Module 19 lesson 4"}, {"t": "Module 20 - Connections", "b": "URL: `postgresql://user@host:5432/db`   ports 5432 PG, 3306 MySQL, 1433 SQL Server, 1521 Oracle\nPython: sqlite3, psycopg, mysql-connector, pyodbc, oracledb, SQLAlchemy, pandas.read_sql. Secrets in environment variables"}, {"t": "Module 21 - Power BI and Excel", "b": "Power BI: Get Data > database > Import (fast) or DirectQuery (live). Native query in Advanced options\nExcel: Data > Get Data > From Database. Load to Data Model for PivotTables. Refresh All"}, {"t": "Function reference", "b": "| Function | What it does | Example |\n| COUNT | counts rows or values | COUNT(*) |\n| SUM / AVG | total / average | AVG(price) |\n| MIN / MAX | smallest / largest | MAX(salary) |\n| ROUND | rounds a number | ROUND(x,2) |\n| COALESCE | first non-NULL | COALESCE(a,0) |\n| NULLIF | NULL if equal | NULLIF(a,'') |\n| CAST | change type | CAST(x AS INTEGER) |\n| TRIM | remove spaces | TRIM(name) |\n| UPPER / LOWER | change case | UPPER(city) |\n| SUBSTR | cut text | SUBSTR(s,1,3) |\n| INSTR | find text position | INSTR(s,'@') |\n| REPLACE | swap text | REPLACE(s,'-','') |\n| LENGTH | text length | LENGTH(s) |\n| strftime | format a date | strftime('%Y-%m',d) |\n| julianday | date as number | julianday(a)-julianday(b) |\n| ROW_NUMBER | 1,2,3 per group | ROW_NUMBER() OVER (...) |\n| RANK / DENSE_RANK | ranking with ties | RANK() OVER (...) |\n| LAG / LEAD | previous / next row | LAG(x) OVER (...) |\n| NTILE | split into n buckets | NTILE(4) OVER (...) |\n| GROUP_CONCAT | join values (STRING_AGG elsewhere) | GROUP_CONCAT(n) |"}], "gloss": [{"t": "1NF", "b": "one value per cell, no repeating groups"}, {"t": "2NF", "b": "1NF and every column depends on the whole key"}, {"t": "3NF", "b": "2NF and no column depends on a non-key column"}, {"t": "ACID", "b": "atomicity, consistency, isolation, durability"}, {"t": "Aggregate function", "b": "function that combines many rows into one value"}, {"t": "Airflow", "b": "tool that schedules data pipelines"}, {"t": "Alias", "b": "temporary name given with AS"}, {"t": "Anti-join", "b": "rows with no match in another table"}, {"t": "ARPU", "b": "average revenue per user"}, {"t": "B-tree", "b": "default balanced-tree index structure"}, {"t": "BCNF", "b": "every determinant is a candidate key"}, {"t": "CASE", "b": "SQL if/else expression"}, {"t": "CAST", "b": "converts a value to another type"}, {"t": "CDC", "b": "change data capture"}, {"t": "CHECK", "b": "rule every row must satisfy"}, {"t": "Churn", "b": "customers who leave"}, {"t": "Clustered index", "b": "index that defines the physical row order"}, {"t": "COALESCE", "b": "returns the first non-NULL value"}, {"t": "Cohort", "b": "group of users who started in the same period"}, {"t": "Column", "b": "one field with a name and data type"}, {"t": "Columnar storage", "b": "storing data by column for fast analytics"}, {"t": "COMMIT", "b": "saves a transaction"}, {"t": "Composite index", "b": "index on several columns"}, {"t": "Composite key", "b": "primary key made of several columns"}, {"t": "Connection pooling", "b": "reusing open connections"}, {"t": "Connection string", "b": "text with host, port, database and credentials"}, {"t": "Constraint", "b": "rule enforced by the database"}, {"t": "Correlated subquery", "b": "subquery that uses the outer row"}, {"t": "Covering index", "b": "index containing every column a query needs"}, {"t": "Cross join", "b": "every combination of rows"}, {"t": "CTE", "b": "named temporary result defined with WITH"}, {"t": "Cursor", "b": "row-by-row processing object, usually avoid"}, {"t": "Data lake", "b": "store of raw files"}, {"t": "Data masking", "b": "hiding sensitive values"}, {"t": "Data warehouse", "b": "central store of cleaned data for analysis"}, {"t": "Database", "b": "organised collection of data"}, {"t": "DBMS", "b": "software that stores and manages databases"}, {"t": "dbt", "b": "tool that builds tested SQL models"}, {"t": "DCL", "b": "commands that control access"}, {"t": "DDL", "b": "commands that define structure"}, {"t": "Deadlock", "b": "two transactions waiting on each other"}, {"t": "DEFAULT", "b": "value used when none is given"}, {"t": "Denormalization", "b": "deliberately repeating data for speed"}, {"t": "Derived table", "b": "subquery in FROM"}, {"t": "Dimension table", "b": "table of descriptive attributes"}, {"t": "DirectQuery", "b": "Power BI mode that queries the database live"}, {"t": "Dirty read", "b": "reading uncommitted data"}, {"t": "DISTINCT", "b": "removes duplicate rows from a result"}, {"t": "DML", "b": "commands that change data"}, {"t": "DQL", "b": "commands that read data"}, {"t": "Driver", "b": "software connecting a program to a database"}, {"t": "Dynamic SQL", "b": "SQL built as text at run time"}, {"t": "ELT", "b": "extract, load, then transform in the warehouse"}, {"t": "ER diagram", "b": "picture of tables and relationships"}, {"t": "ETL", "b": "extract, transform, load"}, {"t": "Execution plan", "b": "steps r many small transactions"}, {"t": "Operator", "b": "symbol like =, <, AND, LIKE"}, {"t": "Parameterized query", "b": "query with placeholders for values"}, {"t": "PARTITION BY", "b": "restarts a window calculation for each group"}, {"t": "Partitioning", "b": "splitting a table into parts"}, {"t": "Phantom read", "b": "new rows appearing between two reads"}, {"t": "PII", "b": "personally identifiable information"}, {"t": "Predicate", "b": "condition that is true, false or unknown"}, {"t": "Primary key", "b": "column(s) that uniquely identify each row"}, {"t": "Query", "b": "a request for data or a change"}, {"t": "Query folding", "b": "Power Query pushing steps down to the database as SQL"}, {"t": "RDBMS", "b": "DBMS that stores data in related tables"}, {"t": "Reconciliation", "b": "proving two data sources agree"}, {"t": "Recursive CTE", "b": "CTE that refers to itself, used for series and hierarchies"}, {"t": "Replication", "b": "copying data to other servers"}, {"t": "Retention", "b": "share of users who return"}, {"t": "RFM", "b": "recency, frequency, monetary segmentation"}, {"t": "ROLLBACK", "b": "undoes a transaction"}, {"t": "Row", "b": "one record in a table"}, {"t": "Row explosion", "b": "duplicate rows from joining one-to-many data"}, {"t": "Row-level security", "b": "rules limiting which rows a user sees"}, {"t": "Running total", "b": "cumulative sum using SUM() OVER (ORDER BY ...)"}, {"t": "Sargable", "b": "written so an index can be used"}, {"t": "Savepoint", "b": "marker for a partial rollback"}, {"t": "SCD", "b": "slowly changing dimension"}, {"t": "Schema", "b": "named group of tables and objects; also the structure of a database"}, {"t": "Self join", "b": "table joined to itself"}, {"t": "Semi-join", "b": "rows that have a match, without duplicating them"}, {"t": "Set operation", "b": "UNION, INTERSECT or EXCEPT on two results"}, {"t": "Sharding", "b": "spreading data over several servers"}, {"t": "Snowflake schema", "b": "star schema with normalized dimensions"}, {"t": "SQL", "b": "Structured Query Language for relational databases"}, {"t": "SQL injection", "b": "attack that inserts SQL through user input"}, {"t": "Staging", "b": "area where raw data lands before transformation"}, {"t": "Star schema", "b": "fact table surrounded by dimension tables"}, {"t": "Stored procedure", "b": "saved program inside the database"}, {"t": "Subquery", "b": "query inside another query"}, {"t": "Surrogate key", "b": "generated id with no business meaning"}, {"t": "Table", "b": "grid of rows and columns about one subject"}, {"t": "TCL", "b": "commands that control transactions"}, {"t": "Three-valued logic", "b": "true, false or unknown results caused by NULL"}, {"t": "Transaction", "b": "group of statements that succeed or fail together"}, {"t": "Trigger", "b": "code that runs automatically on a data change"}, {"t": "UDF", "b": "user-defined function"}, {"t": "Unique constraint", "b": "forbids duplicate values in a column"}, {"t": "UPSERT", "b": "insert or update if the key exists"}, {"t": "View", "b": "saved query used like a table"}, {"t": "Wildcard", "b": "LIKE symbol: % any characters, _ one character"}, {"t": "Window function", "b": "calculation over related rows without collapsing them"}], "int": [{"t": "[Basic] What is SQL?", "b": "Structured Query Language, used to define, query and change data in relational databases."}, {"t": "[Basic] DDL vs DML vs DQL vs DCL vs TCL?", "b": "DDL defines structure, DML changes data, DQL reads, DCL controls permissions, TCL controls transactions."}, {"t": "[Basic] Primary key vs unique key?", "b": "A table has one primary key (unique, not NULL); it can have many unique keys, which may allow NULL."}, {"t": "[Basic] What is a foreign key?", "b": "A column that must match a key in another table, enforcing the relationship."}, {"t": "[Basic] WHERE vs HAVING?", "b": "WHERE filters rows before grouping; HAVING filters groups after aggregation."}, {"t": "[Basic] DELETE vs TRUNCATE vs DROP?", "b": "DELETE removes chosen rows, TRUNCATE empties the table quickly, DROP removes the table itself."}, {"t": "[Basic] UNION vs UNION ALL?", "b": "UNION removes duplicates; UNION ALL keeps them and is faster."}, {"t": "[Basic] INNER JOIN vs LEFT JOIN?", "b": "INNER keeps matches only; LEFT keeps all left rows with NULLs where nothing matches."}, {"t": "[Basic] What is NULL and how do you test it?", "b": "Unknown or missing; use IS NULL or IS NOT NULL, never = NULL."}, {"t": "[Basic] COUNT(*) vs COUNT(column)?", "b": "COUNT(*) counts rows; COUNT(column) skips NULLs."}, {"t": "[Basic] What does DISTINCT do?", "b": "Removes duplicate rows from the result."}, {"t": "[Basic] What do % and _ mean in LIKE?", "b": "% matches any number of characters, _ matches exactly one."}, {"t": "[Basic] What is the default ORDER BY direction?", "b": "Ascending (ASC)."}, {"t": "[Basic] What does GROUP BY do?", "b": "Groups rows with the same values so aggregates are computed per group."}, {"t": "[Basic] What is an alias?", "b": "A temporary name for a column or table, set with AS."}, {"t": "[Basic] What is a view?", "b": "A saved query that behaves like a table."}, {"t": "[Basic] What is an index?", "b": "A structure that lets the database find rows without scanning the whole table."}, {"t": "[Basic] Name SQL constraints.", "b": "PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK, DEFAULT."}, {"t": "[Basic] CHAR vs VARCHAR?", "b": "CHAR is fixed length (padded); VARCHAR stores only the characters used."}, {"t": "[Basic] What is normalization?", "b": "Organising tables to remove repeated data and update anomalies."}, {"t": "[Basic] SQL vs NoSQL?", "b": "SQL uses structured tables and joins with ACID; NoSQL uses flexible models for scale or simple access patterns."}, {"t": "[Basic] What is a schema?", "b": "A named container for tables and objects, or the overall structure of the database."}, {"t": "[Basic] Is BETWEEN inclusive?", "b": "Yes, both end values are included."}, {"t": "[Basic] IN vs EXISTS?", "b": "IN compares against a list; EXISTS checks if the subquery returns any row and can stop early."}, {"t": "[Basic] What is CASE?", "b": "SQL's if/else expression returning the first matching branch."}, {"t": "[Basic] What does COALESCE do?", "b": "Returns the first non-NULL argument."}, {"t": "[Basic] What is a subquery?", "b": "A query nested inside another query."}, {"t": "[Basic] What is a CTE?", "b": "A named temporary result defined with WITH to make queries readable."}, {"t": "[Basic] How do you limit rows across databases?", "b": "LIMIT (PostgreSQL, MySQL, SQLite), TOP (SQL Server), FETCH FIRST (Oracle)."}, {"t": "[Basic] What is a self join?", "b": "A table joined to itself using two aliases."}, {"t": "[Basic] What is a cross join?", "b": "Every row of one table paired with every row of the other."}, {"t": "[Basic] Name the aggregate functions.", "b": "COUNT, SUM, AVG, MIN, MAX."}, {"t": "[Basic] DBMS vs RDBMS?", "b": "An RDBMS stores data in related tables using SQL; a DBMS is any database software."}, {"t": "[Basic] What is a composite key?", "b": "A key made of two or more columns together."}, {"t": "[Basic] What is a surrogate key?", "b": "A generated identifier with no business meaning."}, {"t": "[Basic] What does DEFAULT do?", "b": "Supplies a value when none is given on insert."}, {"t": "[Basic] What does CHECK do?", "b": "Rejects rows that break a rule such as age >= 18."}, {"t": "[Basic] How is auto-numbering done?", "b": "AUTO_INCREMENT (MySQL), IDENTITY (SQL Server), GENERATED AS IDENTITY (PostgreSQL), INTEGER PRIMARY KEY (SQLite)."}, {"t": "[Basic] IFNULL vs ISNULL vs NVL?", "b": "Same idea in MySQL/SQLite, SQL Server and Oracle; COALESCE is the portable standard."}, {"t": "[Basic] What is the logical order of a query?", "b": "FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT."}, {"t": "[Basic] What is a cursor?", "b": "An object that processes rows one by one; slow, so prefer set-based SQL."}, {"t": "[Basic] What is a trigger?", "b": "Code that runs automatically when data changes."}, {"t": "[Basic] What is a stored procedure?", "b": "A saved program in the database that can take parameters."}, {"t": "[Basic] CAST vs CONVERT?", "b": "Both change type; CAST is standard, CONVERT is SQL Server/MySQL-specific with extra formats."}, {"t": "[Basic] What is a table, row and column?", "b": "A table holds records (rows) made of fields (columns)."}, {"t": "[Intermediate] ROW_NUMBER vs RANK vs DENSE_RANK?", "b": "ROW_NUMBER is unique, RANK leaves gaps after ties, DENSE_RANK has no gaps."}, {"t": "[Intermediate] Window function vs GROUP BY?", "b": "A window function keeps every row and adds a calculation; GROUP BY collapses rows."}, {"t": "[Intermediate] What is a correlated subquery?", "b": "A subquery that refers to the outer row and runs once per outer row."}, {"t": "[Intermediate] How do you find duplicates?", "b": "GROUP BY the columns and HAVING COUNT(*) > 1."}, {"t": "[Intermediate] How do you delete duplicates?", "b": "Number rows with ROW_NUMBER over the duplicate columns and delete rn > 1."}, {"t": "[Intermediate] Find the second highest salary.", "b": "MAX(salary) below the maximum, or DENSE_RANK() = 2, or LIMIT 1 OFFSET 1 on distinct salaries."}, {"t": "[Intermediate] Find the Nth highest value.", "b": "DENSE_RANK() over salary DESC and filter rank = N."}, {"t": "[Intermediate] How do you get a running total?", "b": "SUM(x) OVER (ORDER BY date)."}, {"t": "[Intermediate] What are LAG and LEAD for?", "b": "Read the previous or next row's value, for growth and gap calculations."}, {"t": "[Intermediate] How do you get top N per group?", "b": "ROW_NUMBER or RANK partitioned by group, then filter rn <= N."}, {"t": "[Intermediate] ON vs WHERE in a LEFT JOIN?", "b": "Right-table filters in WHERE turn it into an inner join; put them in ON."}, {"t": "[Intermediate] NOT IN vs NOT EXISTS?", "b": "NOT IN returns nothing if the list contains NULL; NOT EXISTS is safe."}, {"t": "[Intermediate] What is an anti-join?", "b": "Rows with no match, written as LEFT JOIN ... WHERE right.id IS NULL or NOT EXISTS."}, {"t": "[Intermediate] What is a semi-join?", "b": "Rows that have a match, written with EXISTS, without duplicating rows."}, {"t": "[Intermediate] What is a recursive CTE used for?", "b": "Hierarchies (org charts) and generated series (dates, numbers)."}, {"t": "[Intermediate] Temp table vs CTE vs table variable?", "b": "A CTE lives for one statement; a temp table is stored and reusable in the session; a table variable is a lightweight temp structure (SQL Server)."}, {"t": "[Intermediate] View vs materialized view?", "b": "A view runs its query each time; a materialized view stores the result and must be refreshed."}, {"t": "[Intermediate] Clustered vs non-clustered index?", "b": "Clustered defines the physical row order (one per table); non-clustered is a separate lookup structure."}, {"t": "[Intermediate] What is a covering index?", "b": "An index that contains every column the query needs, so the table is not read."}, {"t": "[Intermediate] Does composite index column order matter?", "b": "Yes, queries must use the leftmost columns to benefit."}, {"t": "[Intermediate] When can indexes hurt?", "b": "They slow INSERT/UPDATE/DELETE and use space; too many or unused indexes are a cost."}, {"t": "[Intermediate] What does EXPLAIN show?", "b": "The execution plan: scans, index use, join methods and cost estimates."}, {"t": "[Intermediate] What is a sargable condition?", "b": "One written so an index can be used, e.g. a range on the raw column, not a function of it."}, {"t": "[Intermediate] How do you paginate at scale?", "b": "Keyset pagination (WHERE id > last_id ORDER BY id LIMIT n) instead of large OFFSETs."}, {"t": "[Intermediate] What is ACID?", "b": "Atomicity, Consistency, Isolation, Durability."}, {"t": "[Intermediate] COMMIT vs ROLLBACK?", "b": "COMMIT saves the transaction; ROLLBACK undoes it."}, {"t": "[Intermediate] What is a SAVEPOINT?", "b": "A marker inside a transaction you can roll back to."}, {"t": "[Intermediate] List the isolation levels.", "b": "Read uncommitted, read committed, repeatable read, serializable."}, {"t": "[Intermediate] Dirty vs non-repeatable vs phantom read?", "b": "Reading uncommitted data; a row changing between reads; new rows appearing between reads."}, {"t": "[Intermediate] What is a deadlock?", "b": "Two transactions each wait for a lock the other holds; the database cancels one."}, {"t": "[Intermediate] What is UPSERT/MERGE?", "b": "Insert a row or update it if the key exists."}, {"t": "[Intermediate] What is conditional aggregation?", "b": "SUM or COUNT over a CASE expression to compute several filtered totals in one pass."}, {"t": "[Intermediate] How do you pivot without PIVOT?", "b": "SUM(CASE WHEN category = 'X' THEN value END) per output column."}, {"t": "[Intermediate] GROUPING SETS, ROLLUP, CUBE?", "b": "Compute totals at several grouping levels in one query."}, {"t": "[Intermediate] How do you concatenate grouped values?", "b": "STRING_AGG (PostgreSQL, SQL Server), GROUP_CONCAT (MySQL, SQLite), LISTAGG (Oracle)."}, {"t": "[Intermediate] What does NTILE do?", "b": "Splits ordered rows into N roughly equal buckets (quartiles, deciles)."}, {"t": "[Intermediate] FIRST_VALUE/LAST_VALUE gotcha?", "b": "The default frame ends at the current row, so LAST_VALUE needs ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING."}, {"t": "[Intermediate] ROWS vs RANGE frames?", "b": "ROWS counts physical rows; RANGE includes all rows with the same ORDER BY value."}, {"t": "[Intermediate] Explain 1NF, 2NF, 3NF.", "b": "1NF atomic values; 2NF no partial dependency on part of a key; 3NF no dependency on non-key columns."}, {"t": "[Intermediate] What is BCNF?", "b": "Every determinant must be a candidate key; a stricter 3NF."}, {"t": "[Intermediate] Why denormalize?", "b": "To avoid joins and speed up reporting at the cost of redundancy."}, {"t": "[Intermediate] How do you model many-to-many?", "b": "With a junction table holding both foreign keys."}, {"t": "[Intermediate] What is gaps and islands?", "b": "Grouping consecutive values by subtracting ROW_NUMBER from the value to find runs."}, {"t": "[Intermediate] How do you find missing numbers in a sequence?", "b": "Generate the full series with a recursive CTE and anti-join, or compare with LEAD."}, {"t": "[Intermediate] How do you compute a median?", "b": "PERCENTILE_CONT(0.5) where available, otherwise the middle one or two rows by ROW_NUMBER."}, {"t": "[Intermediate] How do you compare two periods?", "b": "Aggregate each in a CTE and join, or use conditional aggregation or LAG."}, {"t": "[Intermediate] What is a semi-structured data type?", "b": "JSON/XML columns queried with functions such as JSON_EXTRACT or ->>."}, {"t": "[Intermediate] How do you handle NULLs in aggregates?", "b": "Most aggregates ignore NULLs; use COALESCE when a zero is wanted."}, {"t": "[Intermediate] DELETE vs TRUNCATE rollback?", "b": "DELETE is fully logged and filterable; TRUNCATE is faster and has limits (no WHERE, identity reset)."}, {"t": "[Intermediate] Subquery vs join performance?", "b": "The optimizer often treats them the same; prefer the clearer one and check the plan."}, {"t": "[Intermediate] What does LIKE '%abc' cost?", "b": "A leading wildcard prevents index use and forces a scan."}, {"t": "[Intermediate] How do you update with data from another table?", "b": "UPDATE ... FROM (PostgreSQL, SQL Server), a join update (MySQL) or a correlated subquery."}, {"t": "[Intermediate] What is an identity column?", "b": "A column the database fills with automatically increasing numbers."}, {"t": "[Intermediate] How do you avoid divide-by-zero?", "b": "Use NULLIF(denominator, 0)."}, {"t": "[Intermediate] What is data type precedence?", "b": "When mixing types, the engine converts to the higher-precedence type, which can slow queries or cause errors."}, {"t": "[Intermediate] How do you get the latest row per group?", "b": "ROW_NUMBER() OVER (PARTITION BY group ORDER BY date DESC) = 1."}, {"t": "[Advanced] What is MVCC?", "b": "Multi-version concurrency control keeps row versions so readers do not block writers."}, {"t": "[Advanced] Optimistic vs pessimistic concurrency?", "b": "Optimistic checks for conflicts at save time; pessimistic locks first."}, {"t": "[Advanced] Partitioning vs sharding?", "b": "Partitioning splits a table inside one server; sharding spreads data across servers."}, {"t": "[Advanced] What is replication?", "b": "Copying data to other servers for read scaling and failover."}, {"t": "[Advanced] OLTP vs OLAP?", "b": "OLTP handles many small transactions; OLAP handles large analytical reads."}, {"t": "[Advanced] Star vs snowflake schema?", "b": "Star keeps denormalized dimensions; snowflake normalizes them into more tables."}, {"t": "[Advanced] Fact vs dimension table?", "b": "Facts hold measurements and keys; dimensions hold descriptive attributes."}, {"t": "[Advanced] Explain SCD types 1, 2, 3.", "b": "1 overwrites, 2 adds a new row with validity dates to keep history, 3 keeps the previous value in a column."}, {"t": "[Advanced] ETL vs ELT?", "b": "ETL transforms before loading; ELT loads raw data then transforms inside the warehouse."}, {"t": "[Advanced] What is an incremental load and CDC?", "b": "Loading only new or changed rows; CDC captures those changes from the source log."}, {"t": "[Advanced] Why is columnar storage fast for analytics?", "b": "Queries read only needed columns and compress similar values well."}, {"t": "[Advanced] What do statistics do for the optimizer?", "b": "They estimate row counts so it picks good join orders and index use."}, {"t": "[Advanced] Name join algorithms.", "b": "Nested loop, hash join and merge join."}, {"t": "[Advanced] What is the N+1 problem?", "b": "Running one query per row from application code instead of one join."}, {"t": "[Advanced] How do you prevent SQL injection?", "b": "Parameterized queries, least privilege and input validation, never string concatenation."}, {"t": "[Advanced] What is row-level security?", "b": "Policies that restrict which rows a user can see or change."}, {"t": "[Advanced] What is data masking?", "b": "Hiding sensitive values, for example showing only part of an email."}, {"t": "[Advanced] Backup types and PITR?", "b": "Full, differential and log backups; point-in-time recovery replays logs to a chosen moment."}, {"t": "[Advanced] What makes a load idempotent?", "b": "Re-running it gives the same result, for example via upsert or delete-and-insert by key."}, {"t": "[Advanced] How do you debug a slow query?", "b": "Check the plan, row estimates, missing or unused indexes, non-sargable filters, join order and data volume."}, {"t": "[Advanced] What is lock escalation?", "b": "Many small locks are converted into one larger lock, reducing concurrency."}, {"t": "[Advanced] What is index fragmentation?", "b": "Index pages become out of order or sparse, slowing scans until rebuilt."}, {"t": "[Advanced] What is a bitmap index?", "b": "An index using bit arrays, good for low-cardinality columns in analytics."}, {"t": "[Advanced] How does full-text search differ from LIKE?", "b": "It uses an inverted index with stemming and ranking, so it is faster and smarter."}, {"t": "[Advanced] How do you reconcile source and target?", "b": "Compare row counts, sums and key sets; investigate missing, extra and changed keys."}, {"t": "[Advanced] Which data quality checks do you run?", "b": "Nulls, duplicates, ranges, referential integrity, freshness and totals."}, {"t": "[Advanced] What is dbt?", "b": "A tool that turns SELECT files into tested, documented models with lineage."}, {"t": "[Advanced] Snowflake vs BigQuery?", "b": "Snowflake uses sized virtual warehouses; BigQuery is serverless and bills by data scanned."}, {"t": "[Advanced] What is a lakehouse?", "b": "A data lake with table formats and SQL engines giving warehouse features."}, {"t": "[Advanced] How do you design a retention query?", "b": "Cohort by first period, join later activity, and divide returned users by cohort size."}, {"t": "[Advanced] Why avoid SELECT *?", "b": "It reads unneeded columns, breaks when schemas change and blocks covering indexes."}, {"t": "[Advanced] What is an execution plan cost?", "b": "The optimizer's relative estimate of work, used to compare plans."}, {"t": "[Advanced] What is query hint usage?", "b": "Directives that override optimizer choices; use rarely and document why."}, {"t": "[Advanced] How do you handle slowly growing tables?", "b": "Archive or partition by date, index for common filters and purge on a schedule."}, {"t": "[Advanced] What is eventual consistency?", "b": "Replicas may be briefly out of date but converge, common in distributed NoSQL."}]};

const KW=['WITH','SELECT','FROM','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','CROSS JOIN','JOIN','WHERE','GROUP BY','HAVING','ORDER BY','LIMIT','OFFSET','UNION ALL','UNION','INTERSECT','EXCEPT','INSERT INTO','VALUES','UPDATE','SET','DELETE FROM','CREATE UNIQUE INDEX','CREATE INDEX','CREATE TABLE','CREATE VIEW','CREATE TRIGGER','DROP TABLE','ALTER TABLE'];
function clauses(sql){
 const s=sql.trim().replace(/;\s*$/,'').replace(/\s+/g,' '),out=[];let d=0,q='',st=0,cu=null;
 for(let i=0;i<s.length;i++){const c=s[i];
  if(q){if(c===q)q='';continue}
  if(c==="'"||c==='"'){q=c;continue}
  if(c==='(')d++;else if(c===')')d--;
  if(d===0&&i>0&&s[i-1]===' '){const r=s.slice(i).toUpperCase(),k=KW.find(w=>r.startsWith(w+' ')||r===w);
   if(k){if(cu)cu.b=s.slice(st,i).trim();cu={k,b:''};out.push(cu);st=i+k.length;i+=k.length-1}}
  else if(i===0){const r=s.toUpperCase(),k=KW.find(w=>r.startsWith(w+' '));if(k){cu={k,b:''};out.push(cu);st=k.length;i=k.length-1}}}
 if(cu)cu.b=s.slice(st).trim();return out}
function explainSQL(sql){

 const L=sel?C.slice().sort((a,b)=>(rk[a.k]||9)-(rk[b.k]||9)):C;
 const T=(k,b)=>({'WITH':'Naam wali temporary query (CTE) banao, jo neeche use hogi','FROM':'Sabse pehle data is table se uthao','INNER JOIN':'Dusri table jodo, sirf wahi rows jo dono taraf match karein (ON = match ki shart)','JOIN':'Dusri table jodo, sirf match wali rows (ON = match ki shart)','LEFT JOIN':'Dusri table jodo, left ki saari rows rakho (match na mile to NULL)','RIGHT JOIN':'Dusri table jodo, right ki saari rows rakho','FULL JOIN':'Dono taraf ki saari rows rakho','CROSS JOIN':'Har row ko har row se jodo (sab combinations)',
  'WHERE':'Sirf wo rows rakho jahan ye shart sach ho (groups banne se pehle)','GROUP BY':'Rows ko in columns ke hisaab se groups me baanto','HAVING':'Ab groups ko filter karo (aggregate yahin chalta hai)',
  'SELECT':'Result me ye columns/values dikhao'+(/\bDISTINCT\b/i.test(b)?', duplicate hata ke':'')+(/\b(COUNT|SUM|AVG|MIN|MAX)\s*\(/i.test(b)?'. Aggregate function bahut rows ko milake ek number banata hai':'')+(/\bOVER\s*\(/i.test(b)?'. OVER(...) window function rows hatati nahi, har row ke saath hisaab jodti hai':'')+(/\bCASE\b/i.test(b)?'. CASE WHEN = SQL ka if/else':''),
  'ORDER BY':'Result sort karo (DESC bade se chhota, ASC chhote se bada)','LIMIT':'Sirf itni rows rakho','OFFSET':'Itni rows chhod ke aage se lo','UNION':'Dono results jodo, duplicate hata ke','UNION ALL':'Dono results jodo, duplicate ke saath','INTERSECT':'Sirf wo rows jo dono results me hain','EXCEPT':'Pehle result ki wo rows jo doosre me nahi hain',
  'INSERT INTO':'Is table me nayi row(s) daalo','VALUES':'Ye values daalo','UPDATE':'Is table ki rows badlo (WHERE na ho to saari rows!)','SET':'Naya value set karo','DELETE FROM':'Is table se rows hatao (WHERE na ho to saari rows!)','CREATE TABLE':'Nayi table banao','CREATE VIEW':'Saved query (view) banao','CREATE INDEX':'Search tez karne ke liye index banao','CREATE UNIQUE INDEX':'Unique index banao','CREATE TRIGGER':'Trigger banao','DROP TABLE':'Table hamesha ke liye hatao','ALTER TABLE':'Table ka structure badlo'}[k]||'');
 const li=L.map(c=>'<li><code>'+esc(c.k+' '+(c.b.length>70?c.b.slice(0,70)+'…':c.b))+'</code><br><small>'+T(c.k,c.b)+'</small></li>').join('');
 return '<details class="before" open><summary>Run se pehle: ye query step by step kya karegi</summary><ol>'+li+'</ol>'+(sel?'<small>Database clauses is order me chalata hai (likhne ka order alag hota hai).</small>':'')+'</details>'}

 $('theory').innerHTML='<h3>📘 Explanation</h3>'+md(l.theory);
 $('exs').innerHTML=(l.examples.length?'<h3>Examples: pehle padho, fir run karo</h3>':'')+l.examples.map((e,k)=>'<div class="ex"><b>'+esc(e.title)+'</b>'+(e.why?md(e.why):explainSQL(e.sql))+'<pre>'+esc(e.sql)+'</pre><button class="alt" data-k="'+k+'">Try in editor</button></div>').join('');
 $('exs').querySelectorAll('button').forEach(b=>b.onclick=()=>{loadDataset(l.dataset);$('ed').value=l.examples[b.dataset.k].sql;show()});
 renderList();pick(i);$('lt').scrollIntoView();
}
const TIP='<details class="before" open><summary>Sochne ka tarika (query likhne se pehle)</summary><p>1) Kaun si table chahiye (FROM)? 2) Kaun si rows chahiye (WHERE)? 3) Group karna hai (GROUP BY)? 4) Kaun se columns ya calculation (SELECT)? 5) Sort ya limit (ORDER BY, LIMIT)? Upar ke example jaisa pattern copy karke apne sawal ke hisaab se badlo.</p></details>';
function pick(i){
 ei=i;hints=0;const ex=cur.exercises[i];
 $('tabs').innerHTML='';cur.exercises.forEach((e,k)=>{const b=document.createElement('button');b.className='alt'+(k===i?' on':'')+(prog.exDone[e.id]?' d':'');b.textContent='Exercise '+(k+1)+' ('+e.level+')';b.onclick=()=>pick(k);$('tabs').appendChild(b)});
 $('before').innerHTML=ex.before?'<details class="before" open><summary>Run se pehle: kya karna hai?</summary>'+md(ex.before)+'</details>':TIP;
 $('task').textContent=ex.task;$('hint').innerHTML='';$('ed').value=ex.starter||'';$('out').innerHTML='<small>Result will appear here. Run your query first, then press Check answer.</small>';
 loadDataset(ex.dataset||cur.dataset);
}
function friendly(m){
 if(/no such column/i.test(m))return 'A column name is wrong or misspelled. Compare it with the tables on the right.';
 if(/no such table/i.test(m))return 'This table does not exist in the current dataset. Open "Tables in this dataset" below.';
 if(/syntax error/i.test(m))return 'Syntax problem: check commas, brackets, quotes and keyword spelling.';
 return 'Read the message below, it points at the problem.'}
function table(r){return '<div class="tw"><table><tr>'+r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+r.values.slice(0,200).map(v=>'<tr>'+v.map(x=>x===null?'<td><i>NULL</i></td>':'<td'+(typeof x==='number'?' class="n"':'')+'>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table></div><small>'+r.values.length+' row(s)'+(r.values.length>200?', first 200 shown':'')+'</small>'}
function show(){
 if(!ready())return;const t0=performance.now();
 try{const r=db.exec($('ed').value);const ms=(performance.now()-t0).toFixed(1);
  $('out').innerHTML=(r.length?table(r[r.length-1]):'<p class="ok">Statement executed.</p>')+' <small>· '+ms+' ms</small>';renderSchema()}
 catch(e){$('out').innerHTML='<p class="er"><b>Query failed.</b> '+friendly(e.message)+'</p><pre>'+esc(e.message)+'</pre>'}
}
function lastRes(d,sql){try{const r=d.exec(sql);return{r:r.length?r[r.length-1]:null}}catch(e){return{err:e.message}}}
function same(a,b,c){
 if(!a||!b||a.columns.length!==b.columns.length||a.values.length!==b.values.length)return false;
 const tol=c.floatTolerance||0.001,n=v=>v.map(r=>r.map(x=>typeof x==='number'?Math.round(x/tol):String(x)).join('\u0001'));
 let x=n(a.values),y=n(b.values);if(!c.ordered){x.sort();y.sort()}return x.join('\n')===y.join('\n')}
function check(){
 if(!ready())return;const ex=cur.exercises[ei],ds=ex.dataset||cur.dataset,st=ex.check&&ex.check.type==='state',a=new SQL.Database(),b=new SQL.Database();a.exec(DATASETS[ds]);b.exec(DATASETS[ds]);let u,s;
 if(st){u=lastRes(a,$('ed').value);if(!u.err)u=lastRes(a,ex.check.verify);lastRes(b,ex.solution);s=lastRes(b,ex.check.verify)}
 else{u=lastRes(a,$('ed').value);s=lastRes(b,ex.solution)}
 a.close();b.close();prog.attempts[ex.id]=(prog.attempts[ex.id]||0)+1;const cp=ex.compare||{};
 if(!u.err&&same(u.r,s.r,cp)){
  const diff=u.r.columns.join()!==s.r.columns.join();
  if(diff&&cp.strictNames){$('out').innerHTML='<p class="er"><b>Almost.</b> Values are right, but this task needs the column name <code>'+esc(s.r.columns.join(', '))+'</code> (you used <code>'+esc(u.r.columns.join(', '))+'</code>).</p>'+table(u.r);save();return}
  prog.exDone[ex.id]=true;if(cur.exercises.every(e=>prog.exDone[e.id]))prog.done[cur.id]=true;
  const nx=ei+1<cur.exercises.length,nl=lessons[lessons.indexOf(cur)+1];
  $('out').innerHTML='<p class="ok"><b>Correct! ✅</b>'+(diff?' Your column name is <code>'+esc(u.r.columns.join(', '))+'</code> and the expected one is <code>'+esc(s.r.columns.join(', '))+'</code>. The data matches, so it is accepted. Spell aliases carefully.':'')+'</p>'+table(u.r)+'<p>'+(nx?'<button id="nx">Next exercise</button>':nl?'<button id="nx">Next lesson</button>':'🎉 Course complete!')+'</p>';
  if($('nx'))$('nx').onclick=()=>nx?pick(ei+1):openL(nl);
  $('hint').innerHTML='<h3>Reference solution</h3><pre>'+esc(ex.solution)+'</pre><ol>'+(ex.explain||[]).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ol>'+explainSQL(ex.solution)}
 else $('out').innerHTML='<p class="er"><b>Not yet.</b> '+(u.err?friendly(u.err):'Compare your rows with the expected ones.')+'</p>'+(u.err?'<pre>'+esc(u.err)+'</pre>':'<b>Yours</b>'+(u.r?table(u.r):'<p>No rows</p>'))+'<b>Expected</b>'+(s.r?table(s.r):'<p>No rows</p>');
 save();renderList();pick2();
}
function pick2(){const ex=cur.exercises;[...$('tabs').children].forEach((b,k)=>b.classList.toggle('d',!!prog.exDone[ex[k].id]))}
$('run').onclick=show;$('chk').onclick=check;$('reset').onclick=()=>{loadDataset(cur.exercises[ei].dataset||cur.dataset);$('out').innerHTML='<small>Dataset reset.</small>'};$('clr').onclick=()=>{$('ed').value='';$('ed').focus()};
$('ed').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();show()}
 if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText('  ',s,t.selectionEnd,'end')}});
$('h').onclick=()=>{const ex=cur.exercises[ei];hints++;prog.hints[ex.id]=Math.max(prog.hints[ex.id]||0,hints);save();
 $('hint').innerHTML=hints===1?'<p>💡 '+esc(ex.hint1)+'</p>':hints===2?'<p>💡 '+esc(ex.hint2)+'</p>':'<h3>Solution</h3><pre>'+esc(ex.solution)+'</pre><ol>'+(ex.explain||[]).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ol>'};
$('prev').onclick=()=>{if(ei>0)pick(ei-1)};
$('next').onclick=()=>{if(ei<cur.exercises.length-1)pick(ei+1);else{const nl=lessons[lessons.indexOf(cur)+1];if(nl)openL(nl)}};
$('done').onclick=()=>{prog.done[cur.id]=true;save();renderList()};$('lq').oninput=renderList;
let tab='cheat';
function renderRef(){const q=$('rq').value.toLowerCase(),it=(REF[tab]||[]).filter(x=>(x.t+' '+x.b).toLowerCase().includes(q));
 document.querySelectorAll('#rtabs button').forEach(b=>b.style.fontWeight=b.dataset.t===tab?'700':'400');
 $('rn').innerHTML='<small>'+it.length+' item(s)</small>';$('rl').innerHTML=it.length?it.map(x=>'<details class="rf"><summary><b>'+esc(x.t)+'</b></summary><div>'+md(x.b)+'</div></details>').join(''):'<p>No match.</p>'}
document.querySelectorAll('#rtabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderRef()});$('rq').oninput=renderRef;
$('br').onclick=()=>{$('ref').hidden=false;$('app').classList.add('gone');renderRef()};$('bl').onclick=()=>{$('ref').hidden=true;$('app').classList.remove('gone')};
$('tnav').onclick=()=>{ui.nav=!ui.nav;layout()};$('tleft').onclick=()=>{ui.hideLeft=!ui.hideLeft;layout()};$('tsc').onclick=()=>{ui.schema=!ui.schema;layout()};
$('ehm').onclick=()=>{ui.eh=Math.max(70,ui.eh-50);layout()};$('ehp').onclick=()=>{ui.eh=Math.min(700,ui.eh+50);layout()};
$('fm').onclick=()=>{ui.fs=Math.max(11,ui.fs-1);layout()};$('fp').onclick=()=>{ui.fs=Math.min(26,ui.fs+1);layout()};
$('split').onpointerdown=e=>{e.preventDefault();const r=$('app').getBoundingClientRect(),nw=ui.nav?240:0;
 const mv=ev=>{ui.left=Math.min(80,Math.max(20,(ev.clientX-r.left-nw)/(r.width-nw-10)*100));layout()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)};
$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;store.set('sf.theme',t)};
if(store.get('sf.theme'))document.documentElement.dataset.theme=store.get('sf.theme');
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(prog,null,1)],{type:'application/json'}));a.download='sqlforge-progress.json';a.click()};
$('imp').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());if(typeof p.done!=='object')throw 0;prog=Object.assign(blank(),p);save();renderList();pick2()}catch(x){alert('This is not a valid progress file.')}};
$('rst').onclick=()=>{if(confirm('Reset all progress?')){prog=blank();save();renderList();pick(ei)}};
boot();
</script></body></html>
