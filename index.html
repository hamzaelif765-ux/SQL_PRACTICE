["sqlite"], "dataset": "company", "theory": "SQL commands come in groups: **DDL** (CREATE, ALTER, DROP - build structure), **DML** (INSERT, UPDATE, DELETE - change data), **DQL** (SELECT - read data), **DCL** (GRANT, REVOKE - permissions), **TCL** (COMMIT, ROLLBACK - transactions).\n\nYou write SELECT first, but the database reads in this order: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. Think of it as: pick the table, filter rows, group, filter groups, pick columns, sort, cut.\n\nCommon mistake: using a SELECT alias in WHERE (WHERE runs before SELECT). Industry use: analysts mostly use DQL; engineers also use DDL/DML. Read errors from the bottom: the message names the word or line it choked on.", "examples": [{"title": "Read a table", "sql": "SELECT dept_name FROM departments;"}], "exercises": [{"id": "m00-l02-e1", "level": "easy", "task": "Show all columns of the departments table.", "starter": "SELECT ", "hint1": "Use * for all columns.", "hint2": "SELECT * FROM departments;", "solution": "SELECT * FROM departments;", "explain": ["* means every column", "FROM departments - the table"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m00-l02-e2", "level": "easy", "task": "Show name and salary of the 3 highest paid employees (columns: name, salary).", "starter": "SELECT ", "hint1": "Sort with ORDER BY ... DESC.", "hint2": "Add LIMIT 3 at the end.", "solution": "SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 3;", "explain": ["ORDER BY salary DESC - highest first", "LIMIT 3 - keep three rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m01-l01", "module": "Module 1 - Basics", "title": "SELECT, aliases and DISTINCT", "order": 2, "level": "beginner", "estimatedMinutes": 15, "prerequisites": ["m00-l01"], "engines": ["sqlite"], "dataset": "company", "theory": "`SELECT` chooses columns. `AS` renames them. `DISTINCT` removes duplicate rows.", "examples": [{"title": "Alias", "sql": "SELECT name AS employee, salary * 12 AS annual FROM employees LIMIT 5;"}], "exercises": [{"id": "m01-l01-e1", "level": "easy", "task": "List each distinct dept_id used by employees, sorted ascending.", "starter": "SELECT ", "hint1": "DISTINCT after SELECT.", "hint2": "Add ORDER BY dept_id.", "solution": "SELECT DISTINCT dept_id FROM employees ORDER BY dept_id;", "explain": ["DISTINCT dept_id - unique values only", "ORDER BY - sort ascending"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.001}}, {"id": "m01-l01-e2", "level": "easy", "dataset": "ecommerce", "task": "Show name and price of the 5 most expensive products priced above 1000, highest price first.", "starter": "SELECT ", "hint1": "Filter with WHERE price > 1000.", "hint2": "ORDER BY price DESC, then LIMIT 5.", "solution": "SELECT name, price FROM products WHERE price > 1000 ORDER BY price DESC LIMIT 5;", "explain": ["WHERE price > 1000 - filter", "ORDER BY price DESC - highest first", "LIMIT 5 - top five only"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.001}}]}, {"id": "m01-l02", "module": "Module 1 - Basics", "title": "Filtering with WHERE, AND/OR, IN, BETWEEN", "order": 4, "level": "beginner", "estimatedMinutes": 15, "prerequisites": ["m01-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`WHERE` keeps only rows that match. Combine tests with `AND` (both true), `OR` (either true), `NOT`. `IN (a,b,c)` is a short way to write many ORs. `BETWEEN x AND y` includes both ends.\n\nCommon mistake: mixing AND and OR without brackets - AND is evaluated first. Use brackets. Best practice: write dates as 'YYYY-MM-DD'. Industry use: every report starts by filtering to the right period and status.", "examples": [{"title": "IN and BETWEEN", "sql": "SELECT name, price FROM products WHERE category_id IN (1,2) AND price BETWEEN 500 AND 1500;"}], "exercises": [{"id": "m01-l02-e1", "level": "easy", "task": "List name and price of products in category 2 or 3 priced from 500 to 1500 (inclusive).", "starter": "SELECT ", "hint1": "IN (2,3) for the category.", "hint2": "BETWEEN 500 AND 1500 for price.", "solution": "SELECT name, price FROM products WHERE category_id IN (2,3) AND price BETWEEN 500 AND 1500;", "explain": ["IN - match any listed value", "BETWEEN - inclusive range"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m01-l02-e2", "level": "medium", "task": "List order_id and status of orders that are Cancelled or Pending and placed on or after 2024-01-01.", "starter": "SELECT ", "hint1": "Use IN for the two statuses.", "hint2": "Add AND order_date >= '2024-01-01'.", "solution": "SELECT order_id, status FROM orders WHERE status IN ('Cancelled','Pending') AND order_date >= '2024-01-01';", "explain": ["IN for status", "date compare works because ISO dates sort as text"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m01-l03", "module": "Module 1 - Basics", "title": "LIKE wildcards and IS NULL", "order": 5, "level": "beginner", "estimatedMinutes": 12, "prerequisites": ["m01-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`LIKE` searches text: `%` = any number of characters, `_` = exactly one. `'A%'` starts with A, `'%son'` ends with son.\n\n**NULL means unknown/missing.** You cannot test it with `=`. Use `IS NULL` or `IS NOT NULL`. Common mistake: `WHERE col = NULL` returns nothing. Industry use: finding missing data is the first step of any data-quality check.", "examples": [{"title": "Starts with A", "sql": "SELECT name FROM customers WHERE name LIKE 'A%';"}, {"title": "Missing values", "sql": "SELECT COUNT(*) FROM web_events WHERE customer_id IS NULL;"}], "exercises": [{"id": "m01-l03-e1", "level": "easy", "task": "Return event_id of web events that have no customer (customer_id missing).", "starter": "SELECT ", "hint1": "NULL needs IS NULL.", "hint2": "WHERE customer_id IS NULL.", "solution": "SELECT event_id FROM web_events WHERE customer_id IS NULL;", "explain": ["IS NULL - tests for missing values"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m01-l03-e2", "level": "easy", "task": "Return the name of customers whose name starts with the letter A.", "starter": "SELECT ", "hint1": "Use LIKE with %.", "hint2": "'A%' means starts with A.", "solution": "SELECT name FROM customers WHERE name LIKE 'A%';", "explain": ["% - any characters after A"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m01-l04", "module": "Module 1 - Basics", "title": "ORDER BY, LIMIT/OFFSET and arithmetic", "order": 6, "level": "beginner", "estimatedMinutes": 12, "prerequisites": ["m01-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`ORDER BY col [ASC|DESC]` sorts. `LIMIT n` keeps n rows; `OFFSET k` skips k rows first (pagination). You can calculate in SELECT: `price - cost AS margin`.\n\nDialects: SQLite/PostgreSQL/MySQL use LIMIT; SQL Server uses TOP or OFFSET/FETCH; Oracle uses FETCH FIRST. Common mistake: LIMIT without ORDER BY gives random rows. Style: UPPERCASE keywords, snake_case names, one clause per line.", "examples": [{"title": "Top margins", "sql": "SELECT name, price - cost AS margin FROM products ORDER BY margin DESC LIMIT 5;"}], "exercises": [{"id": "m01-l04-e1", "level": "medium", "task": "Show name and margin (price - cost) of the 5 products with the highest margin.", "starter": "SELECT ", "hint1": "Calculate price - cost AS margin.", "hint2": "ORDER BY margin DESC LIMIT 5.", "solution": "SELECT name, price - cost AS margin FROM products ORDER BY margin DESC LIMIT 5;", "explain": ["alias can be used in ORDER BY", "DESC - biggest first"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m01-l04-e2", "level": "medium", "task": "Page 2 of customers (10 per page): customer_id and name, ordered by customer_id.", "starter": "SELECT ", "hint1": "Page size is LIMIT.", "hint2": "Skip the first page with OFFSET 10.", "solution": "SELECT customer_id, name FROM customers ORDER BY customer_id LIMIT 10 OFFSET 10;", "explain": ["LIMIT 10 - page size", "OFFSET 10 - skip page 1"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m02-l01", "module": "Module 2 - Data types and NULLs", "title": "Data types and casting", "order": 7, "level": "beginner", "estimatedMinutes": 12, "prerequisites": ["m01-l04"], "engines": ["sqlite"], "dataset": "company", "theory": "Every column has a type: numbers (INTEGER, DECIMAL, REAL), text, dates/times, boolean, JSON, UUID, binary. SQLite is flexible, PostgreSQL/SQL Server are strict.\n\n`CAST(x AS type)` converts. PostgreSQL also has `x::type`; SQL Server has `CONVERT`. **Integer division pitfall:** `7/2` is 3 in SQLite, PostgreSQL and SQL Server; use `7/2.0` for 3.5.\n\nIndustry use: numbers stored as text in imported files must be cast before summing.", "examples": [{"title": "Integer vs decimal division", "sql": "SELECT 7/2 AS int_div, 7/2.0 AS real_div;"}], "exercises": [{"id": "m02-l01-e1", "level": "easy", "task": "Return two numbers: 7/2 as int_div and 7/2.0 as real_div.", "starter": "SELECT ", "hint1": "Divide integers, then one decimal.", "hint2": "7/2 and 7/2.0.", "solution": "SELECT 7/2 AS int_div, 7/2.0 AS real_div;", "explain": ["both ints -> integer result", "one decimal -> decimal result"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m02-l01-e2", "level": "medium", "task": "Show emp_id and salary cast to INTEGER as salary_int for employees 1 to 5.", "starter": "SELECT ", "hint1": "CAST(salary AS INTEGER).", "hint2": "Add WHERE emp_id <= 5 and ORDER BY emp_id.", "solution": "SELECT emp_id, CAST(salary AS INTEGER) AS salary_int FROM employees WHERE emp_id <= 5 ORDER BY emp_id;", "explain": ["CAST converts the type"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m02-l02", "module": "Module 2 - Data types and NULLs", "title": "NULL handling: COALESCE and NULLIF", "order": 8, "level": "beginner", "estimatedMinutes": 15, "prerequisites": ["m02-l01"], "engines": ["sqlite"], "dataset": "dirty", "theory": "NULL is unknown, so `NULL = NULL` is not true (three-valued logic: true, false, unknown). An empty string `''` is NOT NULL - it is a real but empty value.\n\n`COALESCE(a,b,c)` returns the first non-NULL. `NULLIF(a,b)` returns NULL when a equals b - handy to turn `''` into NULL. Other names: IFNULL (SQLite/MySQL), ISNULL (SQL Server), NVL (Oracle).\n\nIndustry use: clean report columns so blanks show a label like 'missing'.", "examples": [{"title": "Fill blanks", "sql": "SELECT id, COALESCE(NULLIF(TRIM(email),''),'missing') AS email FROM dirty_customers LIMIT 10;"}], "exercises": [{"id": "m02-l02-e1", "level": "easy", "task": "For dirty_customers ids 1 to 20 return id and COALESCE(email,'unknown') as email, ordered by id.", "starter": "SELECT ", "hint1": "COALESCE(email,'unknown').", "hint2": "WHERE id <= 20 ORDER BY id.", "solution": "SELECT id, COALESCE(email,'unknown') AS email FROM dirty_customers WHERE id <= 20 ORDER BY id;", "explain": ["COALESCE only replaces NULL, not ''"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m02-l02-e2", "level": "hard", "task": "Same ids, but treat blank/space-only emails as missing too: return id and email (label 'missing').", "starter": "SELECT ", "hint1": "TRIM first, then NULLIF(...,'').", "hint2": "Wrap in COALESCE(..., 'missing').", "solution": "SELECT id, COALESCE(NULLIF(TRIM(email),''),'missing') AS email FROM dirty_customers WHERE id <= 20 ORDER BY id;", "explain": ["TRIM removes spaces", "NULLIF turns '' into NULL", "COALESCE labels NULL"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m03-l01", "module": "Module 3 - Functions", "title": "String functions", "order": 9, "level": "beginner", "estimatedMinutes": 15, "prerequisites": ["m02-l02"], "engines": ["sqlite"], "dataset": "dirty", "theory": "Common text functions: `TRIM`, `UPPER`, `LOWER`, `LENGTH`, `SUBSTR(text,start,len)`, `INSTR(text,find)`, `REPLACE`, and `||` to join text (CONCAT in MySQL/SQL Server/PostgreSQL, + in older SQL Server).\n\nCommon mistake: forgetting that ' Mumbai' and 'Mumbai' are different values. Industry use: standardising names, cities and emails before joining or counting.", "examples": [{"title": "Clean city", "sql": "SELECT id, UPPER(TRIM(city)) AS city FROM dirty_customers LIMIT 5;"}], "exercises": [{"id": "m03-l01-e1", "level": "easy", "task": "For dirty_customers ids 1 to 10 return id and TRIM(name) as name_clean, ordered by id.", "starter": "SELECT ", "hint1": "TRIM(name).", "hint2": "WHERE id <= 10 ORDER BY id.", "solution": "SELECT id, TRIM(name) AS name_clean FROM dirty_customers WHERE id <= 10 ORDER BY id;", "explain": ["TRIM removes leading/trailing spaces"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m03-l01-e2", "level": "easy", "task": "Ids 1 to 10: id and UPPER(TRIM(city)) as city, ordered by id.", "starter": "SELECT ", "hint1": "Nest TRIM inside UPPER.", "hint2": "UPPER(TRIM(city)).", "solution": "SELECT id, UPPER(TRIM(city)) AS city FROM dirty_customers WHERE id <= 10 ORDER BY id;", "explain": ["functions can be nested"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m03-l01-e3", "level": "medium", "task": "From customers (customer_id 1 to 5) return name and the first name as first_name (text before the space).", "starter": "SELECT ", "hint1": "INSTR finds the space position.", "hint2": "SUBSTR(name,1,INSTR(name,' ')-1).", "solution": "SELECT name, SUBSTR(name,1,INSTR(name,' ')-1) AS first_name FROM customers WHERE customer_id <= 5 ORDER BY customer_id;", "explain": ["INSTR finds the space", "SUBSTR cuts from 1 up to before the space"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "ecommerce"}]}, {"id": "m03-l02", "module": "Module 3 - Functions", "title": "Date and time functions", "order": 10, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m03-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Dates are stored as 'YYYY-MM-DD' text here. In SQLite use `strftime('%Y-%m', d)` for year-month and `julianday(d)` for day maths. PostgreSQL uses `DATE_TRUNC` / `EXTRACT`; SQL Server `DATEADD` / `DATEDIFF`; MySQL `DATE_FORMAT`.\n\nCommon mistake: using today's date inside a lesson - results change daily. Industry use: month-wise MIS reports start with a year-month column.", "examples": [{"title": "Year-month", "sql": "SELECT order_id, strftime('%Y-%m', order_date) AS ym FROM orders LIMIT 5;"}], "exercises": [{"id": "m03-l02-e1", "level": "easy", "task": "Orders 1 to 5: order_id and year-month as ym (format YYYY-MM), ordered by order_id.", "starter": "SELECT ", "hint1": "strftime with '%Y-%m'.", "hint2": "WHERE order_id <= 5 ORDER BY order_id.", "solution": "SELECT order_id, strftime('%Y-%m', order_date) AS ym FROM orders WHERE order_id <= 5 ORDER BY order_id;", "explain": ["strftime formats a date"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m03-l02-e2", "level": "medium", "task": "Customers 1 to 5: customer_id and whole days from signup_date to 2025-01-01 as days.", "starter": "SELECT ", "hint1": "julianday turns dates into numbers.", "hint2": "Subtract and CAST to INTEGER.", "solution": "SELECT customer_id, CAST(julianday('2025-01-01') - julianday(signup_date) AS INTEGER) AS days FROM customers WHERE customer_id <= 5 ORDER BY customer_id;", "explain": ["difference of julianday = days"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m03-l03", "module": "Module 3 - Functions", "title": "CASE WHEN conditional logic", "order": 11, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m03-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`CASE WHEN test THEN value ... ELSE value END` is SQL's if/else. First true branch wins; no ELSE gives NULL. Other names: IIF (SQL Server), DECODE (Oracle).\n\nIndustry use: banding customers (Low/Mid/High), status labels, and the basis of conditional aggregation (Module 4).", "examples": [{"title": "Price band", "sql": "SELECT product_id, CASE WHEN price < 500 THEN 'Low' WHEN price < 2000 THEN 'Mid' ELSE 'High' END AS band FROM products LIMIT 10;"}], "exercises": [{"id": "m03-l03-e1", "level": "easy", "task": "Products 1 to 10: product_id and band: Low if price < 500, Mid if < 2000, else High. Order by product_id.", "starter": "SELECT ", "hint1": "Two WHENs and an ELSE.", "hint2": "Order matters: smallest limit first.", "solution": "SELECT product_id, CASE WHEN price < 500 THEN 'Low' WHEN price < 2000 THEN 'Mid' ELSE 'High' END AS band FROM products WHERE product_id <= 10 ORDER BY product_id;", "explain": ["branches checked top to bottom"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m03-l03-e2", "level": "medium", "task": "Recharges 1 to 10: recharge_id and size = 'Big' if amount >= 249 else 'Small'. Order by recharge_id.", "starter": "SELECT ", "hint1": "One WHEN plus ELSE.", "hint2": "CASE WHEN amount >= 249 THEN 'Big' ELSE 'Small' END.", "solution": "SELECT recharge_id, CASE WHEN amount >= 249 THEN 'Big' ELSE 'Small' END AS size FROM recharges WHERE recharge_id <= 10 ORDER BY recharge_id;", "explain": ["CASE returns one label per row"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "telecom"}]}, {"id": "m04-l01", "module": "Module 4 - Aggregation", "title": "COUNT, SUM, AVG, MIN, MAX", "order": 12, "level": "beginner", "estimatedMinutes": 15, "prerequisites": ["m03-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Aggregates squeeze many rows into one value. `COUNT(*)` counts rows, `COUNT(col)` counts non-NULL values, `COUNT(DISTINCT col)` counts unique values. `SUM`, `AVG`, `MIN`, `MAX` work on numbers (MIN/MAX also on text and dates).\n\nCommon mistake: `COUNT(col)` skips NULLs, so it can be smaller than `COUNT(*)`. Industry use: totals, averages and distinct counts are the core of KPI reports.", "examples": [{"title": "Counts", "sql": "SELECT COUNT(*) AS total, COUNT(customer_id) AS with_customer FROM web_events;"}], "exercises": [{"id": "m04-l01-e1", "level": "easy", "task": "Return the number of orders as orders_cnt.", "starter": "SELECT ", "hint1": "COUNT(*).", "hint2": "SELECT COUNT(*) AS orders_cnt FROM orders;", "solution": "SELECT COUNT(*) AS orders_cnt FROM orders;", "explain": ["COUNT(*) counts rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m04-l01-e2", "level": "medium", "task": "Return the number of distinct customers who placed orders as buyers.", "starter": "SELECT ", "hint1": "DISTINCT inside COUNT.", "hint2": "COUNT(DISTINCT customer_id).", "solution": "SELECT COUNT(DISTINCT customer_id) AS buyers FROM orders;", "explain": ["DISTINCT removes repeats before counting"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m04-l01-e3", "level": "medium", "task": "Return total (all web events) and with_customer (events that have a customer).", "starter": "SELECT ", "hint1": "COUNT(col) ignores NULL.", "hint2": "Use COUNT(*) and COUNT(customer_id).", "solution": "SELECT COUNT(*) AS total, COUNT(customer_id) AS with_customer FROM web_events;", "explain": ["COUNT(col) skips NULLs"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m04-l01-e4", "level": "medium", "task": "From employees return avg_salary (rounded to 2) and max_salary.", "starter": "SELECT ", "hint1": "ROUND(AVG(...),2).", "hint2": "Add MAX(salary).", "solution": "SELECT ROUND(AVG(salary),2) AS avg_salary, MAX(salary) AS max_salary FROM employees;", "explain": ["AVG then ROUND"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "company"}]}, {"id": "m04-l02", "module": "Module 4 - Aggregation", "title": "GROUP BY and HAVING", "order": 13, "level": "intermediate", "estimatedMinutes": 18, "prerequisites": ["m04-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`GROUP BY` splits rows into groups and aggregates each group - like sorting receipts into piles by shop and totalling each pile. Every non-aggregated column in SELECT must be in GROUP BY.\n\n`WHERE` filters rows **before** grouping; `HAVING` filters groups **after**. Common mistake: using an aggregate in WHERE. Also available in other engines: GROUPING SETS, ROLLUP, CUBE (PostgreSQL/SQL Server/Oracle).", "examples": [{"title": "Customers per city", "sql": "SELECT city, COUNT(*) AS n FROM customers GROUP BY city;"}], "exercises": [{"id": "m04-l02-e1", "level": "easy", "task": "Employees per department: dept_id and emp_count, ordered by dept_id.", "starter": "SELECT ", "hint1": "GROUP BY dept_id.", "hint2": "COUNT(*) AS emp_count.", "solution": "SELECT dept_id, COUNT(*) AS emp_count FROM employees GROUP BY dept_id ORDER BY dept_id;", "explain": ["one output row per dept"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "company"}, {"id": "m04-l02-e2", "level": "medium", "task": "Cities with more than 20 customers: city and n, ordered by city.", "starter": "SELECT ", "hint1": "Group by city first.", "hint2": "HAVING COUNT(*) > 20.", "solution": "SELECT city, COUNT(*) AS n FROM customers GROUP BY city HAVING COUNT(*) > 20 ORDER BY city;", "explain": ["HAVING filters groups"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m04-l02-e3", "level": "medium", "task": "Total paid per payment method: method and total (rounded to 2), highest total first.", "starter": "SELECT ", "hint1": "SUM(amount) per method.", "hint2": "ORDER BY total DESC.", "solution": "SELECT method, ROUND(SUM(amount),2) AS total FROM payments GROUP BY method ORDER BY total DESC;", "explain": ["SUM per group"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m04-l03", "module": "Module 4 - Aggregation", "title": "Conditional aggregation and KPIs", "order": 14, "level": "intermediate", "estimatedMinutes": 18, "prerequisites": ["m04-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Put `CASE WHEN` inside `SUM` or `COUNT` to count only some rows in one pass. This builds report columns side by side (a CASE-based pivot). Other engines also have `FILTER (WHERE ...)` (PostgreSQL, SQLite) and `STRING_AGG` (`GROUP_CONCAT` in SQLite/MySQL).\n\nIndustry use: churn %, delivered vs cancelled counts, and MIS summary rows are all conditional aggregates.", "examples": [{"title": "Delivered vs cancelled", "sql": "SELECT SUM(CASE WHEN status='Delivered' THEN 1 ELSE 0 END) AS delivered, SUM(CASE WHEN status='Cancelled' THEN 1 ELSE 0 END) AS cancelled FROM orders;"}], "exercises": [{"id": "m04-l03-e1", "level": "medium", "task": "One row: delivered and cancelled order counts.", "starter": "SELECT ", "hint1": "SUM of 1/0 flags.", "hint2": "One CASE per column.", "solution": "SELECT SUM(CASE WHEN status='Delivered' THEN 1 ELSE 0 END) AS delivered, SUM(CASE WHEN status='Cancelled' THEN 1 ELSE 0 END) AS cancelled FROM orders;", "explain": ["CASE gives 1 or 0, SUM adds"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m04-l03-e2", "level": "medium", "task": "Orders per year: yr and orders, ordered by yr.", "starter": "SELECT ", "hint1": "strftime('%Y', ...).", "hint2": "GROUP BY the year alias.", "solution": "SELECT strftime('%Y', order_date) AS yr, COUNT(*) AS orders FROM orders GROUP BY yr ORDER BY yr;", "explain": ["group by an expression"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m04-l03-e3", "level": "hard", "task": "Churn percentage of telecom subscribers rounded to 1 decimal as churn_pct.", "starter": "SELECT ", "hint1": "Churned count / total.", "hint2": "Multiply by 100.0 to avoid integer division.", "solution": "SELECT ROUND(100.0 * SUM(CASE WHEN status='Churned' THEN 1 ELSE 0 END) / COUNT(*), 1) AS churn_pct FROM telecom_subscribers;", "explain": ["100.0 forces decimals"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "telecom"}]}, {"id": "m05-l01", "module": "Module 5 - Joins", "title": "INNER JOIN", "order": 15, "level": "intermediate", "estimatedMinutes": 18, "prerequisites": ["m04-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Data is split across tables to avoid repeating it. A **JOIN** glues rows from two tables where a condition matches - like matching a bill to a customer using the customer number. `INNER JOIN` keeps only rows that match on both sides.\n\nOther joins: `LEFT JOIN` (keep all left rows), `RIGHT JOIN` and `FULL OUTER JOIN` (SQLite 3.39+, PostgreSQL, SQL Server, Oracle; MySQL has no FULL), `CROSS JOIN` (every combination), `NATURAL JOIN` and `USING(col)` (shortcuts). Use table aliases (`o`, `c`) and always write the join condition in `ON`.\n\nCommon mistake: forgetting ON, which makes every row meet every row. Industry use: nearly every report joins a fact table (orders) to dimension tables (customers, products).", "examples": [{"title": "Orders with customer names", "sql": "SELECT o.order_id, c.name FROM orders o JOIN customers c ON o.customer_id = c.customer_id LIMIT 5;"}], "exercises": [{"id": "m05-l01-e1", "level": "easy", "task": "Orders 1 to 5: order_id and customer name (column name), ordered by order_id.", "starter": "SELECT ", "hint1": "Join orders to customers.", "hint2": "ON o.customer_id = c.customer_id.", "solution": "SELECT o.order_id, c.name FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_id <= 5 ORDER BY o.order_id;", "explain": ["JOIN ... ON links matching ids", "aliases keep names short"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m05-l01-e2", "level": "easy", "task": "Products 1 to 5: product_id and category_name, ordered by product_id.", "starter": "SELECT ", "hint1": "Join products to categories.", "hint2": "ON c.category_id = p.category_id.", "solution": "SELECT p.product_id, c.category_name FROM products p JOIN categories c ON c.category_id = p.category_id WHERE p.product_id <= 5 ORDER BY p.product_id;", "explain": ["each product row finds its category"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m05-l02", "module": "Module 5 - Joins", "title": "LEFT JOIN and anti-join", "order": 16, "level": "intermediate", "estimatedMinutes": 18, "prerequisites": ["m05-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`LEFT JOIN` keeps every row from the left table; where the right side has no match its columns are NULL. Filtering `WHERE right.id IS NULL` finds left rows with **no match** - an **anti-join** (e.g. orders with no payment).\n\n**ON vs WHERE:** a condition on the right table inside WHERE turns a LEFT JOIN back into an INNER JOIN. Put right-table filters in ON. Industry use: reconciliation - find records in source A missing in target B.", "examples": [{"title": "Unpaid orders", "sql": "SELECT o.order_id FROM orders o LEFT JOIN payments p ON p.order_id = o.order_id WHERE p.payment_id IS NULL LIMIT 5;"}], "exercises": [{"id": "m05-l02-e1", "level": "medium", "task": "Return order_id of orders that have no payment, ordered by order_id.", "starter": "SELECT ", "hint1": "LEFT JOIN payments.", "hint2": "Keep rows where p.payment_id IS NULL.", "solution": "SELECT o.order_id FROM orders o LEFT JOIN payments p ON p.order_id = o.order_id WHERE p.payment_id IS NULL ORDER BY o.order_id;", "explain": ["unmatched right side = NULLs", "IS NULL picks unmatched rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m05-l02-e2", "level": "medium", "task": "Customers 1 to 5: customer_id and orders_cnt (number of orders, 0 if none), ordered by customer_id.", "starter": "SELECT ", "hint1": "LEFT JOIN then GROUP BY.", "hint2": "COUNT(o.order_id) ignores NULLs, giving 0.", "solution": "SELECT c.customer_id, COUNT(o.order_id) AS orders_cnt FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id WHERE c.customer_id <= 5 GROUP BY c.customer_id ORDER BY c.customer_id;", "explain": ["count a right-side column, not *"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m05-l03", "module": "Module 5 - Joins", "title": "Joining 3+ tables and row explosion", "order": 17, "level": "intermediate", "estimatedMinutes": 20, "prerequisites": ["m05-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Chain joins one after another: order_items -> products -> categories. Each JOIN needs its own ON.\n\n**Row explosion:** joining a one-to-many table repeats the left row once per match. Summing an order-level amount after joining to items counts it many times. Always check row counts before and after a join. Industry use: revenue by category/region needs 3-4 joins.", "examples": [{"title": "Rows after join", "sql": "SELECT COUNT(*) AS rows_after_join FROM orders o JOIN order_items oi ON oi.order_id = o.order_id;"}], "exercises": [{"id": "m05-l03-e1", "level": "medium", "task": "Revenue per category: category_name and revenue (SUM of quantity*unit_price, rounded to 2), highest first.", "starter": "SELECT ", "hint1": "Join items -> products -> categories.", "hint2": "GROUP BY category_name, SUM(quantity*unit_price).", "solution": "SELECT cat.category_name, ROUND(SUM(oi.quantity * oi.unit_price),2) AS revenue FROM order_items oi JOIN products p ON p.product_id = oi.product_id JOIN categories cat ON cat.category_id = p.category_id GROUP BY cat.category_name ORDER BY revenue DESC;", "explain": ["two joins chain the tables", "SUM per category"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m05-l03-e2", "level": "easy", "task": "Return rows_after_join: the row count of orders joined to order_items.", "starter": "SELECT ", "hint1": "Join orders to order_items.", "hint2": "COUNT(*) AS rows_after_join.", "solution": "SELECT COUNT(*) AS rows_after_join FROM orders o JOIN order_items oi ON oi.order_id = o.order_id;", "explain": ["one order row repeats per item"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m05-l04", "module": "Module 5 - Joins", "title": "SELF, CROSS and non-equi joins", "order": 18, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m05-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "A **self join** joins a table to itself using two aliases (e.g. employee and manager, or pairs of customers). A **cross join** returns every combination (rows x rows). A **non-equi join** uses `<`, `>`, `BETWEEN` instead of `=`.\n\nCommon mistake: self join without `a.id < b.id` returns each pair twice and each row with itself. Industry use: generating calendars x products, finding duplicates, comparing consecutive records.", "examples": [{"title": "All combos", "sql": "SELECT COUNT(*) AS combos FROM categories CROSS JOIN suppliers;"}], "exercises": [{"id": "m05-l04-e1", "level": "easy", "task": "Return combos: number of category x supplier combinations.", "starter": "SELECT ", "hint1": "CROSS JOIN both tables.", "hint2": "COUNT(*) AS combos.", "solution": "SELECT COUNT(*) AS combos FROM categories CROSS JOIN suppliers;", "explain": ["8 x 15 rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m05-l04-e2", "level": "hard", "task": "Return pairs: number of customer pairs living in the same city (count each pair once).", "starter": "SELECT ", "hint1": "Join customers to itself on city.", "hint2": "Add a.customer_id < b.customer_id.", "solution": "SELECT COUNT(*) AS pairs FROM customers a JOIN customers b ON a.city = b.city AND a.customer_id < b.customer_id;", "explain": ["< removes self-pairs and mirror pairs"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m06-l01", "module": "Module 6 - Set operations", "title": "UNION, INTERSECT, EXCEPT", "order": 19, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m05-l04"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Set operations stack results of two queries that have the **same number of columns with compatible types**. `UNION` joins and removes duplicates, `UNION ALL` keeps duplicates (faster), `INTERSECT` keeps rows in both, `EXCEPT` keeps rows only in the first (called MINUS in Oracle).\n\nCommon mistake: using UNION when UNION ALL is meant, which silently drops rows. Industry use: comparing two periods or two systems (who was active last year but not this year).", "examples": [{"title": "Repeat customers", "sql": "SELECT customer_id FROM orders WHERE order_date < '2024-01-01' INTERSECT SELECT customer_id FROM orders WHERE order_date >= '2024-01-01';"}], "exercises": [{"id": "m06-l01-e1", "level": "medium", "task": "customer_id of customers who ordered in BOTH 2023 and 2024, ordered by customer_id.", "starter": "SELECT ", "hint1": "Two SELECTs joined by INTERSECT.", "hint2": "One for dates before 2024-01-01, one on or after.", "solution": "SELECT customer_id FROM orders WHERE order_date < '2024-01-01' INTERSECT SELECT customer_id FROM orders WHERE order_date >= '2024-01-01' ORDER BY customer_id;", "explain": ["INTERSECT keeps common rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m06-l01-e2", "level": "medium", "task": "customer_id of customers who ordered in 2023 but NOT in 2024, ordered by customer_id.", "starter": "SELECT ", "hint1": "Use EXCEPT.", "hint2": "2023 query first, 2024 query second.", "solution": "SELECT customer_id FROM orders WHERE order_date < '2024-01-01' EXCEPT SELECT customer_id FROM orders WHERE order_date >= '2024-01-01' ORDER BY customer_id;", "explain": ["EXCEPT = first minus second"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m06-l01-e3", "level": "easy", "task": "Return rows_union: the row count of (SELECT status FROM orders UNION SELECT status FROM orders).", "starter": "SELECT ", "hint1": "Wrap the UNION in a subquery and count.", "hint2": "UNION removes duplicates.", "solution": "SELECT COUNT(*) AS rows_union FROM (SELECT status FROM orders UNION SELECT status FROM orders);", "explain": ["only the distinct statuses remain"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m07-l01", "module": "Module 7 - Subqueries", "title": "Scalar and IN subqueries", "order": 20, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m06-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "A **subquery** is a query inside another query, in brackets. A *scalar* subquery returns one value; an `IN` subquery returns a list. Use them when you need a result before you can filter.\n\nTrade-off: joins are often faster and clearer for combining columns; subqueries read well for 'is in this list' questions. Common mistake: `NOT IN` with NULLs in the list returns nothing - prefer `NOT EXISTS`.", "examples": [{"title": "Above average", "sql": "SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products);"}], "exercises": [{"id": "m07-l01-e1", "level": "easy", "task": "Products priced above the average price: name and price.", "starter": "SELECT ", "hint1": "Average price in brackets.", "hint2": "WHERE price > (SELECT AVG(price) FROM products).", "solution": "SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products);", "explain": ["inner query runs first"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m07-l01-e2", "level": "medium", "task": "customer_id and name of customers who have a Cancelled order, ordered by customer_id.", "starter": "SELECT ", "hint1": "IN (SELECT ...).", "hint2": "Inner query: customer_id from orders where status is Cancelled.", "solution": "SELECT customer_id, name FROM customers WHERE customer_id IN (SELECT customer_id FROM orders WHERE status = 'Cancelled') ORDER BY customer_id;", "explain": ["IN checks membership in the list"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m07-l02", "module": "Module 7 - Subqueries", "title": "EXISTS, correlated subqueries, derived tables", "order": 21, "level": "intermediate", "estimatedMinutes": 20, "prerequisites": ["m07-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`EXISTS (subquery)` is true if the subquery returns any row - it stops at the first match. A **correlated** subquery refers to the outer row, so it runs once per outer row. A **derived table** is a subquery in `FROM` with an alias.\n\nIndustry use: 'employees earning above their department average', 'customers with at least one pending order', and two-step aggregations (average of per-customer counts).", "examples": [{"title": "Has pending order", "sql": "SELECT c.customer_id FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.status = 'Pending');"}], "exercises": [{"id": "m07-l02-e1", "level": "medium", "task": "customer_id of customers with at least one Pending order (use EXISTS), ordered by customer_id.", "starter": "SELECT ", "hint1": "EXISTS with a correlated condition.", "hint2": "Link o.customer_id = c.customer_id inside.", "solution": "SELECT c.customer_id FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.status = 'Pending') ORDER BY c.customer_id;", "explain": ["inner query refers to outer row"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m07-l02-e2", "level": "hard", "task": "emp_id and name of employees earning more than their own department's average salary.", "starter": "SELECT ", "hint1": "Correlate on dept_id.", "hint2": "Alias the outer table e.", "solution": "SELECT emp_id, name FROM employees e WHERE salary > (SELECT AVG(salary) FROM employees WHERE dept_id = e.dept_id);", "explain": ["average recomputed per department"], "compare": {"ordered": false, "columnNames": true, "floatTolerance": 0.01}, "dataset": "company"}, {"id": "m07-l02-e3", "level": "hard", "task": "Return avg_orders: the average number of orders per customer (among customers with orders), rounded to 2.", "starter": "SELECT ", "hint1": "Count orders per customer in a derived table.", "hint2": "Average the counts outside.", "solution": "SELECT ROUND(AVG(cnt),2) AS avg_orders FROM (SELECT COUNT(*) AS cnt FROM orders GROUP BY customer_id);", "explain": ["derived table = subquery in FROM"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m08-l01", "module": "Module 8 - CTEs", "title": "CTEs (WITH)", "order": 22, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m07-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "A **CTE** (`WITH name AS (query)`) gives a sub-result a name so the main query reads top to bottom, like steps in a recipe. You can chain several CTEs separated by commas. Supported in SQLite, PostgreSQL, MySQL 8+, SQL Server, Oracle.\n\nBest practice: one CTE per logical step with a clear name. Industry use: long MIS queries are written as a chain of CTEs so reviewers can follow them.", "examples": [{"title": "Named step", "sql": "WITH cust_orders AS (SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id) SELECT * FROM cust_orders WHERE n >= 7;"}], "exercises": [{"id": "m08-l01-e1", "level": "medium", "task": "Using a CTE: customer_id and n (order count) for customers with 7 or more orders, ordered by n desc then customer_id.", "starter": "SELECT ", "hint1": "Put the GROUP BY query in WITH.", "hint2": "Filter n >= 7 in the main query.", "solution": "WITH cust_orders AS (SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id) SELECT customer_id, n FROM cust_orders WHERE n >= 7 ORDER BY n DESC, customer_id;", "explain": ["CTE named cust_orders is used like a table"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m08-l01-e2", "level": "hard", "task": "Using two CTEs, return one row with delivered and cancelled order counts.", "starter": "SELECT ", "hint1": "Two CTEs separated by a comma.", "hint2": "Count each with a scalar subquery.", "solution": "WITH d AS (SELECT * FROM orders WHERE status = 'Delivered'), c AS (SELECT * FROM orders WHERE status = 'Cancelled') SELECT (SELECT COUNT(*) FROM d) AS delivered, (SELECT COUNT(*) FROM c) AS cancelled;", "explain": ["comma chains CTEs"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m08-l02", "module": "Module 8 - CTEs", "title": "Recursive CTEs", "order": 23, "level": "advanced", "estimatedMinutes": 15, "prerequisites": ["m08-l01"], "engines": ["sqlite"], "dataset": "company", "theory": "A **recursive CTE** has a starting query, `UNION ALL`, and a step that refers to the CTE itself, repeating until a stop condition. Use it for number/date series and hierarchies (org charts, bill of materials). PostgreSQL/MySQL/SQLite write `WITH RECURSIVE`; SQL Server and Oracle just `WITH`.\n\nCommon mistake: no stop condition, so it loops forever. Industry use: filling date gaps so days with zero sales still appear.", "examples": [{"title": "Numbers 1-5", "sql": "WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 5) SELECT i FROM n;"}], "exercises": [{"id": "m08-l02-e1", "level": "medium", "task": "Generate the 7 dates from 2024-01-01 to 2024-01-07 as column day.", "starter": "SELECT ", "hint1": "Start at 2024-01-01 and add 1 day each step.", "hint2": "Stop with WHERE day < '2024-01-07'.", "solution": "WITH RECURSIVE d(day) AS (SELECT '2024-01-01' UNION ALL SELECT date(day, '+1 day') FROM d WHERE day < '2024-01-07') SELECT day FROM d;", "explain": ["date(day,'+1 day') adds a day"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m08-l02-e2", "level": "medium", "task": "Return total: the sum of numbers 1 to 10 generated by a recursive CTE.", "starter": "SELECT ", "hint1": "Generate 1..10 then SUM.", "hint2": "SUM(i) AS total.", "solution": "WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 10) SELECT SUM(i) AS total FROM n;", "explain": ["result is 55"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m09-l01", "module": "Module 9 - Window functions", "title": "Window functions: ROW_NUMBER, RANK, DENSE_RANK", "order": 24, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m08-l02"], "engines": ["sqlite"], "dataset": "company", "theory": "A **window function** calculates over a set of related rows **without collapsing them** (unlike GROUP BY). Syntax: `function() OVER (PARTITION BY group ORDER BY sort)`. `PARTITION BY` = restart per group; `ORDER BY` = order inside it.\n\n`ROW_NUMBER` gives 1,2,3 with no ties. `RANK` leaves gaps after ties (1,1,3). `DENSE_RANK` has none (1,1,2). Common mistake: filtering a window result in WHERE - wrap it in a CTE/subquery first. Industry use: top-N per group, deduplication.", "examples": [{"title": "Rank by salary", "sql": "SELECT emp_id, salary, RANK() OVER (ORDER BY salary DESC) AS rk FROM employees LIMIT 5;"}], "exercises": [{"id": "m09-l01-e1", "level": "medium", "task": "Highest paid employee per department: dept_id, name, salary, ordered by dept_id.", "starter": "SELECT ", "hint1": "ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC).", "hint2": "Keep rn = 1 in an outer query.", "solution": "WITH r AS (SELECT dept_id, name, salary, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC, emp_id) AS rn FROM employees) SELECT dept_id, name, salary FROM r WHERE rn = 1 ORDER BY dept_id;", "explain": ["rank inside each dept", "outer query filters rn"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m09-l01-e2", "level": "medium", "task": "emp_id, salary and rk (RANK by salary highest first) for the first 5 rows ordered by rk, emp_id.", "starter": "SELECT ", "hint1": "RANK() OVER (ORDER BY salary DESC).", "hint2": "ORDER BY rk, emp_id LIMIT 5.", "solution": "SELECT emp_id, salary, RANK() OVER (ORDER BY salary DESC) AS rk FROM employees ORDER BY rk, emp_id LIMIT 5;", "explain": ["ties share a rank"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m09-l02", "module": "Module 9 - Window functions", "title": "Running totals and moving averages", "order": 25, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m09-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Adding `ORDER BY` inside OVER makes `SUM` a **running total**. A **frame** limits the rows: `ROWS BETWEEN 2 PRECEDING AND CURRENT ROW` = this row and the two before. Others: `UNBOUNDED PRECEDING`, `RANGE`, `GROUPS`.\n\nIndustry use: cumulative sales to date, 7-day moving averages to smooth noisy KPIs.", "examples": [{"title": "Running total", "sql": "SELECT payment_id, amount, SUM(amount) OVER (ORDER BY payment_id) AS running FROM payments LIMIT 5;"}], "exercises": [{"id": "m09-l02-e1", "level": "medium", "task": "Payments 1 to 5: payment_id, amount, running (running total by payment_id).", "starter": "SELECT ", "hint1": "SUM(amount) OVER (ORDER BY payment_id).", "hint2": "Add WHERE payment_id <= 5.", "solution": "SELECT payment_id, amount, SUM(amount) OVER (ORDER BY payment_id) AS running FROM payments WHERE payment_id <= 5 ORDER BY payment_id;", "explain": ["ORDER BY in OVER = running"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m09-l02-e2", "level": "hard", "task": "Payments 1 to 6: payment_id and ma3 (average of amount over this and the 2 previous payments).", "starter": "SELECT ", "hint1": "AVG(amount) OVER (...) with a frame.", "hint2": "ROWS BETWEEN 2 PRECEDING AND CURRENT ROW.", "solution": "SELECT payment_id, AVG(amount) OVER (ORDER BY payment_id ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS ma3 FROM payments WHERE payment_id <= 6 ORDER BY payment_id;", "explain": ["frame = last 3 rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m09-l03", "module": "Module 9 - Window functions", "title": "LAG, LEAD and growth (MoM)", "order": 26, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m09-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "`LAG(col)` reads the previous row's value, `LEAD(col)` the next. Together with a CTE they give month-on-month (MoM) and year-on-year (YoY) growth. Others: `FIRST_VALUE`, `LAST_VALUE`, `NTH_VALUE`, `NTILE`, `PERCENT_RANK`, `CUME_DIST`.\n\nGrowth % = (this - previous) / previous x 100. The first row has no previous, so LAG gives NULL. Industry use: MoM revenue, days between orders, churn timing.", "examples": [{"title": "Previous month", "sql": "WITH m AS (SELECT strftime('%Y-%m', paid_date) AS ym, ROUND(SUM(amount),2) AS rev FROM payments GROUP BY ym) SELECT ym, rev, LAG(rev) OVER (ORDER BY ym) AS prev_rev FROM m LIMIT 4;"}], "exercises": [{"id": "m09-l03-e1", "level": "hard", "task": "First 6 months by paid_date: ym (YYYY-MM), rev (SUM of amount rounded to 2), prev_rev (previous month's rev).", "starter": "SELECT ", "hint1": "CTE for monthly revenue, then LAG.", "hint2": "LAG(rev) OVER (ORDER BY ym).", "solution": "WITH m AS (SELECT strftime('%Y-%m', paid_date) AS ym, ROUND(SUM(amount),2) AS rev FROM payments GROUP BY ym) SELECT ym, rev, LAG(rev) OVER (ORDER BY ym) AS prev_rev FROM m ORDER BY ym LIMIT 6;", "explain": ["LAG looks one row back"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m09-l03-e2", "level": "hard", "task": "Same 6 months: ym and mom_pct = MoM growth % rounded to 1 decimal.", "starter": "SELECT ", "hint1": "(rev - previous) / previous * 100.", "hint2": "Use LAG twice.", "solution": "WITH m AS (SELECT strftime('%Y-%m', paid_date) AS ym, SUM(amount) AS rev FROM payments GROUP BY ym) SELECT ym, ROUND(100.0 * (rev - LAG(rev) OVER (ORDER BY ym)) / LAG(rev) OVER (ORDER BY ym), 1) AS mom_pct FROM m ORDER BY ym LIMIT 6;", "explain": ["first month is NULL"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m09-l03-e3", "level": "medium", "task": "Customer 1's orders: order_id, order_date, prev_date (date of their previous order), ordered by order_date, order_id.", "starter": "SELECT ", "hint1": "LAG(order_date) OVER (ORDER BY order_date, order_id).", "hint2": "Filter customer_id = 1.", "solution": "SELECT order_id, order_date, LAG(order_date) OVER (ORDER BY order_date, order_id) AS prev_date FROM orders WHERE customer_id = 1 ORDER BY order_date, order_id;", "explain": ["WHERE runs before the window"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m09-l04", "module": "Module 9 - Window functions", "title": "Top-N per group and deduplication", "order": 27, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m09-l03"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "Two classic patterns with `ROW_NUMBER`: **Top-N per group** (`PARTITION BY group ORDER BY metric DESC`, keep `rn <= N`) and **deduplication** (`PARTITION BY` the columns that define a duplicate, keep `rn = 1`, delete `rn > 1`).\n\nIndustry use: latest record per customer, top 3 products per category, cleaning duplicate rows before loading. Gaps-and-islands and sessionization build on the same idea (difference of two row numbers).", "examples": [{"title": "Top 1 per category", "sql": "SELECT category_id, name FROM (SELECT category_id, name, ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY price DESC) AS rn FROM products) WHERE rn = 1;"}], "exercises": [{"id": "m09-l04-e1", "level": "hard", "task": "Top 2 most expensive products per category: category_id, name, price, ordered by category_id then price desc.", "starter": "SELECT ", "hint1": "ROW_NUMBER per category, price DESC.", "hint2": "Keep rn <= 2 outside.", "solution": "SELECT category_id, name, price FROM (SELECT category_id, name, price, ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY price DESC) AS rn FROM products) WHERE rn <= 2 ORDER BY category_id, price DESC;", "explain": ["rank inside each category"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m09-l04-e2", "level": "hard", "task": "In dirty_customers, return id of the duplicate rows to delete (rows identical in name, email, phone, city, signup_date, age to an earlier id), ordered by id.", "starter": "SELECT ", "hint1": "PARTITION BY all the compared columns.", "hint2": "Keep rows where rn > 1.", "solution": "SELECT id FROM (SELECT id, ROW_NUMBER() OVER (PARTITION BY name, email, phone, city, signup_date, age ORDER BY id) AS rn FROM dirty_customers) WHERE rn > 1 ORDER BY id;", "explain": ["rn = 1 is the keeper, rn > 1 are duplicates"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "dataset": "dirty"}]}, {"id": "m10-l01", "module": "Module 10 - Data modification (DML)", "title": "INSERT: single, multi-row, INSERT...SELECT", "order": 28, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m09-l04"], "engines": ["sqlite"], "dataset": "company", "theory": "`INSERT INTO table (cols) VALUES (...)` adds a row. Add many rows with several `(...)` groups, or copy rows from a query with `INSERT INTO t SELECT ...`. Always list the column names so the statement survives schema changes.\n\nCommon mistake: wrong column order or missing NOT NULL columns. Industry use: loading staging tables and building summary tables from raw data. Exercises here check the **table state** after your SQL runs.", "examples": [{"title": "Read first", "sql": "SELECT * FROM departments;"}], "exercises": [{"id": "m10-l01-e1", "level": "easy", "task": "Insert one department: dept_id 5, dept_name 'Marketing'.", "starter": "INSERT INTO ", "hint1": "INSERT INTO departments (...) VALUES (...).", "hint2": "VALUES (5, 'Marketing').", "solution": "INSERT INTO departments (dept_id, dept_name) VALUES (5, 'Marketing');", "explain": ["column list then matching values"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT dept_id, dept_name FROM departments ORDER BY dept_id"}}, {"id": "m10-l01-e2", "level": "easy", "task": "Insert two departments in ONE statement: (5,'Marketing') and (6,'Legal').", "starter": "INSERT INTO ", "hint1": "Separate row groups with a comma.", "hint2": "One VALUES list, two groups.", "solution": "INSERT INTO departments (dept_id, dept_name) VALUES (5, 'Marketing'), (6, 'Legal');", "explain": ["multi-row insert is faster than many single inserts"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT dept_id, dept_name FROM departments ORDER BY dept_id"}}, {"id": "m10-l01-e3", "level": "hard", "task": "Create table top_earners(emp_id INTEGER, salary REAL) and fill it from employees with salary above 95000.", "starter": "CREATE TABLE ", "hint1": "Two statements: CREATE TABLE, then INSERT ... SELECT.", "hint2": "Filter with WHERE salary > 95000.", "solution": "CREATE TABLE top_earners (emp_id INTEGER, salary REAL); INSERT INTO top_earners (emp_id, salary) SELECT emp_id, salary FROM employees WHERE salary > 95000;", "explain": ["INSERT ... SELECT copies query rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT emp_id, salary FROM top_earners ORDER BY emp_id"}}]}, {"id": "m10-l02", "module": "Module 10 - Data modification (DML)", "title": "UPDATE, DELETE and safe-update practice", "order": 29, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m10-l01"], "engines": ["sqlite"], "dataset": "company", "theory": "`UPDATE t SET col = value WHERE ...` changes rows; `DELETE FROM t WHERE ...` removes them; `TRUNCATE` (not in SQLite) empties a table fast.\n\n**Safe practice:** 1) run the same WHERE as a SELECT first and check the row count, 2) wrap in a transaction, 3) never run UPDATE/DELETE without WHERE, 4) test in dev, keep a backup or use soft deletes (an `is_deleted` flag) in production. A missing WHERE changes every row.", "examples": [{"title": "Preview before delete", "sql": "SELECT COUNT(*) FROM employees WHERE hire_date < '2019-01-01';"}], "exercises": [{"id": "m10-l02-e1", "level": "easy", "task": "Give department 3 (HR) a 5% raise.", "starter": "UPDATE ", "hint1": "UPDATE ... SET salary = salary * 1.05.", "hint2": "WHERE dept_id = 3.", "solution": "UPDATE employees SET salary = salary * 1.05 WHERE dept_id = 3;", "explain": ["WHERE limits the change to HR"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT dept_id, ROUND(SUM(salary),2) AS total FROM employees GROUP BY dept_id ORDER BY dept_id"}}, {"id": "m10-l02-e2", "level": "medium", "task": "Delete employees hired before 2019-01-01.", "starter": "DELETE FROM ", "hint1": "DELETE FROM employees WHERE ...", "hint2": "hire_date < '2019-01-01'.", "solution": "DELETE FROM employees WHERE hire_date < '2019-01-01';", "explain": ["preview with SELECT first"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS cnt FROM employees"}}]}, {"id": "m10-l03", "module": "Module 10 - Data modification (DML)", "title": "UPSERT and RETURNING", "order": 30, "level": "advanced", "estimatedMinutes": 15, "prerequisites": ["m10-l02"], "engines": ["sqlite"], "dataset": "company", "theory": "**UPSERT** = insert, or update if the key already exists. SQLite/PostgreSQL: `INSERT ... ON CONFLICT (key) DO UPDATE SET col = excluded.col`. MySQL: `ON DUPLICATE KEY UPDATE`. SQL Server/Oracle: `MERGE`.\n\n`RETURNING` (PostgreSQL, SQLite 3.35+) gives back the affected rows; SQL Server uses `OUTPUT`. Industry use: daily loads that must be safe to re-run.", "examples": [{"title": "Read", "sql": "SELECT * FROM departments;"}], "exercises": [{"id": "m10-l03-e1", "level": "medium", "task": "Insert dept_id 4 with name 'Finance & Accounts'; if dept_id 4 exists, update its name instead.", "starter": "INSERT INTO ", "hint1": "ON CONFLICT (dept_id) DO UPDATE.", "hint2": "SET dept_name = excluded.dept_name.", "solution": "INSERT INTO departments (dept_id, dept_name) VALUES (4, 'Finance & Accounts') ON CONFLICT (dept_id) DO UPDATE SET dept_name = excluded.dept_name;", "explain": ["excluded = the row you tried to insert"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT dept_id, dept_name FROM departments ORDER BY dept_id"}}, {"id": "m10-l03-e2", "level": "hard", "task": "Insert department 'Ops' (let dept_id auto-assign) and return dept_id and dept_name of the new row with RETURNING.", "starter": "INSERT INTO ", "hint1": "Add RETURNING at the end.", "hint2": "RETURNING dept_id, dept_name.", "solution": "INSERT INTO departments (dept_name) VALUES ('Ops') RETURNING dept_id, dept_name;", "explain": ["RETURNING shows the new row"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m11-l01", "module": "Module 11 - Database design (DDL)", "title": "CREATE, ALTER and constraints", "order": 31, "level": "intermediate", "estimatedMinutes": 20, "prerequisites": ["m10-l03"], "engines": ["sqlite"], "dataset": "company", "theory": "DDL defines structure: `CREATE TABLE`, `ALTER TABLE`, `DROP TABLE`. **Constraints** protect data: `PRIMARY KEY` (unique row id), `FOREIGN KEY` (must exist in another table), `UNIQUE`, `NOT NULL`, `CHECK (rule)`, `DEFAULT value`.\n\nAuto-numbering: SQLite `INTEGER PRIMARY KEY`, PostgreSQL `GENERATED ... AS IDENTITY`, MySQL `AUTO_INCREMENT`, SQL Server `IDENTITY`, Oracle sequences. Best practice: snake_case names, a surrogate key per table, migrations kept in version control. DROP is permanent - check twice.", "examples": [{"title": "Table info", "sql": "SELECT name, type, pk FROM pragma_table_info('employees');"}], "exercises": [{"id": "m11-l01-e1", "level": "medium", "task": "Create table students: student_id INTEGER PRIMARY KEY, email TEXT NOT NULL UNIQUE, age INTEGER CHECK (age >= 16), status TEXT DEFAULT 'active'.", "starter": "CREATE TABLE ", "hint1": "Four columns, constraints after the type.", "hint2": "status TEXT DEFAULT 'active'.", "solution": "CREATE TABLE students (student_id INTEGER PRIMARY KEY, email TEXT NOT NULL UNIQUE, age INTEGER CHECK (age >= 16), status TEXT DEFAULT 'active');", "explain": ["constraints enforce rules in the database itself", "the checker compares names, types, NOT NULL, default and key"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT name, type, \"notnull\", dflt_value, pk FROM pragma_table_info('students') ORDER BY cid"}}, {"id": "m11-l01-e2", "level": "easy", "task": "Add a TEXT column email to employees.", "starter": "ALTER TABLE ", "hint1": "ALTER TABLE ... ADD COLUMN.", "hint2": "ALTER TABLE employees ADD COLUMN email TEXT.", "solution": "ALTER TABLE employees ADD COLUMN email TEXT;", "explain": ["new column is NULL for old rows"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS cols FROM pragma_table_info('employees')"}}]}, {"id": "m11-l02", "module": "Module 11 - Database design (DDL)", "title": "ER design, normalization and junction tables", "order": 32, "level": "intermediate", "estimatedMinutes": 20, "prerequisites": ["m11-l01"], "engines": ["sqlite"], "dataset": "company", "theory": "**Relationships:** 1:1, 1:N (one customer, many orders: put the foreign key on the 'many' side), M:N (students and courses: needs a **junction table** holding both keys).\n\n**Normalization** removes repeated data: **1NF** one value per cell, **2NF** every column depends on the whole key, **3NF** no column depends on another non-key column, **BCNF** every determinant is a key. **Denormalization** (copying data) trades storage for speed in reporting. **Surrogate key** = generated id; **natural key** = real-world value (email). Also learn schemas/namespaces and migrations.", "examples": [{"title": "See tables", "sql": "SELECT name FROM sqlite_master WHERE type = 'table';"}], "exercises": [{"id": "m11-l02-e1", "level": "hard", "task": "Create courses(course_id INTEGER PRIMARY KEY, title TEXT) and the junction table enrollments(student_id INTEGER, course_id INTEGER, PRIMARY KEY (student_id, course_id)).", "starter": "CREATE TABLE ", "hint1": "Two CREATE TABLE statements.", "hint2": "Composite key: PRIMARY KEY (student_id, course_id).", "solution": "CREATE TABLE courses (course_id INTEGER PRIMARY KEY, title TEXT); CREATE TABLE enrollments (student_id INTEGER, course_id INTEGER, PRIMARY KEY (student_id, course_id));", "explain": ["junction table = M:N link", "composite primary key prevents duplicate enrollments"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT m.name AS tbl, p.name AS col, p.pk FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type = 'table' AND m.name IN ('courses','enrollments') ORDER BY m.name, p.cid"}}]}, {"id": "m12-l01", "module": "Module 12 - Views and programmable objects", "title": "Views", "order": 33, "level": "intermediate", "estimatedMinutes": 15, "prerequisites": ["m11-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "A **view** is a saved query you use like a table. It hides complex joins, gives one trusted definition of a KPI, and can limit which columns people see. A **materialized view** (PostgreSQL, Oracle, Snowflake) stores the result and must be refreshed; simple views can be updatable.\n\nIndustry use: BI tools (Power BI, Excel) connect to views, not raw tables.", "examples": [{"title": "Create view", "sql": "CREATE VIEW v_demo AS SELECT status, COUNT(*) AS n FROM orders GROUP BY status;"}], "exercises": [{"id": "m12-l01-e1", "level": "medium", "task": "Create view v_order_status with columns status and n (number of orders per status).", "starter": "CREATE VIEW ", "hint1": "CREATE VIEW name AS SELECT ...", "hint2": "GROUP BY status.", "solution": "CREATE VIEW v_order_status AS SELECT status, COUNT(*) AS n FROM orders GROUP BY status;", "explain": ["a view stores the query, not data"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT status, n FROM v_order_status ORDER BY status"}}, {"id": "m12-l01-e2", "level": "hard", "task": "Create view v_unpaid_orders listing order_id of orders with no payment.", "starter": "CREATE VIEW ", "hint1": "LEFT JOIN then IS NULL.", "hint2": "Wrap with CREATE VIEW ... AS.", "solution": "CREATE VIEW v_unpaid_orders AS SELECT o.order_id FROM orders o LEFT JOIN payments p ON p.order_id = o.order_id WHERE p.payment_id IS NULL;", "explain": ["reuse the anti-join from Module 5"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT COUNT(*) AS n FROM v_unpaid_orders"}}]}, {"id": "m12-l02", "module": "Module 12 - Views and programmable objects", "title": "Triggers, procedures and functions", "order": 34, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m12-l01"], "engines": ["sqlite"], "dataset": "company", "theory": "A **trigger** runs automatically on INSERT/UPDATE/DELETE (BEFORE, AFTER, or INSTEAD OF in some engines). SQLite supports triggers; use `OLD.col` and `NEW.col` for the before/after values.\n\n**Stored procedures and functions** (not available in SQLite, so not runnable here): SQL Server T-SQL `CREATE PROCEDURE p @id INT AS BEGIN ... END`; PostgreSQL `CREATE FUNCTION f() RETURNS ... LANGUAGE plpgsql`; MySQL `CREATE PROCEDURE p(IN id INT) BEGIN ... END`; Oracle PL/SQL `CREATE PROCEDURE p (id IN NUMBER) IS BEGIN ... END;`. They support parameters (IN/OUT), IF/WHILE, and error handling (TRY...CATCH, EXCEPTION). **Cursors** loop row by row - avoid them, set-based SQL is far faster. **Dynamic SQL** builds queries as text - always parameterize to prevent injection.", "examples": [{"title": "Read", "sql": "SELECT emp_id, salary FROM employees LIMIT 3;"}], "exercises": [{"id": "m12-l02-e1", "level": "hard", "task": "Create salary_log(emp_id INTEGER, old_salary REAL, new_salary REAL) and an AFTER UPDATE OF salary trigger on employees that logs OLD.emp_id, OLD.salary, NEW.salary. Then raise emp 1's salary by 1.", "starter": "CREATE TABLE ", "hint1": "Create the table, then the trigger, then the UPDATE.", "hint2": "Trigger body goes between BEGIN and END;.", "solution": "CREATE TABLE salary_log (emp_id INTEGER, old_salary REAL, new_salary REAL); CREATE TRIGGER trg_salary AFTER UPDATE OF salary ON employees BEGIN INSERT INTO salary_log VALUES (OLD.emp_id, OLD.salary, NEW.salary); END; UPDATE employees SET salary = salary + 1 WHERE emp_id = 1;", "explain": ["OLD = before, NEW = after", "the UPDATE fires the trigger"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT emp_id, old_salary, new_salary FROM salary_log"}}]}, {"id": "m13-l01", "module": "Module 13 - Transactions", "title": "Transactions, ACID and isolation", "order": 35, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m12-l02"], "engines": ["sqlite"], "dataset": "company", "theory": "A **transaction** groups statements so they all succeed or none do. **ACID:** Atomic (all or nothing), Consistent (rules hold), Isolated (transactions do not disturb each other), Durable (committed data survives a crash). Commands: `BEGIN`, `COMMIT`, `ROLLBACK`, `SAVEPOINT name` / `ROLLBACK TO name`.\n\n**Isolation levels** (PostgreSQL/SQL Server/MySQL, not demonstrable here): READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE - higher levels prevent dirty reads, non-repeatable reads and phantom reads but allow less concurrency. **MVCC** keeps row versions so readers do not block writers; **locks** protect writes; a **deadlock** happens when two transactions wait on each other and one is cancelled. Optimistic concurrency checks a version at save time; pessimistic locks first.", "examples": [{"title": "Total", "sql": "SELECT ROUND(SUM(salary),2) AS total FROM employees;"}], "exercises": [{"id": "m13-l01-e1", "level": "medium", "task": "Inside a transaction raise ALL salaries by 10%, then ROLLBACK so nothing changes.", "starter": "BEGIN; ", "hint1": "BEGIN; ... ROLLBACK;", "hint2": "UPDATE between them.", "solution": "BEGIN; UPDATE employees SET salary = salary * 1.1; ROLLBACK;", "explain": ["ROLLBACK undoes the update"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT ROUND(SUM(salary),2) AS total FROM employees"}}, {"id": "m13-l01-e2", "level": "medium", "task": "In a transaction add 1000 to salary of dept 1 and COMMIT.", "starter": "BEGIN; ", "hint1": "BEGIN; UPDATE ...; COMMIT;", "hint2": "WHERE dept_id = 1.", "solution": "BEGIN; UPDATE employees SET salary = salary + 1000 WHERE dept_id = 1; COMMIT;", "explain": ["COMMIT makes it permanent"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT dept_id, ROUND(SUM(salary),2) AS total FROM employees GROUP BY dept_id ORDER BY dept_id"}}, {"id": "m13-l01-e3", "level": "hard", "task": "BEGIN; add 1000 to dept 1; SAVEPOINT sp1; add 1000 to dept 2; ROLLBACK TO sp1; COMMIT. Only dept 1 should change.", "starter": "BEGIN; ", "hint1": "Use SAVEPOINT sp1 between the two updates.", "hint2": "ROLLBACK TO sp1 undoes only the second update.", "solution": "BEGIN; UPDATE employees SET salary = salary + 1000 WHERE dept_id = 1; SAVEPOINT sp1; UPDATE employees SET salary = salary + 1000 WHERE dept_id = 2; ROLLBACK TO sp1; COMMIT;", "explain": ["savepoint = partial rollback"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT dept_id, ROUND(SUM(salary),2) AS total FROM employees GROUP BY dept_id ORDER BY dept_id"}}]}, {"id": "m14-l01", "module": "Module 14 - Indexes and performance", "title": "Indexes and execution plans", "order": 36, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m13-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "An **index** is like a book's index: the database jumps to rows instead of reading every page. Types: **B-tree** (default), hash, bitmap, **clustered** (data stored in index order) vs non-clustered, **covering** (holds all needed columns), **composite** (several columns; leftmost column first), **partial**, full-text. Indexes speed reads but slow writes and use space.\n\nRead plans with `EXPLAIN` (PostgreSQL `EXPLAIN ANALYZE`, SQLite `EXPLAIN QUERY PLAN`, SQL Server execution plan). Look for SCAN (reads all rows) vs SEARCH using an index.", "examples": [{"title": "Plan", "sql": "EXPLAIN QUERY PLAN SELECT * FROM orders WHERE customer_id = 5;"}], "exercises": [{"id": "m14-l01-e1", "level": "easy", "task": "Create index idx_orders_customer on orders(customer_id).", "starter": "CREATE INDEX ", "hint1": "CREATE INDEX name ON table (col).", "hint2": "ON orders (customer_id).", "solution": "CREATE INDEX idx_orders_customer ON orders (customer_id);", "explain": ["index speeds customer lookups"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT name FROM sqlite_master WHERE type = 'index' AND tbl_name = 'orders'"}}, {"id": "m14-l01-e2", "level": "medium", "task": "Create UNIQUE index ux_customers_email on customers(email).", "starter": "CREATE UNIQUE INDEX ", "hint1": "CREATE UNIQUE INDEX ...", "hint2": "ON customers (email).", "solution": "CREATE UNIQUE INDEX ux_customers_email ON customers (email);", "explain": ["unique index also blocks duplicates"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT name, \"unique\" FROM pragma_index_list('customers') WHERE name = 'ux_customers_email'"}}, {"id": "m14-l01-e3", "level": "medium", "task": "Create composite index idx_orders_cust_date on orders(customer_id, order_date).", "starter": "CREATE INDEX ", "hint1": "List both columns in brackets.", "hint2": "Order: customer_id then order_date.", "solution": "CREATE INDEX idx_orders_cust_date ON orders (customer_id, order_date);", "explain": ["leftmost column must be filtered first"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}, "check": {"type": "state", "verify": "SELECT seqno, name FROM pragma_index_info('idx_orders_cust_date') ORDER BY seqno"}}]}, {"id": "m14-l02", "module": "Module 14 - Indexes and performance", "title": "Sargable queries and performance anti-patterns", "order": 37, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m14-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**Sargable** = the database can use an index. Wrapping a column in a function (`strftime('%Y', order_date) = '2024'`) usually blocks the index; rewrite as a range (`order_date >= '2024-01-01' AND order_date < '2025-01-01'`). Leading wildcards (`LIKE '%abc'`) also block it.\n\nAnti-patterns: `SELECT *` on wide tables, `OFFSET 100000` pagination (use keyset: `WHERE id > last_id ORDER BY id LIMIT n`), functions in JOIN conditions, N+1 queries (one query per row from application code - fetch in one JOIN instead), cursors. Scale concepts: statistics, join order, partitioning (split one table by range), sharding (split across servers), caching.", "examples": [{"title": "Range filter", "sql": "SELECT COUNT(*) FROM orders WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01';"}], "exercises": [{"id": "m14-l02-e1", "level": "medium", "task": "Count orders placed in 2024 as n, using a sargable date range (no functions on order_date).", "starter": "SELECT ", "hint1": "Use >= and <.", "hint2": "Start 2024-01-01, end before 2025-01-01.", "solution": "SELECT COUNT(*) AS n FROM orders WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01';", "explain": ["range filter can use an index"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m14-l02-e2", "level": "medium", "task": "Keyset pagination: the next 5 order_id values after order_id 100, in order.", "starter": "SELECT ", "hint1": "WHERE order_id > 100.", "hint2": "ORDER BY order_id LIMIT 5.", "solution": "SELECT order_id FROM orders WHERE order_id > 100 ORDER BY order_id LIMIT 5;", "explain": ["no OFFSET needed, stays fast on deep pages"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m15-l01", "module": "Module 15 - Advanced analytics SQL", "title": "Cohort analysis and repeat rate", "order": 38, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m14-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "A **cohort** is a group of customers who started in the same period (e.g. first order month). Compare cohorts over time to see **retention** (who comes back). Pattern: find each customer's first date with `MIN()` in a CTE, then group by that month.\n\nIndustry use: product and growth teams track retention by cohort; a high **repeat rate** means customers return.", "examples": [{"title": "First order", "sql": "SELECT customer_id, MIN(order_date) AS first_date FROM orders GROUP BY customer_id LIMIT 5;"}], "exercises": [{"id": "m15-l01-e1", "level": "hard", "task": "First 6 cohorts: cohort (YYYY-MM of each customer's first order) and customers, ordered by cohort.", "starter": "SELECT ", "hint1": "CTE with MIN(order_date) per customer.", "hint2": "Group the CTE by strftime('%Y-%m', first_date).", "solution": "WITH f AS (SELECT customer_id, MIN(order_date) AS first_date FROM orders GROUP BY customer_id) SELECT strftime('%Y-%m', first_date) AS cohort, COUNT(*) AS customers FROM f GROUP BY cohort ORDER BY cohort LIMIT 6;", "explain": ["MIN gives the first order", "each customer counted once"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l01-e2", "level": "hard", "task": "Repeat rate: repeat_pct = % of customers (with orders) who have more than one order, rounded to 1 decimal.", "starter": "SELECT ", "hint1": "Orders per customer in a derived table.", "hint2": "Conditional SUM / COUNT(*) x 100.0.", "solution": "SELECT ROUND(100.0 * SUM(CASE WHEN n > 1 THEN 1 ELSE 0 END) / COUNT(*), 1) AS repeat_pct FROM (SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id);", "explain": ["conditional aggregation over a derived table"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m15-l02", "module": "Module 15 - Advanced analytics SQL", "title": "Funnel analysis and CASE-based pivots", "order": 39, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m15-l01"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "A **funnel** counts how many users reach each step (view -> click -> add_to_cart -> checkout -> purchase) so you see where people drop off. A **pivot** turns row values into columns. `PIVOT`/`UNPIVOT` exist in SQL Server and Oracle; everywhere (including SQLite) you can pivot with `SUM(CASE WHEN ...)`.\n\nOther topics in this module: A/B test queries (compare a metric between two groups), JSON/semi-structured data, full-text search, geospatial basics, time-series gap filling (join to a generated date series).", "examples": [{"title": "Events", "sql": "SELECT event_type, COUNT(*) AS n FROM web_events GROUP BY event_type;"}], "exercises": [{"id": "m15-l02-e1", "level": "medium", "task": "Funnel: event_type and users (distinct customers, ignore events without customer), highest users first then event_type.", "starter": "SELECT ", "hint1": "COUNT(DISTINCT customer_id) per event_type.", "hint2": "Filter customer_id IS NOT NULL.", "solution": "SELECT event_type, COUNT(DISTINCT customer_id) AS users FROM web_events WHERE customer_id IS NOT NULL GROUP BY event_type ORDER BY users DESC, event_type;", "explain": ["distinct users per step"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l02-e2", "level": "hard", "task": "Pivot: yr, delivered, cancelled order counts per year, ordered by yr.", "starter": "SELECT ", "hint1": "One SUM(CASE...) per output column.", "hint2": "GROUP BY the year.", "solution": "SELECT strftime('%Y', order_date) AS yr, SUM(CASE WHEN status = 'Delivered' THEN 1 ELSE 0 END) AS delivered, SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) AS cancelled FROM orders GROUP BY yr ORDER BY yr;", "explain": ["CASE inside SUM pivots rows into columns"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m15-l03", "module": "Module 15 - Advanced analytics SQL", "title": "RFM customer segmentation", "order": 40, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m15-l02"], "engines": ["sqlite"], "dataset": "ecommerce", "theory": "**RFM** scores each customer on **R**ecency (how recently they bought), **F**requency (how often) and **M**onetary (how much). Split each into groups with `NTILE(4)` (4 = best/worst depending on order). Combine scores into segments like Champions or At Risk.\n\nIndustry use: marketing decides who gets discounts, win-back mails or VIP offers.", "examples": [{"title": "Money per customer", "sql": "SELECT o.customer_id, ROUND(SUM(p.amount),2) AS monetary FROM payments p JOIN orders o ON o.order_id = p.order_id GROUP BY o.customer_id ORDER BY monetary DESC LIMIT 5;"}], "exercises": [{"id": "m15-l03-e1", "level": "medium", "task": "Top 5 customers by total paid amount: customer_id and monetary (rounded to 2).", "starter": "SELECT ", "hint1": "Join payments to orders.", "hint2": "GROUP BY customer_id, ORDER BY monetary DESC.", "solution": "SELECT o.customer_id, ROUND(SUM(p.amount),2) AS monetary FROM payments p JOIN orders o ON o.order_id = p.order_id GROUP BY o.customer_id ORDER BY monetary DESC LIMIT 5;", "explain": ["monetary = total spend"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}, {"id": "m15-l03-e2", "level": "hard", "task": "For customers 1 to 5 who have payments: customer_id and m_quartile (NTILE(4) over total paid, highest = 1), ordered by customer_id.", "starter": "SELECT ", "hint1": "Compute NTILE over ALL customers first, then filter.", "hint2": "Filter customer_id <= 5 in the last step.", "solution": "WITH m AS (SELECT o.customer_id, SUM(p.amount) AS monetary FROM payments p JOIN orders o ON o.order_id = p.order_id GROUP BY o.customer_id), q AS (SELECT customer_id, NTILE(4) OVER (ORDER BY monetary DESC) AS m_quartile FROM m) SELECT customer_id, m_quartile FROM q WHERE customer_id <= 5 ORDER BY customer_id;", "explain": ["filtering before NTILE would change the groups"], "compare": {"ordered": true, "columnNames": true, "floatTolerance": 0.01}}]}, {"id": "m15-l04", "module": "Module 15 - Advanced analytics SQL", "title": "Telecom KPIs: ARPU, churn, rolling averages", "order": 41, "level": "advanced", "estimatedMinutes": 20, "prerequisites": ["m15-l03"], "engines": ["sqlite"], "dataset": "telecom", "theory": "**ARPU** = revenue / subscribers. **Churn rate** = churned subscribers / total. A **rolling KPI** smooths noise (e.g. 3-month rolling average) using a window frame.\n\nIndustry use: MIS teams in telecom report subscriber base, recharge revenue, ARPU and chu
