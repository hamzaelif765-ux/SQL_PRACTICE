name: Build Android APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files (SQL engine bundled for offline use)
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm i sql.js@1.10.3 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp node_modules/sql.js/dist/sql-wasm.js node_modules/sql.js/dist/sql-wasm.wasm www/
      - name: Create Android project
        run: |
          npx cap init SQLForge com.sqlforge.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SQLForge APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
